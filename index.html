<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Planner</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<script>
/* ==================================================================
   CONFIG
   ================================================================== */
var CONFIG = {
  // Apps Script web app URL for the PLANNER backend. Must end in /exec
  API_URL: 'https://script.google.com/macros/s/AKfycbyQ-uN2ocf1HxjNryJVtBY2wx5-SL3vbIfeOwHb54Wj4cZZ56Csv374grHRWmTODMRk/exec',

  STYLE: 'https://tiles.openfreemap.org/styles/liberty',
  CENTRE: [73.8567, 18.5204],   // Pune [lng, lat]
  ZOOM: 11,

  // Search bias — results near here rank higher
  SEARCH_NEAR: { lat: 18.5204, lon: 73.8567 }
};
/* ================================================================== */
</script>

<style>
  :root{
    --blue:#1A73E8; --blue-dark:#1557B0; --blue-soft:#E8F0FE;
    --orange:#F57C00; --purple:#7B1FA2; --red:#D93025; --green:#137333;
    --ink:#202124; --grey:#5F6368; --line:#DADCE0;
    --bg:#fff; --hover:#F1F3F4; --side:400px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{ font-family:inherit; }

  #map{ position:fixed; top:0; bottom:0; right:0; left:var(--side); background:#E8EAED; }

  .side{
    position:fixed; top:0; bottom:0; left:0; width:var(--side);
    border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:900;
    background:var(--bg);
  }

  .head{ padding:14px 16px 0; }
  .head h1{ font-size:16px; font-weight:600; margin:0 0 12px; }

  /* breadcrumb */
  .crumbs{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .crumb{
    font-size:11.5px; padding:4px 9px; border-radius:20px;
    background:var(--hover); color:var(--grey); white-space:nowrap;
    max-width:150px; overflow:hidden; text-overflow:ellipsis;
  }
  .crumb.on{ background:var(--blue-soft); color:var(--blue-dark); font-weight:500; }

  .body{ flex:1; overflow-y:auto; padding:0 16px 16px; }
  .foot{ padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; }

  .btn{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); font-size:13.5px; font-weight:500; cursor:pointer; color:var(--ink);
  }
  .btn:hover{ background:var(--hover); }
  .btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.primary:hover{ background:var(--blue-dark); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.wide{ width:100%; flex:none; }
  .btn.big{ padding:14px; font-size:15px; }

  .lead{ font-size:13px; color:var(--grey); line-height:1.55; margin:0 0 14px; }
  .sec{ font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--grey);
        margin:18px 0 8px; font-weight:600; }

  /* search */
  .searchbox{
    display:flex; align-items:center; gap:9px; border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:4px;
  }
  .searchbox:focus-within{ border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .searchbox input{ flex:1; min-width:0; border:0; outline:0; font-size:14px; }
  .spin{
    width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--blue);
    border-radius:50%; animation:sp .7s linear infinite; display:none;
  }
  .spin.on{ display:block; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  .hits{ border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; display:none; }
  .hits.on{ display:block; }
  .hit{ padding:10px 12px; border-bottom:1px solid #EEF0F2; cursor:pointer; }
  .hit:last-child{ border-bottom:0; }
  .hit:hover{ background:var(--hover); }
  .hit b{ display:block; font-size:13.5px; font-weight:500; }
  .hit span{ font-size:12px; color:var(--grey); }

  /* list rows */
  .row{
    display:flex; align-items:center; gap:10px; padding:11px 12px;
    border:1px solid var(--line); border-radius:8px; margin-bottom:7px; cursor:pointer;
  }
  .row:hover{ background:var(--hover); }
  .row.sel{ border-color:var(--blue); background:var(--blue-soft); }
  .row__main{ flex:1; min-width:0; }
  .row__main b{ display:block; font-size:13.5px; font-weight:500;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row__main span{ font-size:11.5px; color:var(--grey);
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .del{
    border:0; background:transparent; color:var(--grey); cursor:pointer;
    font-size:17px; line-height:1; padding:2px 4px; border-radius:5px;
  }
  .del:hover{ background:#FCE8E6; color:var(--red); }

  /* form */
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--grey); margin-bottom:5px; }
  .field label i{ color:var(--red); font-style:normal; }
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; outline:none;
  }
  .field input:focus{ border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .field input.bad{ border-color:var(--red); }
  .two{ display:flex; gap:10px; }
  .two .field{ flex:1; }

  .msg{ font-size:12.5px; line-height:1.5; margin-top:10px; }
  .msg.bad{ color:var(--red); }
  .msg.good{ color:var(--green); }

  /* map-step legend */
  .legend{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .chip{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--grey); }
  .swatch{ width:10px; height:10px; border-radius:2px; }

  /* marker popup */
  .pk{ min-width:180px; }
  .pk h4{ margin:0 0 8px; font-size:13px; font-weight:600; }
  .pk .types{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  .pk .t{
    padding:7px 6px; border-radius:7px; border:1.5px solid var(--line);
    background:#fff; font-size:11.5px; font-weight:600; cursor:pointer; text-align:center;
  }
  .pk .t.on{ color:#fff; }
  .pk .go{
    width:100%; padding:8px; border-radius:7px; border:0; background:var(--blue);
    color:#fff; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .pk .go:disabled{ opacity:.45; cursor:not-allowed; }

  .olt-pin{
    width:16px; height:16px; border-radius:3px; background:var(--blue);
    border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); cursor:pointer;
  }
  .end-pin{
    width:14px; height:14px; border-radius:50%; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4); cursor:grab;
  }
  .end-pin:active{ cursor:grabbing; }

  .draft{
    position:fixed; z-index:950; right:16px; bottom:16px; width:280px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.2); display:none;
  }
  .draft.on{ display:block; }
  .draft h4{ margin:0 0 8px; font-size:13.5px; font-weight:600; }
  .draft p{ margin:3px 0; font-size:12px; color:var(--grey); }
  .draft .acts{ display:flex; gap:7px; margin-top:11px; }

  .toast{
    position:fixed; z-index:1100; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.on{ opacity:1; }

  .keybar{
    display:flex; gap:8px; align-items:center; padding:10px 16px;
    border-top:1px solid var(--line); background:#FAFBFC;
  }
  .keybar input{
    flex:1; min-width:0; padding:8px 10px; border:1px solid var(--line);
    border-radius:7px; font-size:12.5px; outline:none;
  }
  .keybar span{ font-size:11px; color:var(--grey); }

  @media (max-width:820px){
    :root{ --side:100%; }
    #map{ left:0; top:0; bottom:52%; }
    .side{ top:48%; width:100%; border-right:0; border-top:1px solid var(--line); }
    .draft{ right:8px; bottom:auto; top:8px; width:calc(100% - 16px); }
  }
</style>
</head>

<body>

<div id="map"></div>

<aside class="side">
  <div class="head">
    <h1>Network Planner</h1>
    <div class="crumbs" id="crumbs"></div>
  </div>

  <div class="body" id="body"></div>

  <div class="foot" id="foot"></div>

  <div class="keybar">
    <span>Edit key</span>
    <input id="key" type="password" placeholder="required to save">
  </div>
</aside>

<div class="draft" id="draft"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
(function(){
  'use strict';

  var map, ready = false;
  var data = { locations:[], olts:[], ports:[], objects:[] };
  var sel = { loc:null, olt:null, port:null };
  var step = 'location';           // location | search | manual | olt | port | map
  var oltMarker = null, endMarker = null, draft = null, popup = null;

  var TYPES = {
    FIBRE:   { label:'FIBRE',   color:'#1A73E8' },
    COUPLER: { label:'COUPLER', color:'#F57C00' },
    FATBOX:  { label:'FAT BOX', color:'#7B1FA2' }
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function key(){ return $('key').value.trim(); }
  function remember(){ try{ localStorage.setItem('np_key', key()); }catch(e){} }

  var tt;
  function toast(m){
    var t = $('toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 2500);
  }

  /* ================= backend ================= */

  function configured(){
    return CONFIG.API_URL && CONFIG.API_URL.indexOf('PASTE_') !== 0;
  }

  function load(){
    if (!configured()){ render(); return Promise.resolve(); }
    return fetch(CONFIG.API_URL + '?action=data&cb=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) throw new Error(res.error);
        data.locations = res.locations || [];
        data.olts      = res.olts || [];
        data.ports     = res.ports || [];
        data.objects   = res.objects || [];
        render();
        drawObjects();
      })
      .catch(function(err){ toast('Cannot load: ' + err.message); });
  }

  function post(action, payload){
    if (!configured()) return Promise.reject(new Error('Backend URL not set'));
    if (!key()) return Promise.reject(new Error('Enter the edit key'));
    remember();

    return fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action:action, key:key() }, payload))
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok) throw new Error(res.error || 'Save failed');
      return res;
    });
  }

  /* ================= map ================= */

  function initMap(){
    map = new maplibregl.Map({
      container:'map', style:CONFIG.STYLE,
      center:CONFIG.CENTRE, zoom:CONFIG.ZOOM, maxZoom:21,
      dragRotate:false, attributionControl:{ compact:true }
    });
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-right');
    map.addControl(new maplibregl.ScaleControl({ unit:'metric' }), 'bottom-left');

    map.on('load', function(){
      ready = true;

      map.addSource('links', { type:'geojson', data:empty() });
      map.addLayer({
        id:'link-lines', type:'line', source:'links',
        layout:{ 'line-cap':'round' },
        paint:{ 'line-color':['get','color'], 'line-width':3 }
      });

      map.addSource('ends', { type:'geojson', data:empty() });
      map.addLayer({
        id:'end-dots', type:'circle', source:'ends',
        paint:{
          'circle-color':['get','color'], 'circle-radius':6,
          'circle-stroke-width':2, 'circle-stroke-color':'#fff'
        }
      });
      map.addLayer({
        id:'end-labels', type:'symbol', source:'ends',
        minzoom:14,
        layout:{ 'text-field':['get','label'], 'text-font':['Noto Sans Regular'],
                 'text-size':11, 'text-offset':[0,1.2], 'text-anchor':'top' },
        paint:{ 'text-color':'#202124', 'text-halo-color':'#fff', 'text-halo-width':1.6 }
      });

      map.addSource('drafting', { type:'geojson', data:empty() });
      map.addLayer({
        id:'draft-line', type:'line', source:'drafting',
        paint:{ 'line-color':['get','color'], 'line-width':3, 'line-dasharray':[2,1.5] }
      });

      drawObjects();
    });
  }

  function empty(){ return { type:'FeatureCollection', features:[] }; }

  /** Draws every saved object for the currently selected port. */
  function drawObjects(){
    if (!ready) return;

    var lines = [], dots = [];
    var mine = sel.port
      ? data.objects.filter(function(o){ return o.portId === sel.port.id; })
      : [];

    mine.forEach(function(o){
      var c = (TYPES[o.type] || TYPES.FIBRE).color;
      var from = [parseFloat(o.fromLng), parseFloat(o.fromLat)];
      var to   = [parseFloat(o.lng),     parseFloat(o.lat)];
      if (isNaN(to[0]) || isNaN(to[1])) return;

      if (!isNaN(from[0]) && !isNaN(from[1])){
        lines.push({ type:'Feature', properties:{ color:c },
                     geometry:{ type:'LineString', coordinates:[from, to] } });
      }
      dots.push({ type:'Feature',
                  properties:{ color:c, label:(TYPES[o.type]||{}).label || o.type },
                  geometry:{ type:'Point', coordinates:to } });
    });

    map.getSource('links').setData({ type:'FeatureCollection', features:lines });
    map.getSource('ends').setData({ type:'FeatureCollection', features:dots });
  }

  function showOltMarker(){
    if (oltMarker){ oltMarker.remove(); oltMarker = null; }
    if (!sel.loc || !sel.port || step !== 'map') return;

    var el = document.createElement('div');
    el.className = 'olt-pin';
    el.title = sel.olt.name + ' · ' + sel.port.name;

    oltMarker = new maplibregl.Marker({ element:el })
      .setLngLat([parseFloat(sel.loc.lng), parseFloat(sel.loc.lat)])
      .addTo(map);

    el.addEventListener('click', function(e){ e.stopPropagation(); openTypePicker(); });
  }

  function openTypePicker(){
    if (popup) popup.remove();

    var box = document.createElement('div');
    box.className = 'pk';
    box.innerHTML = '<h4>' + esc(sel.olt.name) + ' · ' + esc(sel.port.name) + '</h4>' +
                    '<div class="types"></div>' +
                    '<button class="go" disabled>Add object</button>';

    var chosen = null;
    var wrap = box.querySelector('.types');
    var go = box.querySelector('.go');

    Object.keys(TYPES).forEach(function(t){
      var b = document.createElement('button');
      b.className = 't';
      b.textContent = TYPES[t].label;
      b.style.borderColor = TYPES[t].color;
      b.style.color = TYPES[t].color;
      b.addEventListener('click', function(){
        chosen = t;
        wrap.querySelectorAll('.t').forEach(function(x){
          x.classList.remove('on'); x.style.background = '#fff';
          x.style.color = TYPES[x.textContent === 'FAT BOX' ? 'FATBOX' : x.textContent].color;
        });
        b.classList.add('on');
        b.style.background = TYPES[t].color;
        b.style.color = '#fff';
        go.disabled = false;
      });
      wrap.appendChild(b);
    });

    go.addEventListener('click', function(){
      if (!chosen) return;
      popup.remove();
      startDraft(chosen);
    });

    popup = new maplibregl.Popup({ offset:16, closeButton:true, maxWidth:'260px' })
      .setLngLat([parseFloat(sel.loc.lng), parseFloat(sel.loc.lat)])
      .setDOMContent(box)
      .addTo(map);
  }

  /** Creates a draggable endpoint the user pulls away from the OLT. */
  function startDraft(type){
    clearDraft();

    var from = [parseFloat(sel.loc.lng), parseFloat(sel.loc.lat)];
    // start it slightly offset so the handle is grabbable
    var to = [from[0] + 0.0016, from[1] + 0.0010];
    draft = { type:type, from:from, to:to };

    var el = document.createElement('div');
    el.className = 'end-pin';
    el.style.background = TYPES[type].color;

    endMarker = new maplibregl.Marker({ element:el, draggable:true })
      .setLngLat(to).addTo(map);

    endMarker.on('drag', function(){
      var p = endMarker.getLngLat();
      draft.to = [p.lng, p.lat];
      paintDraft();
    });
    endMarker.on('dragend', function(){ paintDraft(); showDraftPanel(); });

    map.easeTo({ center:from, zoom:Math.max(map.getZoom(), 16), duration:500 });
    paintDraft();
    showDraftPanel();
    toast('Drag the ' + TYPES[type].label + ' handle to position it');
  }

  function paintDraft(){
    if (!ready) return;
    if (!draft){ map.getSource('drafting').setData(empty()); return; }
    map.getSource('drafting').setData({
      type:'FeatureCollection',
      features:[{ type:'Feature', properties:{ color:TYPES[draft.type].color },
                  geometry:{ type:'LineString', coordinates:[draft.from, draft.to] } }]
    });
  }

  function showDraftPanel(){
    if (!draft){ $('draft').classList.remove('on'); return; }

    var d = metres(draft.from[1], draft.from[0], draft.to[1], draft.to[0]);
    var p = $('draft');
    p.classList.add('on');
    p.innerHTML =
      '<h4 style="color:' + TYPES[draft.type].color + '">' + TYPES[draft.type].label + '</h4>' +
      '<p>' + esc(sel.olt.name) + ' · ' + esc(sel.port.name) + '</p>' +
      '<p>Run length: <b>' + (d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(2) + ' km') + '</b></p>' +
      '<p>' + draft.to[1].toFixed(6) + ', ' + draft.to[0].toFixed(6) + '</p>' +
      '<div class="acts">' +
        '<button class="btn" id="dcancel">Cancel</button>' +
        '<button class="btn primary" id="dsave">Confirm</button>' +
      '</div>';

    $('dcancel').onclick = function(){ clearDraft(); };
    $('dsave').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
      post('addObject', { row:{
        portId: sel.port.id, type: draft.type, label: TYPES[draft.type].label,
        lat: draft.to[1], lng: draft.to[0],
        fromLat: draft.from[1], fromLng: draft.from[0]
      }})
      .then(function(){ clearDraft(); return load(); })
      .then(function(){ toast('Saved'); })
      .catch(function(e){ btn.disabled = false; btn.textContent = 'Confirm'; toast(e.message); });
    };
  }

  function clearDraft(){
    draft = null;
    if (endMarker){ endMarker.remove(); endMarker = null; }
    $('draft').classList.remove('on');
    paintDraft();
  }

  function metres(a1,a2,b1,b2){
    var R=6371000, dLat=(b1-a1)*Math.PI/180, dLon=(b2-a2)*Math.PI/180;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(a1*Math.PI/180)*Math.cos(b1*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  /* ================= search (Photon / OpenStreetMap) ================= */

  var searchTimer = null, lastQuery = '';

  function runSearch(q){
    if (q.length < 3){ $('hits').classList.remove('on'); return; }
    lastQuery = q;
    $('spin').classList.add('on');

    var url = 'https://photon.komoot.io/api/?limit=8&lang=en&q=' + encodeURIComponent(q) +
              '&lat=' + CONFIG.SEARCH_NEAR.lat + '&lon=' + CONFIG.SEARCH_NEAR.lon;

    fetch(url).then(function(r){ return r.json(); }).then(function(res){
      if (q !== lastQuery) return;
      $('spin').classList.remove('on');

      var box = $('hits');
      var feats = (res.features || []).filter(function(f){ return f.geometry; });

      if (!feats.length){
        box.classList.add('on');
        box.innerHTML = '<div class="hit"><b>No match</b><span>Try fewer words, or use ' +
                        'Add Location Manually with the Google link.</span></div>';
        return;
      }

      box.classList.add('on');
      box.innerHTML = feats.map(function(f, i){
        var p = f.properties || {};
        var name = p.name || p.street || 'Unnamed';
        var bits = [p.street, p.district, p.city, p.state].filter(Boolean);
        return '<div class="hit" data-i="' + i + '"><b>' + esc(name) + '</b>' +
               '<span>' + esc(bits.join(', ')) + '</span></div>';
      }).join('');

      box.querySelectorAll('.hit').forEach(function(el){
        el.addEventListener('click', function(){
          var f = feats[+el.dataset.i];
          if (!f) return;
          var p = f.properties || {};
          var bits = [p.street, p.district, p.city, p.state].filter(Boolean);
          saveLocation({
            name: p.name || p.street || 'Unnamed',
            address: bits.join(', '),
            link: '',
            lat: f.geometry.coordinates[1],
            lng: f.geometry.coordinates[0]
          });
        });
      });
    }).catch(function(){
      $('spin').classList.remove('on');
      $('hits').classList.add('on');
      $('hits').innerHTML = '<div class="hit"><b>Search unavailable</b>' +
        '<span>Use Add Location Manually instead.</span></div>';
    });
  }

  function saveLocation(row){
    post('addLocation', { row:row })
      .then(function(res){
        return load().then(function(){
          sel.loc = data.locations.filter(function(l){ return l.id === res.row.id; })[0] || null;
          sel.olt = null; sel.port = null;
          step = 'olt';
          render();
          if (sel.loc) map.easeTo({ center:[+sel.loc.lng, +sel.loc.lat], zoom:16, duration:600 });
          toast('Location added');
        });
      })
      .catch(function(e){ toast(e.message); });
  }

  /* ================= screens ================= */

  function crumbs(){
    var c = $('crumbs');
    c.innerHTML =
      '<span class="crumb' + (sel.loc?' on':'') + '">' +
        (sel.loc ? esc(sel.loc.name) : 'Location') + '</span>' +
      '<span class="crumb' + (sel.olt?' on':'') + '">' +
        (sel.olt ? esc(sel.olt.name) : 'OLT') + '</span>' +
      '<span class="crumb' + (sel.port?' on':'') + '">' +
        (sel.port ? esc(sel.port.name) : 'Port') + '</span>';
  }

  function render(){
    crumbs();
    var b = $('body'), f = $('foot');
    b.innerHTML = ''; f.innerHTML = '';

    if (!configured()){
      b.innerHTML = '<p class="lead">Backend not connected. Paste the planner web app URL ' +
                    'into <b>API_URL</b> at the top of this file.</p>';
      return;
    }

    if (step === 'location')  return screenLocation(b, f);
    if (step === 'search')    return screenSearch(b, f);
    if (step === 'manual')    return screenManual(b, f);
    if (step === 'olt')       return screenOlt(b, f);
    if (step === 'port')      return screenPort(b, f);
    if (step === 'map')       return screenMap(b, f);
  }

  function screenLocation(b, f){
    b.innerHTML = '<p class="lead">Start by choosing where this equipment sits.</p>';

    var add = document.createElement('button');
    add.className = 'btn primary wide big';
    add.textContent = 'Add Location';
    add.onclick = function(){ step = 'search'; render(); };
    b.appendChild(add);

    if (data.locations.length){
      var h = document.createElement('div');
      h.className = 'sec'; h.textContent = 'Saved locations';
      b.appendChild(h);

      data.locations.forEach(function(l){
        var r = document.createElement('div');
        r.className = 'row' + (sel.loc && sel.loc.id === l.id ? ' sel' : '');
        r.innerHTML = '<span class="row__main"><b>' + esc(l.name) + '</b>' +
                      '<span>' + esc(l.address || (l.lat + ', ' + l.lng)) + '</span></span>' +
                      '<button class="del" title="Delete">&times;</button>';
        r.querySelector('.row__main').onclick = function(){
          sel.loc = l; sel.olt = null; sel.port = null; step = 'olt'; render();
          map.easeTo({ center:[+l.lng, +l.lat], zoom:16, duration:600 });
        };
        r.querySelector('.del').onclick = function(e){
          e.stopPropagation();
          if (!confirm('Delete ' + l.name + ' and everything under it?')) return;
          post('remove', { tab:'locations', id:l.id })
            .then(function(){ if (sel.loc && sel.loc.id === l.id){ sel.loc=null; sel.olt=null; sel.port=null; }
                              return load(); })
            .catch(function(e){ toast(e.message); });
        };
        b.appendChild(r);
      });
    }
  }

  function screenSearch(b, f){
    b.innerHTML =
      '<p class="lead">Search for the place, the way you would on a map. ' +
      'Pick a result to save it.</p>' +
      '<div class="searchbox"><input id="q" placeholder="Search a place or address" autocomplete="off">' +
      '<div class="spin" id="spin"></div></div>' +
      '<div class="hits" id="hits"></div>';

    f.innerHTML = '';
    var man = document.createElement('button');
    man.className = 'btn';
    man.textContent = 'Add Location Manually';
    man.onclick = function(){ step = 'manual'; render(); };

    var back = document.createElement('button');
    back.className = 'btn';
    back.textContent = 'Back';
    back.onclick = function(){ step = 'location'; render(); };

    f.appendChild(man);
    f.appendChild(back);

    var input = $('q');
    input.focus();
    input.addEventListener('input', function(){
      clearTimeout(searchTimer);
      var v = input.value.trim();
      searchTimer = setTimeout(function(){ runSearch(v); }, 260);
    });
  }

  function screenManual(b, f){
    b.innerHTML =
      '<p class="lead">Office address and Google link are required. ' +
      'Coordinates are worked out from the link if you leave them blank.</p>' +
      '<div class="field"><label>Office address <i>*</i></label>' +
        '<input id="f_addr" placeholder="Shop 4, Lohegaon Road, Pune"></div>' +
      '<div class="field"><label>Google link <i>*</i></label>' +
        '<input id="f_link" placeholder="https://maps.app.goo.gl/..."></div>' +
      '<div class="two">' +
        '<div class="field"><label>Latitude</label><input id="f_lat" placeholder="optional"></div>' +
        '<div class="field"><label>Longitude</label><input id="f_lng" placeholder="optional"></div>' +
      '</div>' +
      '<div class="msg" id="f_msg"></div>';

    var save = document.createElement('button');
    save.className = 'btn primary';
    save.textContent = 'Save location';
    save.onclick = function(){
      var addr = $('f_addr'), link = $('f_link');
      addr.classList.remove('bad'); link.classList.remove('bad');
      var m = $('f_msg'); m.className = 'msg'; m.textContent = '';

      if (!addr.value.trim()){ addr.classList.add('bad'); m.className='msg bad'; m.textContent='Office address is required.'; return; }
      if (!link.value.trim()){ link.classList.add('bad'); m.className='msg bad'; m.textContent='Google link is required.'; return; }

      save.disabled = true; save.textContent = 'Saving…';
      m.className = 'msg'; m.textContent = 'Resolving the link…';

      saveLocationChecked({
        name: addr.value.trim(),
        address: addr.value.trim(),
        link: link.value.trim(),
        lat: $('f_lat').value.trim(),
        lng: $('f_lng').value.trim()
      }, function(err){
        save.disabled = false; save.textContent = 'Save location';
        m.className = 'msg bad'; m.textContent = err;
      });
    };

    var back = document.createElement('button');
    back.className = 'btn';
    back.textContent = 'Back';
    back.onclick = function(){ step = 'search'; render(); };

    f.appendChild(back);
    f.appendChild(save);
  }

  function saveLocationChecked(row, onErr){
    post('addLocation', { row:row })
      .then(function(res){
        return load().then(function(){
          sel.loc = data.locations.filter(function(l){ return l.id === res.row.id; })[0] || null;
          sel.olt = null; sel.port = null; step = 'olt'; render();
          if (sel.loc) map.easeTo({ center:[+sel.loc.lng, +sel.loc.lat], zoom:16, duration:600 });
          toast('Location added');
        });
      })
      .catch(function(e){ onErr(e.message); });
  }

  function screenOlt(b, f){
    var mine = data.olts.filter(function(o){ return o.locationId === sel.loc.id; });

    b.innerHTML = '<p class="lead">Add the OLTs at ' + esc(sel.loc.name) + '. ' +
                  'Each one is numbered automatically.</p>';

    var add = document.createElement('button');
    add.className = 'btn primary wide';
    add.textContent = 'Add OLT';
    add.onclick = function(){
      add.disabled = true;
      post('addOlt', { row:{ locationId: sel.loc.id } })
        .then(function(){ return load(); })
        .then(function(){ add.disabled = false; })
        .catch(function(e){ add.disabled = false; toast(e.message); });
    };
    b.appendChild(add);

    if (mine.length){
      var h = document.createElement('div'); h.className='sec'; h.textContent = mine.length + ' OLT';
      b.appendChild(h);

      mine.forEach(function(o){
        var r = document.createElement('div');
        r.className = 'row' + (sel.olt && sel.olt.id === o.id ? ' sel' : '');
        var ports = data.ports.filter(function(p){ return p.oltId === o.id; }).length;
        r.innerHTML = '<span class="row__main"><b>' + esc(o.name) + '</b>' +
                      '<span>' + ports + ' port' + (ports===1?'':'s') + '</span></span>' +
                      '<button class="del">&times;</button>';
        r.querySelector('.row__main').onclick = function(){
          sel.olt = o; sel.port = null; render();
        };
        r.querySelector('.del').onclick = function(e){
          e.stopPropagation();
          if (!confirm('Delete ' + o.name + ' and its ports?')) return;
          post('remove', { tab:'olts', id:o.id })
            .then(function(){ if (sel.olt && sel.olt.id === o.id){ sel.olt=null; sel.port=null; } return load(); })
            .catch(function(e){ toast(e.message); });
        };
        b.appendChild(r);
      });
    }

    var back = document.createElement('button');
    back.className='btn'; back.textContent='Back';
    back.onclick = function(){ step='location'; render(); };

    var next = document.createElement('button');
    next.className='btn primary'; next.textContent='Next';
    next.disabled = !sel.olt;
    next.onclick = function(){ step='port'; render(); };

    f.appendChild(back); f.appendChild(next);
  }

  function screenPort(b, f){
    var mine = data.ports.filter(function(p){ return p.oltId === sel.olt.id; });

    b.innerHTML = '<p class="lead">Add ports on ' + esc(sel.olt.name) + '.</p>';

    var add = document.createElement('button');
    add.className='btn primary wide'; add.textContent='Add Port';
    add.onclick = function(){
      add.disabled = true;
      post('addPort', { row:{ oltId: sel.olt.id } })
        .then(function(){ return load(); })
        .then(function(){ add.disabled = false; })
        .catch(function(e){ add.disabled = false; toast(e.message); });
    };
    b.appendChild(add);

    if (mine.length){
      var h = document.createElement('div'); h.className='sec'; h.textContent = mine.length + ' port';
      b.appendChild(h);

      mine.forEach(function(p){
        var objs = data.objects.filter(function(o){ return o.portId === p.id; }).length;
        var r = document.createElement('div');
        r.className = 'row' + (sel.port && sel.port.id === p.id ? ' sel' : '');
        r.innerHTML = '<span class="row__main"><b>' + esc(p.name) + '</b>' +
                      '<span>' + objs + ' object' + (objs===1?'':'s') + '</span></span>' +
                      '<button class="del">&times;</button>';
        r.querySelector('.row__main').onclick = function(){ sel.port = p; render(); drawObjects(); };
        r.querySelector('.del').onclick = function(e){
          e.stopPropagation();
          if (!confirm('Delete ' + p.name + '?')) return;
          post('remove', { tab:'ports', id:p.id })
            .then(function(){ if (sel.port && sel.port.id === p.id) sel.port = null; return load(); })
            .catch(function(e){ toast(e.message); });
        };
        b.appendChild(r);
      });
    }

    var back = document.createElement('button');
    back.className='btn'; back.textContent='Back';
    back.onclick = function(){ step='olt'; render(); };

    var next = document.createElement('button');
    next.className='btn primary'; next.textContent='Add Map';
    next.disabled = !sel.port;
    next.onclick = function(){
      step='map'; render(); drawObjects(); showOltMarker();
      map.easeTo({ center:[+sel.loc.lng, +sel.loc.lat], zoom:17, duration:700 });
    };

    f.appendChild(back); f.appendChild(next);
  }

  function screenMap(b, f){
    var mine = data.objects.filter(function(o){ return o.portId === sel.port.id; });

    b.innerHTML =
      '<p class="lead">Click the blue OLT marker on the map, choose a type, then drag the ' +
      'handle to where the object sits. Confirm to save.</p>' +
      '<div class="legend">' +
        Object.keys(TYPES).map(function(t){
          return '<span class="chip"><span class="swatch" style="background:' +
                 TYPES[t].color + '"></span>' + TYPES[t].label + '</span>';
        }).join('') +
      '</div>';

    if (mine.length){
      var h = document.createElement('div'); h.className='sec';
      h.textContent = mine.length + ' object' + (mine.length===1?'':'s') + ' on ' + sel.port.name;
      b.appendChild(h);

      mine.forEach(function(o){
        var c = (TYPES[o.type] || TYPES.FIBRE);
        var d = metres(+o.fromLat, +o.fromLng, +o.lat, +o.lng);
        var r = document.createElement('div');
        r.className = 'row';
        r.innerHTML = '<span class="swatch" style="background:' + c.color + '"></span>' +
                      '<span class="row__main"><b>' + esc(c.label) + '</b>' +
                      '<span>' + (isNaN(d)?'':(d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km')) +
                      ' · ' + (+o.lat).toFixed(5) + ', ' + (+o.lng).toFixed(5) + '</span></span>' +
                      '<button class="del">&times;</button>';
        r.querySelector('.del').onclick = function(){
          if (!confirm('Delete this ' + c.label + '?')) return;
          post('remove', { tab:'objects', id:o.id })
            .then(function(){ return load(); })
            .then(function(){ drawObjects(); })
            .catch(function(e){ toast(e.message); });
        };
        r.onclick = function(){ map.easeTo({ center:[+o.lng, +o.lat], zoom:18, duration:500 }); };
        b.appendChild(r);
      });
    }

    var back = document.createElement('button');
    back.className='btn'; back.textContent='Back';
    back.onclick = function(){
      clearDraft();
      if (oltMarker){ oltMarker.remove(); oltMarker = null; }
      step='port'; render();
    };
    f.appendChild(back);

    var again = document.createElement('button');
    again.className='btn primary'; again.textContent='Add object';
    again.onclick = openTypePicker;
    f.appendChild(again);
  }

  /* ================= start ================= */

  initMap();
  try{ $('key').value = localStorage.getItem('np_key') || ''; }catch(e){}
  $('key').addEventListener('change', remember);
  render();
  load();

})();
</script>
</body>
</html>
