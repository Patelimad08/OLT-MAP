      '<span class="ctx__v">'+where+'</span></div>'+
    '<div class="ctx__row"><span class="ctx__k">Holding</span><span class="ctx__v'+
      (D.cables.length?'':' none')+'">'+
      (D.cables.length
        ? D.offices.length+' offices \u00b7 '+D.cables.length+' cables \u00b7 '+
          D.nodes.length+' objects'
        : 'nothing yet')+'</span></div>';
}

/* One view. Everything visible at once \u2014 no hidden modes to get lost in. */

/* ---------- home ---------- */
function home(b,f){
  if (tab==='cables') return cablesTab(b,f);
  if (tab==='nearby') return nearbyView(b,f);
  return networkTab(b,f);
}

/* ---- Add Network: offices, and the flow that follows ---- */
function networkTab(b,f){
  var l2=document.createElement('div');
  l2.className='lbl';
  l2.innerHTML='Offices <span class="r">'+D.offices.length+'</span>';
  b.appendChild(l2);

  var lead=document.createElement('p');
  lead.className='lead';
  lead.textContent='Add an office to start, then draw the network map.';
  b.appendChild(lead);

  D.offices.forEach(function(o){
    var olts=D.olts.filter(function(x){ return x.office===o.id; });
    var ports=D.ports.filter(function(p){
      return olts.some(function(x){ return x.id===p.olt; }); });
    var r=document.createElement('div');
    r.className='row';
    r.innerHTML='<span class="mk-office" style="width:11px;height:11px;border-width:1px"></span>'+
      '<span class="rowmain"><b>'+esc(o.name)+'</b><div class="sub">'+
      olts.length+(olts.length===1?' OLT':' OLTs')+' \u00b7 '+ports.length+' ports \u00b7 '+
      ports.filter(function(p){return p.cable;}).length+' connected</div></span>';

    var ob=document.createElement('span'); ob.className='rowbtns';
    var oe=document.createElement('button');
    oe.className='ic'; oe.textContent='\u270E'; oe.title='Rename or move';
    oe.onclick=function(e){ e.stopPropagation(); sel.office=o.id; view='editOffice'; render(); };
    var od=document.createElement('button');
    od.className='ic del'; od.textContent='\u00D7'; od.title='Delete';
    od.onclick=function(e){ e.stopPropagation(); delOffice(o); };
    ob.appendChild(oe); ob.appendChild(od);
    r.appendChild(ob);

    r.onclick=function(){ sel.office=o.id; view='office'; draw(); render();
      map.easeTo({ center:o.at, zoom:Math.max(map.getZoom(),15), duration:500 }); };
    b.appendChild(r);
  });

  if (!D.offices.length){
    var e0=document.createElement('div');
    e0.className='note';
    e0.textContent='Nothing here yet.';
    b.appendChild(e0);
  }

  var ao=document.createElement('button');
  ao.className='btn primary'; ao.style.width='100%'; ao.textContent='+  Add an office';
  ao.onclick=function(){
    draft={ kind:'office', at:null, name:'', linkText:'' };
    offMsg=null;
    view='home'; draw(); render();
  };
  b.appendChild(ao);

  var s2=document.createElement('button');
  s2.className='btn'; s2.textContent='Summary';
  s2.onclick=function(){ view='summary'; render(); };
  f.appendChild(s2);
}

/* ---- View Cables ---- */
function cablesTab(b,f){
  var l1=document.createElement('div');
  l1.className='lbl';
  l1.innerHTML='Cables <span class="r">'+D.cables.length+'</span>';
  b.appendChild(l1);

  if (!D.cables.length){
    var e1=document.createElement('div');
    e1.className='note';
    e1.textContent='No cable yet. Draw one from an OLT port, or branch one from a joint.';
    b.appendChild(e1);
  }

  D.cables.forEach(function(c){
    var uses=strandUses(c.id), touched=Object.keys(uses).length;
    var r=document.createElement('div');
    r.className='row'+(sel.cable===c.id?' on':'');
    r.innerHTML='<span class="cabledash"></span>'+
      '<span class="rowmain"><b>'+esc(c.id)+'</b>'+
      '<div class="sub">'+esc(c.kind)+' \u00b7 '+c.cores+'F \u00b7 '+fmtM(pathLen(c.path))+
      ' \u00b7 '+(c.cores-touched)+' free</div></span>';
    var bts=document.createElement('span'); bts.className='rowbtns';
    bts.innerHTML='<button class="ic" title="Edit">\u270E</button>'+
                  '<button class="ic del" title="Delete">\u00D7</button>';
    bts.children[0].onclick=function(e){ e.stopPropagation(); sel.cable=c.id; view='editCable'; render(); };
    bts.children[1].onclick=function(e){ e.stopPropagation(); delCable(c); };
    r.appendChild(bts);
    r.onclick=function(){ sel.cable=c.id; view='cable'; draw(); render(); zoomTo(c.path); };
    b.appendChild(r);
  });

  var s3=document.createElement('button');
  s3.className='btn'; s3.textContent='Summary';
  s3.onclick=function(){ view='summary'; render(); };
  f.appendChild(s3);
}

function zoomTo(path){
  var bb=new maplibregl.LngLatBounds(path[0],path[0]);
  path.forEach(function(p){ bb.extend(p); });
  map.fitBounds(bb,{padding:90,duration:600});
}

/* ---------- add a cable: draw the route ---------- */
function startRoute(){
  draft={ kind:'route', path:[], id:nextId('F',D.cables), cores:12, kindName:'Distribution', note:'' };
  view='home'; draw(); render();
}
function routeDraft(b,f){
  var fromPort = draft.fromPort
    ? D.ports.filter(function(x){ return x.id===draft.fromPort; })[0] : null;
  var fromOff = fromPort ? office(olt(fromPort.olt).office) : null;
  var fromNode = draft.fromNode ? node(draft.fromNode) : null;
  var anchorName = fromOff ? fromOff.name : fromNode ? fromNode.name : '';

  b.innerHTML='<h2 class="title">New cable</h2>'+
    '<p class="lead">'+(fromOff
      ? 'Starting at <b>'+esc(fromOff.name)+'</b>, because it leaves '+
        esc(olt(fromPort.olt).name)+' \u00b7 '+esc(fromPort.name)+'. '+
        'Click the map for each bend, then the end.'
      : fromNode
        ? 'Branching from <b>'+esc(fromNode.name)+'</b>. Click the map for each bend, '+
          'then the end. You splice it to the other cables inside the joint afterwards.'
        : 'Click the map for the start, each bend, then the end.')+'</p>'+
    '<div class="field"><label>Cable ID <i>*</i></label><input id="d_id" value="'+esc(draft.id)+'"></div>'+
    '<div class="two"><div class="field"><label>Cores <i>*</i></label><select id="d_cores">'+
      CORE_OPTIONS.map(function(n){ return '<option'+(n===draft.cores?' selected':'')+'>'+n+'</option>'; }).join('')+
    '</select></div><div class="field"><label>Type</label><select id="d_kind">'+
      ['Feeder','Distribution','Drop'].map(function(k){
        return '<option'+(k===draft.kindName?' selected':'')+'>'+k+'</option>'; }).join('')+
    '</select></div></div>'+
    '<div class="field"><label>Note</label><input id="d_note" value="'+esc(draft.note)+'" placeholder="optional"></div>';

  var l=document.createElement('div');
  l.className='lbl';
  l.innerHTML='Points <span class="r">'+draft.path.length+
    (draft.path.length>1?' \u00b7 '+fmtM(pathLen(draft.path)):'')+'</span>';
  b.appendChild(l);

  if (!draft.path.length){
    var e=document.createElement('div');
    e.className='note'; e.textContent='Nothing yet. Click the map to drop the first point.';
    b.appendChild(e);
  }
  draft.path.forEach(function(p,i){
    var locked = (i===0 && (!!draft.fromPort || !!draft.fromNode));
    var r=document.createElement('div');
    r.className='row';
    r.innerHTML='<span class="'+(locked?'mk-office':'mk-vtx')+
      '" style="width:9px;height:9px;flex:0 0 9px'+(locked?';border-width:1px':'')+'"></span>'+
      '<span class="rowmain"><b>'+(locked?'Start \u00b7 '+esc(anchorName)
        : i===0?'Start' : i===draft.path.length-1?'End':'Bend '+i)+'</b>'+
      '<div class="sub">'+p[1].toFixed(5)+', '+p[0].toFixed(5)+
      (locked?(fromOff?' \u00b7 fixed at the office':' \u00b7 fixed at the joint'):'')+
      '</div></span>';
    if (!locked){
      var x=document.createElement('button');
      x.className='ic del'; x.textContent='\u00D7'; x.style.marginLeft='auto';
      x.onclick=function(ev){ ev.stopPropagation(); draft.path.splice(i,1); draw(); render(); };
      r.appendChild(x);
    }
    b.appendChild(r);
  });

  ['d_id','d_cores','d_kind','d_note'].forEach(function(id){
    var el=$(id); if(!el) return;
    el.onchange=function(){
      draft.id=$('d_id').value.trim();
      draft.cores=parseInt($('d_cores').value,10);
      draft.kindName=$('d_kind').value;
      draft.note=$('d_note').value;
    };
  });

  var cancel=document.createElement('button');
  cancel.className='btn'; cancel.textContent='Cancel';
  cancel.onclick=function(){ draft=null; draw(); render(); };

  var done=document.createElement('button');
  done.className='btn primary'; done.textContent='Finish cable';
  done.disabled=draft.path.length<2;
  done.onclick=function(){
    draft.id=$('d_id').value.trim();
    draft.cores=parseInt($('d_cores').value,10);
    draft.kindName=$('d_kind').value;
    draft.note=$('d_note').value;
    if (!draft.id || cable(draft.id)){ alert('Cable ID is blank or already used.'); return; }
    D.cables.push({ id:draft.id, cores:draft.cores, kind:draft.kindName,
                    note:draft.note, path:draft.path.slice() });
    // a cable drawn from a port is immediately carried by strand 1 of it
    if (fromPort){ fromPort.cable=draft.id; fromPort.strand=1; }
    sel.cable=draft.id; draft=null; view='cable'; draw(); render();
  };
  f.appendChild(cancel); f.appendChild(done);
}

/* ---------- add plant on a cable ---------- */
function startNode(type, cableId){
  draft={ kind:'node', type:type, cable:cableId, at:null, off:0,
          name:nextId(type==='JOINT'?'JE':type==='COUPLER'?'CP':type==='SPLITTER'?'SP':'FB', D.nodes),
          ratio:(type==='SPLITTER'?'1:8':'40/60'), no:'', ports:16, note:'' };
  draw(); render();
}
function nodeDraft(b,f){
  var t=draft.type;
  var title='New '+typeName(t).toLowerCase();
  b.innerHTML='<h2 class="title">'+title+'</h2>'+
    '<p class="lead">'+(t==='FATBOX'
      ? 'Click the map anywhere \u2014 on a pole or a wall, wherever the box actually is. '+
        'You connect what feeds it afterwards.'
      : 'On cable '+esc(draft.cable)+'. Click the map \u2014 it snaps onto the cable.'+
        (t==='COUPLER'||t==='SPLITTER' ? ' You connect its input and outputs after placing it.' : ''))+'</p>'+
    '<div class="field"><label>Name <i>*</i></label><input id="n_name" value="'+esc(draft.name)+'"></div>'+
    (t==='COUPLER' ? '<div class="field"><label>Split ratio <i>*</i></label><select id="n_val">'+
        COUPLER_VALUES.map(function(v){
          return '<option value="'+v.ratio+'"'+(v.ratio===draft.ratio?' selected':'')+'>'+
                 v.ratio+' \u00b7 tap '+v.tap+'% / pass '+v.pass+'%</option>'; }).join('')+
      '</select><div class="msg">Two outputs: a small tap here, the rest carried onward.</div></div>' : '')+
    (t==='SPLITTER' ? '<div class="field"><label>Split ratio <i>*</i></label><select id="n_val">'+
        SPLITTER_TYPES.map(function(v){
          return '<option value="'+v.ratio+'"'+(v.ratio===draft.ratio?' selected':'')+'>'+
                 v.ratio+' \u00b7 '+v.ways+' equal outputs \u00b7 \u2212'+v.loss+' dB each</option>'; }).join('')+
      '</select><div class="msg">Every output gets an equal share of the light.</div></div>' : '')+
    (t==='FATBOX' ? '<div class="two"><div class="field"><label>Box number <i>*</i></label>'+
        '<input id="n_no" inputmode="numeric" maxlength="3" placeholder="1 to 999" value="'+esc(draft.no)+'"></div>'+
        '<div class="field"><label>Ports</label><select id="n_ports">'+
        [4,8,16,24].map(function(n){ return '<option'+(n===draft.ports?' selected':'')+'>'+n+'</option>'; }).join('')+
      '</select></div></div><div class="msg" id="n_msg"></div>' : '')+
    '<div class="field"><label>Note</label><input id="n_note" value="'+esc(draft.note)+'" placeholder="optional"></div>'+
    '<div class="lbl">Position</div>'+
    '<div class="note">'+(draft.at
      ? 'Placed at '+draft.at[1].toFixed(5)+', '+draft.at[0].toFixed(5)+
        (draft.off===null ? '' : ' \u00b7 snapped '+Math.round(draft.off)+' m onto the cable')
      : 'Not placed yet. Click the map.')+'</div>';

  var cancel=document.createElement('button');
  cancel.className='btn'; cancel.textContent='Cancel';
  cancel.onclick=function(){ draft=null; draw(); render(); };

  var save=document.createElement('button');
  save.className='btn primary'; save.textContent='Place '+typeName(t).toLowerCase();
  save.disabled=!draft.at;
  save.onclick=function(){
    var name=$('n_name').value.trim();
    if (!name){ alert('Name is required.'); return; }
    var rec={ id:name, type:t, cable:draft.cable, at:draft.at, name:name,
              note:$('n_note').value.trim() };
    if (t==='COUPLER'||t==='SPLITTER'){
      rec.ratio=$('n_val').value;
      rec.inCable=null; rec.inStrand=null;
      rec.legs=makeLegs(t, rec.ratio);
    }
    if (t==='FATBOX'){
      var raw=$('n_no').value.replace(/[^0-9]/g,'');
      var n=parseInt(raw,10);
      if (!(n>=1&&n<=999)){ $('n_msg').className='msg bad'; $('n_msg').textContent='Box number must be 1 to 999.'; return; }
      var code=('00'+n).slice(-3);
      if (D.nodes.some(function(x){ return x.type==='FATBOX'&&x.no===code; })){
        $('n_msg').className='msg bad'; $('n_msg').textContent='FAT box '+code+' already exists.'; return;
      }
      rec.no=code; rec.ports=parseInt($('n_ports').value,10);
      rec.customers=[]; rec.cable=null; rec.inCable=null; rec.inStrand=null;
    }
    if (node(rec.id)){ alert('That name is already used.'); return; }
    D.nodes.push(rec);
    draft=null; sel.node=rec.id; view='node'; draw(); render();
  };
  f.appendChild(cancel); f.appendChild(save);
}

/* ---------- cable detail ---------- */
function cableView(b,f){
  var c=cable(sel.cable);
  if (!c){ view='home'; return render(); }
  var uses=strandUses(c.id);
  var usedN=0, halfN=0;
  for (var si=1;si<=c.cores;si++){
    var k=strandEndsUsed(uses,si);
    if (k>0) usedN++;
    if (k===1) halfN++;
  }

  b.innerHTML='<h2 class="title">'+esc(c.id)+'</h2>'+
    '<p class="lead">'+esc(c.kind)+' \u00b7 '+c.cores+' cores \u00b7 '+fmtM(pathLen(c.path))+
    ' \u00b7 '+(c.path.length-2)+' bends</p>'+
    (c.note?'<div class="kv dim">'+esc(c.note)+'</div>':'')+
    '<div class="cap"><i style="width:'+Math.round(usedN/c.cores*100)+'%"></i></div>'+
    '<div class="kv" style="margin-top:5px"><b>'+usedN+'</b> of '+c.cores+' strands in use \u00b7 '+
    '<span class="free">'+(c.cores-usedN)+' spare</span></div>';

  /* Devices sit on the cable. FAT boxes hang off it, wherever they were placed. */
  var onIt=nodesOn(c.id);
  var hangingOff=D.nodes.filter(function(n){
    if (n.type!=='FATBOX') return false;
    if (n.inCable===c.id) return true;
    var fd=feedOf(n.id);
    return !!(fd && fd.node && fd.node.cable===c.id && fd.leg);
  });

  var l1=document.createElement('div');
  l1.className='lbl';
  l1.innerHTML='On this cable <span class="r">'+(onIt.length+hangingOff.length)+'</span>';
  b.appendChild(l1);

  onIt.concat(hangingOff).forEach(function(n){
    var r=document.createElement('div');
    r.className='row';
    var cls=markerClass(n.type);
    var extra = n.type==='FATBOX' ? (n.ports-usedPorts(n)?(n.ports-usedPorts(n))+' free':'full')
              : n.type==='JOINT' ? splicesAt(n.id).length+' splices'
              : (n.legs||[]).filter(function(g){ return g.to; }).length+'/'+(n.legs||[]).length+' out';
    r.innerHTML='<span class="'+cls+'" style="'+
      (n.type==='COUPLER' ? 'border-left-width:5px;border-right-width:5px;border-bottom-width:9px'
       : n.type==='SPLITTER' ? 'border-left-width:5px;border-right-width:5px;border-top-width:9px'
       : 'width:11px;height:11px;border-width:1px')+';flex:0 0 11px"></span>'+
      '<span class="rowmain"><b>'+esc(n.name)+'</b><div class="sub">'+
      (n.type==='FATBOX' ? 'FAT box '+esc(n.no)
       : n.type==='JOINT' ? 'Joint enclosure'
       : typeName(n.type)+' '+esc(n.ratio||''))+
      '</div></span><span class="meta">'+esc(extra)+'</span>';
    r.onclick=function(){ sel.node=n.id; view='node'; draw(); render();
      map.easeTo({center:n.at, zoom:17, duration:600}); };
    b.appendChild(r);
  });

  var addrow=document.createElement('div');
  addrow.className='chips'; addrow.style.marginTop='8px';
  [['JOINT','+ Joint'],['COUPLER','+ Coupler'],['SPLITTER','+ Splitter'],
   ['FATBOX','+ FAT box']].forEach(function(p){
    var btn=document.createElement('button');
    btn.className='chip'; btn.textContent=p[1];
    btn.onclick=function(){ startNode(p[0], c.id); };
    addrow.appendChild(btn);
  });
  b.appendChild(addrow);

  var l2=document.createElement('div');
  l2.className='lbl';
  l2.innerHTML='Strands <span class="r">'+usedN+' of '+c.cores+' touched'+
    (halfN?' \u00b7 '+halfN+' half done':'')+'</span>';
  b.appendChild(l2);

  var tb=document.createElement('table');
  tb.className='tbl';
  var rows='';
  for (var i=1;i<=c.cores;i++){
    var st=strandStatus(uses,i);
    var chain=strandChain(uses,i);
    rows+='<tr><td style="width:20px">'+swatch(i)+'</td>'+
      '<td>'+strandLabel(i,c.cores)+'</td>'+
      '<td class="'+st.cls+'">'+esc(st.text)+
      (chain && strandEndsUsed(uses,i)>1
        ? '<div style="font-size:11px;color:#5F6368">'+esc(chain)+'</div>' : '')+
      '</td></tr>';
  }
  tb.innerHTML='<thead><tr><th></th><th>Strand</th><th>Runs between</th></tr></thead><tbody>'+rows+'</tbody>';
  b.appendChild(tb);

  if (halfN){
    var hn=document.createElement('div');
    hn.className='note';
    hn.innerHTML='<b>'+halfN+'</b> strand'+(halfN===1?' has':'s have')+' just one thing on '+
      (halfN===1?'it':'them')+'. Light arrives but nothing collects it yet, so '+
      (halfN===1?'that strand is':'those strands are')+' still open further along the cable.';
    b.appendChild(hn);
  }

  var owners={};
  portsUsing(c.id).forEach(function(p){ owners[olt(p.olt).name]=1; });
  if (Object.keys(owners).length>1){
    var n=document.createElement('div');
    n.className='note';
    n.innerHTML='Carries strands for <b>'+Object.keys(owners).join('</b>, <b>')+
      '</b>. It belongs to none of them.';
    b.appendChild(n);
  }

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ sel.cable=null; view='home'; draw(); render(); };
  var ed=document.createElement('button');
  ed.className='btn primary'; ed.textContent='Edit';
  ed.onclick=function(){ view='editCable'; render(); };
  f.appendChild(back); f.appendChild(ed);
}

/* ---------- node detail ---------- */
function nodeView(b,f){
  var n=node(sel.node);
  if (!n){ view='home'; return render(); }
  var c=cable(n.cable);

  b.innerHTML='<h2 class="title">'+esc(n.name)+'</h2>'+
    '<p class="lead">'+typeName(n.type)+
    (n.ratio?' '+esc(n.ratio):'')+
    (n.type==='FATBOX'

          'width:22px;flex:0 0 22px">'+String(port).padStart(2,'0')+'</span>'+
          '<span class="rowmain">'+(cust
            ? '<b>'+esc(cust.name)+'</b><div class="sub">connected</div>'
            : '<b class="dim">Free</b><div class="sub">no customer on this port</div>')+'</span>';
        var btn=document.createElement('button');
        btn.className = cust ? 'ic del' : 'btn sm';
        btn.style.marginLeft='auto';
        btn.textContent = cust ? '\u00D7' : 'Connect';
        btn.title = cust ? 'Disconnect this customer' : '';
        btn.onclick=function(){
          if (cust){
            if (!confirm('Disconnect '+cust.name+' from port '+port+'?')) return;
            n.customers=n.customers.filter(function(x){ return x.port!==port; });
            draw(); render();
          } else {
            custDraft={ node:n.id, port:port, at:null, name:'' };
            view='customer'; draw(); render();
          }
        };
        r.appendChild(btn);
        b.appendChild(r);
      })(p);
    }

  }

  if (n.type==='COUPLER'||n.type==='SPLITTER'){
    var spec = n.type==='COUPLER' ? couplerSpec(n.ratio) : splitterSpec(n.ratio);

    /* --- the input --- */
    var li=document.createElement('div');
    li.className='lbl'; li.textContent='Light comes in on';
    b.appendChild(li);

    var inRow=document.createElement('div');
    inRow.className='row';
    var upstream = legFeedOf(n.id);
    inRow.innerHTML = n.inCable
      ? swatch(n.inStrand)+'<span class="rowmain"><b>'+esc(n.inCable)+'</b><div class="sub">strand '+
        strandLabel(n.inStrand, cable(n.inCable).cores)+'</div></span>'
      : upstream
        ? '<span class="'+markerClass(upstream.node.type)+'" style="'+
          (upstream.node.type==='COUPLER'?'border-left-width:5px;border-right-width:5px;border-bottom-width:9px'
           :'border-left-width:5px;border-right-width:5px;border-top-width:9px')+';flex:0 0 11px"></span>'+
          '<span class="rowmain"><b>'+esc(upstream.node.name)+'</b><div class="sub">'+
          esc(upstream.leg.label)+' \u2014 chained from another device</div></span>'
        : '<span class="swatch" style="background:#EDEFF1"></span>'+

      inBtn.className='btn sm'; inBtn.style.marginLeft='auto';

      inBtn.onclick=function(){ legPick={ node:n.id, leg:'__in' }; view='pickstrand'; render(); };
      inRow.appendChild(inBtn);
    }
    b.appendChild(inRow);

    /* --- the outputs --- */

    b.appendChild(lo);

    n.legs.forEach(function(g){
      var r=document.createElement('div');
      r.className='row';
      r.innerHTML='<span class="rowmain"><b>'+esc(g.label)+'</b><div class="sub">'+

      var bts=document.createElement('span'); bts.className='rowbtns';
      var cbtn=document.createElement('button');
      cbtn.className='btn sm'; cbtn.textContent=g.to?'Change':'Connect';
      cbtn.onclick=function(){ legPick={ node:n.id, leg:g.id }; view='pickleg'; render(); };
      bts.appendChild(cbtn);
      if (g.to){
        var x=document.createElement('button');
        x.className='ic del'; x.textContent='\u00D7'; x.title='Disconnect';
        x.onclick=function(){ g.to=null; draw(); render(); };
        bts.appendChild(x);
      }
      r.appendChild(bts);
      b.appendChild(r);
    });

  }

  if (n.type==='JOINT'){
    var sp=splicesAt(n.id);
    var l=document.createElement('div');
    l.className='lbl'; l.innerHTML='Splices <span class="r">'+sp.length+'</span>';
    b.appendChild(l);

    if (!sp.length){
      var e=document.createElement('div');
      e.className='note'; e.textContent='Nothing joined here yet. Cables pass each other untouched.';
      b.appendChild(e);
    } else {
      var tb=document.createElement('table'); tb.className='tbl';
      tb.innerHTML='<thead><tr><th>In</th><th>Out</th><th></th></tr></thead><tbody>'+
        sp.map(function(s){
          var ca=cable(s.aCable), cb=cable(s.bCable);
          return '<tr><td>'+swatch(s.aStrand)+' '+esc(s.aCable)+' \u00b7 '+strandLabel(s.aStrand,ca.cores)+'</td>'+
            '<td>'+swatch(s.bStrand)+' '+esc(s.bCable)+' \u00b7 '+strandLabel(s.bStrand,cb.cores)+'</td>'+
            '<td style="width:26px"><button class="ic del" data-s="'+s.id+'">\u00D7</button></td></tr>';
        }).join('')+'</tbody>';
      b.appendChild(tb);
      [].slice.call(tb.querySelectorAll('.ic.del')).forEach(function(btn){
        btn.onclick=function(){
          D.splices=D.splices.filter(function(x){ return x.id!==btn.dataset.s; });
          draw(); render();
        };
      });
    }

    var branch=document.createElement('button');
    branch.className='btn soft'; branch.style.cssText='width:100%;margin-top:9px';
    branch.textContent='+  Branch a new cable from here';
    branch.onclick=function(){
      draft={ kind:'route', path:[n.at.slice()], id:nextId('F',D.cables),
              cores:12, kindName:'Distribution', note:'', fromNode:n.id };
      draw(); render();
    };
    b.appendChild(branch);

    var addsp=document.createElement('button');
    addsp.className='btn soft'; addsp.style.cssText='width:100%;margin-top:9px';
    addsp.textContent='+  Splice strands here';
    addsp.onclick=function(){
      pick=null;
      // default: this joint's own cable on the left, the first other cable on the right
      var others=D.cables.filter(function(c){ return c.id!==n.cable; });
      spliceSel={ a:n.cable, b:(others[0]||cable(n.cable)).id };
      view='splice'; render();
    };
    b.appendChild(addsp);
  }

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ sel.node=null; view=sel.cable?'cable':'home'; draw(); render(); };
  var ed=document.createElement('button');
  ed.className='btn primary'; ed.textContent='Edit';
  ed.onclick=function(){ view='editNode'; render(); };
  var del=document.createElement('button');
  del.className='btn danger'; del.textContent='Delete';
  del.onclick=function(){
    if (!confirm('Delete '+n.name+'?')) return;
    D.nodes=D.nodes.filter(function(x){ return x.id!==n.id; });
    D.splices=D.splices.filter(function(x){ return x.joint!==n.id; });
    D.nodes.forEach(function(x){
      if (!x.legs) return;
      x.legs.forEach(function(g){
        if (g.to && (g.to.kind==='FATBOX'||g.to.kind==='DEVICE') && g.to.node===n.id) g.to=null;
      });
    });
    sel.node=null; view=sel.cable?'cable':'home'; draw(); render();
  };
  f.appendChild(back); f.appendChild(ed); f.appendChild(del);
}

/* ---------- the splice editor: input strand to output strand ---------- */
function spliceView(b,f){
  var j=node(sel.node), here=cable(j.cable);
  /* cables that physically reach this joint: its own, plus any whose path
     starts or ends within 40 m of it */
  /* A joint can be cut into a cable anywhere along its length, so any cable
     whose route passes close by is available here \u2014 not just ones that end here. */
  var reach=D.cables.filter(function(c){
    if (c.id===j.cable) return true;
    return snapToPath(j.at, c.path).dist < JOINT_REACH_M;
  });

  b.innerHTML='<h2 class="title">Splice at '+esc(j.name)+'</h2>'+
    '<p class="lead">Pick a strand on the left, then the strand it joins on the right. '+
    'Greyed strands are already used.</p>';

  if (reach.length<2){
    var w=document.createElement('div');
    w.className='note warn';
    w.innerHTML='Only <b>'+esc(j.cable)+'</b> reaches this joint. Draw another cable that '+
      'starts or ends here, then come back.';
    b.appendChild(w);
  } else {
    var g=document.createElement('div');
    g.className='sgrid';
    g.appendChild(strandColumn('a', reach, j));
    g.appendChild(strandColumn('b', reach, j));
    b.appendChild(g);
  }

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ pick=null; view='node'; render(); };
  f.appendChild(back);
}

function strandColumn(side, reach, j){
  /* j is the joint, so its distance along each cable decides what it can cut */
  var wrap=document.createElement('div');
  wrap.className='scol';
  // the cable this column is showing, remembered across re-renders
  if (!spliceSel[side] || !reach.some(function(c){ return c.id===spliceSel[side]; })){
    spliceSel[side] = (side==='a')
      ? j.cable
      : (reach.filter(function(c){ return c.id!==j.cable; })[0] || reach[0]).id;
  }
  var cid = spliceSel[side];

  var h='<h5>'+(side==='a'?'From':'To')+'</h5><div class="field"><select>'+
    reach.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===cid?' selected':'')+'>'+c.id+' \u00b7 '+c.cores+'F</option>';
    }).join('')+'</select></div><div class="slist"></div>';
  wrap.innerHTML=h;

  var c=cable(cid), uses=strandUses(cid);
  var jAlong=snapToPath(j.at, c.path).along;
  var list=wrap.querySelector('.slist');
  var html='';
  for (var i=1;i<=c.cores;i++){
    var chk=attachCheck(uses,i,jAlong,'EITHER');
    var st=strandStatus(uses,i), open=chk.ok;
    var on = pick && pick.side===side && pick.cable===cid && pick.strand===i;
    html+='<button class="sbtn'+(on?' on':'')+'" data-n="'+i+'"'+(open?'':' disabled')+'>'+
      swatch(i)+'<span>'+strandLabel(i,c.cores)+'</span>'+
      (strandEndsUsed(uses,i)?'<small>'+esc(open?st.text:(chk.why||st.text))+'</small>':'')+
      '</button>';
  }
  list.innerHTML=html;

  wrap.querySelector('select').onchange=function(){
    spliceSel[side]=this.value;
    if (pick && pick.side===side) pick=null;   // the pending pick was on the old cable
    render();
  };

  [].slice.call(list.querySelectorAll('.sbtn')).forEach(function(btn){
    btn.onclick=function(){
      var n=parseInt(btn.dataset.n,10);
      if (!pick || pick.side===side){ pick={ side:side, cable:cid, strand:n }; render(); return; }
      /* second pick completes the splice */
      var a = pick.side==='a' ? pick : { cable:cid, strand:n };
      var bb= pick.side==='a' ? { cable:cid, strand:n } : pick;
      if (a.cable===bb.cable && a.strand===bb.strand){ pick=null; render(); return; }
      D.splices.push({ id:'S'+Date.now(), joint:node(sel.node).id,
                       aCable:a.cable, aStrand:a.strand, bCable:bb.cable, bStrand:bb.strand });
      pick=null; view='node'; draw(); render();
    };
  });
  return wrap;
}

/* ---------- pick a strand to feed a device ---------- */
function pickStrandView(b,f){
  var n=node(legPick.node);

  /* A FAT box belongs to no cable, so fall back to any cable there is. */
  if (!pickCable || !cable(pickCable)){
    pickCable = (cable(n.inCable) && n.inCable) || (cable(n.cable) && n.cable) ||
                (D.cables[0] && D.cables[0].id) || null;
  }

  if (!pickCable){
    b.innerHTML='<h2 class="title">Feed '+esc(n.name)+'</h2>'+
      '<div class="note warn">There are no cables yet. Draw one first, then come back '+
      'and pick the strand that feeds this '+typeName(n.type).toLowerCase()+'.</div>';
    var only=document.createElement('button');
    only.className='btn'; only.textContent='\u2190 Back';
    only.onclick=function(){ legPick=null; pickCable=null; view='node'; render(); };
    f.appendChild(only);
    return;
  }

  b.innerHTML='<h2 class="title">Feed '+esc(n.name)+'</h2>'+
    '<p class="lead">What sends light into this '+typeName(n.type).toLowerCase()+
    '? Either a spare output on a nearby coupler or splitter, or a strand in a cable.</p>';

  /* --- spare outputs on other devices, nearest first --- */
  var spare=[];
  D.nodes.forEach(function(dv){
    if (dv.id===n.id || !dv.legs) return;
    dv.legs.forEach(function(g){
      if (g.to) return;                       // already feeding something
      spare.push({ node:dv, leg:g, d:metres(dv.at, n.at) });
    });
  });
  spare.sort(function(a,z){ return a.d-z.d; });

  var lo=document.createElement('div');
  lo.className='lbl';
  lo.innerHTML='From a device output <span class="r">'+spare.length+' spare</span>';
  b.appendChild(lo);

  if (!spare.length){
    var e0=document.createElement('div');
    e0.className='note';
    e0.textContent='No coupler or splitter has a spare output. Add one, or feed this from a strand below.';
    b.appendChild(e0);
  }

  spare.slice(0,8).forEach(function(sp){
    var r=document.createElement('div');
    r.className='row';
    r.innerHTML='<span class="'+markerClass(sp.node.type)+'" style="'+
      (sp.node.type==='COUPLER'?'border-left-width:5px;border-right-width:5px;border-bottom-width:9px'
       :'border-left-width:5px;border-right-width:5px;border-top-width:9px')+';flex:0 0 11px"></span>'+
      '<span class="rowmain"><b>'+esc(sp.node.name)+'</b><div class="sub">'+
      esc(sp.leg.label)+' \u00b7 \u2212'+sp.leg.loss.toFixed(2)+' dB</div></span>'+
      '<span class="meta">'+fmtM(sp.d)+'</span>';
    r.onclick=function(){
      /* one thing has one source, so release whatever fed it before */
      n.inCable=null; n.inStrand=null;
      var was=legFeedOf(n.id);
      if (was) was.leg.to=null;
      sp.leg.to={ kind:(n.type==='FATBOX'?'FATBOX':'DEVICE'), node:n.id };
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
    b.appendChild(r);
  });

  var ls=document.createElement('div');
  ls.className='lbl'; ls.textContent='Or straight from a cable strand';
  b.appendChild(ls);

  var pickWrap=document.createElement('div');
  pickWrap.innerHTML='<div class="field"><label>Cable</label><select id="pk_c">'+
    D.cables.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===pickCable?' selected':'')+'>'+
             c.id+' \u00b7 '+c.cores+'F</option>'; }).join('')+
    '</select></div>';
  b.appendChild(pickWrap);

  var c=cable(pickCable), uses=strandUses(pickCable);
  var myAlong=snapToPath(n.at, c.path).along;
  var list=document.createElement('div');
  list.className='slist';
  var html='';
  for (var i=1;i<=c.cores;i++){
    var st=strandStatus(uses,i);
    var mine = (n.inCable===pickCable && n.inStrand===i);
    var chk=attachCheck(uses,i,myAlong,'SINK');
    var busy = !mine && !chk.ok;
    html+='<button class="sbtn'+(mine?' on':'')+'" data-n="'+i+'"'+(busy?' disabled':'')+'>'+
      swatch(i)+'<span>'+strandLabel(i,c.cores)+'</span>'+
      (strandEndsUsed(uses,i)?'<small>'+esc(busy?(chk.why||'in use here'):st.text)+'</small>':'')+
      '</button>';
  }
  list.innerHTML=html;
  b.appendChild(list);

  $('pk_c').onchange=function(){ pickCable=this.value; render(); };
  [].slice.call(list.querySelectorAll('.sbtn')).forEach(function(btn){
    btn.onclick=function(){
      var was=legFeedOf(n.id);
      if (was) was.leg.to=null;            // a strand feed replaces a device feed
      n.inCable=pickCable; n.inStrand=parseInt(btn.dataset.n,10);
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
  });

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ legPick=null; pickCable=null; view='node'; render(); };
  f.appendChild(back);

  var upstream=legFeedOf(n.id);
  if (n.inCable || upstream){
    var clear=document.createElement('button');
    clear.className='btn danger'; clear.textContent='Disconnect';
    clear.onclick=function(){
      n.inCable=null; n.inStrand=null;
      if (upstream) upstream.leg.to=null;
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
    f.appendChild(clear);
  }
}

/* ---------- pick where a device output goes ---------- */
function pickLegView(b,f){
  var n=node(legPick.node);
  var g=n.legs.filter(function(x){ return x.id===legPick.leg; })[0];
  if (!pickCable || !cable(pickCable)){
    pickCable = (g.to && g.to.kind==='CABLE' && cable(g.to.cable) && g.to.cable) ||
                (cable(n.cable) && n.cable) || (D.cables[0] && D.cables[0].id) || null;
  }

  b.innerHTML='<h2 class="title">'+esc(g.label)+'</h2>'+
    '<p class="lead">Where does this output go? Into a FAT box, into another coupler or '+
    'splitter, or into a strand that carries it further.</p>'+
    '<div class="lbl">Into a FAT box</div>';

  var fats=D.nodes.filter(function(x){ return x.type==='FATBOX'; });
  if (!fats.length){
    var e=document.createElement('div');
    e.className='note'; e.textContent='No FAT boxes yet. Add one to a cable first.';
    b.appendChild(e);
  }
  fats.forEach(function(fb){
    var taken=feedOf(fb.id);
    var mine = g.to && g.to.kind==='FATBOX' && g.to.node===fb.id;
    var r=document.createElement('div');
    r.className='row'+(mine?' on':'');
    r.innerHTML='<span class="mk-fatbox" style="width:11px;height:11px;flex:0 0 11px;border-width:1px"></span>'+
      '<span class="rowmain"><b>'+esc(fb.name)+'</b><div class="sub">'+
      (fb.ports-usedPorts(fb))+' of '+fb.ports+' ports free'+
      (taken && !mine ? ' \u00b7 already fed by '+esc(taken.node.name) : '')+'</div></span>';
    if (taken && !mine){ r.style.opacity='.45'; r.style.cursor='not-allowed'; }
    else r.onclick=function(){
      g.to={ kind:'FATBOX', node:fb.id };
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
    b.appendChild(r);
  });

  /* into another device */
  var l15=document.createElement('div');
  l15.className='lbl'; l15.textContent='Or into another coupler or splitter';
  b.appendChild(l15);

  var devs=D.nodes.filter(function(x){
    return (x.type==='COUPLER'||x.type==='SPLITTER') && x.id!==n.id;
  });
  if (!devs.length){
    var e2=document.createElement('div');
    e2.className='note'; e2.textContent='No other couplers or splitters yet.';
    b.appendChild(e2);
  }
  devs.forEach(function(dv){
    var mineD = g.to && g.to.kind==='DEVICE' && g.to.node===dv.id;
    var fedBy = dv.inCable ? ('strand '+dv.inStrand+' of '+dv.inCable) : legFeedOf(dv.id);
    var r=document.createElement('div');
    r.className='row'+(mineD?' on':'');
    r.innerHTML='<span class="'+markerClass(dv.type)+'" style="'+
      (dv.type==='COUPLER'?'border-left-width:5px;border-right-width:5px;border-bottom-width:9px'
       :'border-left-width:5px;border-right-width:5px;border-top-width:9px')+';flex:0 0 11px"></span>'+
      '<span class="rowmain"><b>'+esc(dv.name)+'</b><div class="sub">'+
      typeName(dv.type)+' '+esc(dv.ratio)+
      (fedBy && !mineD ? ' \u00b7 already fed by '+esc(typeof fedBy==='string'?fedBy:fedBy.node.name) : '')+
      '</div></span>';
    if (fedBy && !mineD){ r.style.opacity='.45'; r.style.cursor='not-allowed'; }
    else r.onclick=function(){
      g.to={ kind:'DEVICE', node:dv.id };
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
    b.appendChild(r);
  });

  var l2=document.createElement('div');
  l2.className='lbl'; l2.textContent='Or onward in a strand';
  b.appendChild(l2);

  if (!pickCable){
    var noc=document.createElement('div');
    noc.className='note warn'; noc.textContent='No cables drawn yet, so this output cannot continue in a strand.';
    b.appendChild(noc);
    var onlyBack=document.createElement('button');
    onlyBack.className='btn'; onlyBack.textContent='\u2190 Back';
    onlyBack.onclick=function(){ legPick=null; pickCable=null; view='node'; render(); };
    f.appendChild(onlyBack);
    return;
  }

  var sel2=document.createElement('div');
  sel2.className='field';
  sel2.innerHTML='<label>Cable</label><select id="pl_c">'+
    D.cables.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===pickCable?' selected':'')+'>'+
             c.id+' \u00b7 '+c.cores+'F</option>'; }).join('')+'</select>';
  b.appendChild(sel2);

  var c=cable(pickCable), uses=strandUses(pickCable);
  var myAlong2=snapToPath(n.at, c.path).along;
  var list=document.createElement('div');
  list.className='slist';
  var html='';
  for (var i=1;i<=c.cores;i++){
    var st=strandStatus(uses,i);
    var mine2 = g.to && g.to.kind==='CABLE' && g.to.cable===pickCable && g.to.strand===i;
    var chk2=attachCheck(uses,i,myAlong2,'SOURCE');
    var busy = !mine2 && !chk2.ok;
    html+='<button class="sbtn'+(mine2?' on':'')+'" data-n="'+i+'"'+(busy?' disabled':'')+'>'+
      swatch(i)+'<span>'+strandLabel(i,c.cores)+'</span>'+
      (strandEndsUsed(uses,i)?'<small>'+esc(busy?(chk2.why||'in use here'):st.text)+'</small>':'')+
      '</button>';
  }
  list.innerHTML=html;
  b.appendChild(list);

  $('pl_c').onchange=function(){ pickCable=this.value; render(); };
  [].slice.call(list.querySelectorAll('.sbtn')).forEach(function(btn){
    btn.onclick=function(){
      g.to={ kind:'CABLE', cable:pickCable, strand:parseInt(btn.dataset.n,10) };
      legPick=null; pickCable=null; view='node'; draw(); render();
    };
  });

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ legPick=null; pickCable=null; view='node'; render(); };
  f.appendChild(back);
  if (g.to){
    var clr=document.createElement('button');
    clr.className='btn danger'; clr.textContent='Disconnect';
    clr.onclick=function(){ g.to=null; legPick=null; pickCable=null; view='node'; draw(); render(); };
    f.appendChild(clr);
  }
}

      CORE_OPTIONS.map(function(n){ return '<option'+(n===c.cores?' selected':'')+'>'+n+'</option>'; }).join('')+

        return '<option'+(k===c.kind?' selected':'')+'>'+k+'</option>'; }).join('')+

    '<div class="lbl">Route \u00b7 '+c.path.length+' points \u00b7 '+fmtM(pathLen(c.path))+'</div>';

  c.path.forEach(function(p,i){
    var r=document.createElement('div');
    r.className='row';
    r.innerHTML='<span class="mk-vtx" style="width:9px;height:9px;flex:0 0 9px"></span>'+
      '<span class="rowmain"><b>'+(i===0?'Start':i===c.path.length-1?'End':'Bend '+i)+'</b>'+
      '<div class="sub">'+p[1].toFixed(5)+', '+p[0].toFixed(5)+'</div></span>';
    if (c.path.length>2){
      var x=document.createElement('button');
      x.className='ic del'; x.textContent='\u00D7'; x.style.marginLeft='auto';
      x.onclick=function(){ c.path.splice(i,1); draw(); render(); };
      r.appendChild(x);
    }
    b.appendChild(r);
  });

  var n=document.createElement('div');
  n.className='note';
  n.innerHTML='In the real thing you would drag a bend on the map. Here you can only remove points.';
  b.appendChild(n);

  var cancel=document.createElement('button');
  cancel.className='btn'; cancel.textContent='Cancel';
  cancel.onclick=function(){ view='cable'; render(); };
  var save=document.createElement('button');
  save.className='btn primary'; save.textContent='Save';
  save.onclick=function(){
    var id=$('e_id').value.trim();
    if (!id){ $('e_msg').className='msg bad'; $('e_msg').textContent='ID cannot be blank.'; return; }
    if (id!==c.id && cable(id)){ $('e_msg').className='msg bad'; $('e_msg').textContent='That ID is taken.'; return; }
    var newCores=parseInt($('e_cores').value,10);
    var maxUsed=Math.max.apply(null,[0].concat(Object.keys(strandUses(c.id)).map(Number)));
    if (newCores<maxUsed){
      $('e_msg').className='msg bad';
      $('e_msg').textContent='Strand '+maxUsed+' is in use, so it cannot drop to '+newCores+' cores.';

    }
    if (id!==c.id){
      D.nodes.forEach(function(x){ if(x.cable===c.id) x.cable=id; });
      D.ports.forEach(function(x){ if(x.cable===c.id) x.cable=id; });
      D.splices.forEach(function(x){
        if(x.aCable===c.id) x.aCable=id;
        if(x.bCable===c.id) x.bCable=id;
      });
      c.id=id; sel.cable=id;
    }
    c.cores=newCores; c.kind=$('e_kind').value; c.note=$('e_note').value.trim();
    view='cable'; draw(); render();
  };
  f.appendChild(cancel); f.appendChild(save);
}

function editNode(b,f){
  var n=node(sel.node);
  b.innerHTML='<h2 class="title">Edit '+esc(n.name)+'</h2>'+
    '<div class="field"><label>Name <i>*</i></label><input id="x_name" value="'+esc(n.name)+'"></div>'+
    (n.type==='COUPLER'?'<div class="field"><label>Split ratio</label><select id="x_val">'+
      COUPLER_VALUES.map(function(v){ return '<option value="'+v.ratio+'"'+(v.ratio===n.ratio?' selected':'')+'>'+
        v.ratio+' \u00b7 tap '+v.tap+'% / pass '+v.pass+'%</option>'; }).join('')+
      '</select></div>':'')+
    (n.type==='SPLITTER'?'<div class="field"><label>Split ratio</label><select id="x_val">'+
      SPLITTER_TYPES.map(function(v){ return '<option value="'+v.ratio+'"'+(v.ratio===n.ratio?' selected':'')+'>'+
        v.ratio+' \u00b7 '+v.ways+' outputs</option>'; }).join('')+
      '</select><div class="msg">Changing this rebuilds the output list and clears connections.</div></div>':'')+
    (n.type==='FATBOX'?'<div class="two"><div class="field"><label>Box number</label>'+
      '<input id="x_no" maxlength="3" value="'+esc(n.no)+'"></div>'+
      '<div class="field"><label>Total ports</label><select id="x_ports">'+
      [4,8,16,24].map(function(k){ return '<option'+(k===n.ports?' selected':'')+'>'+k+'</option>'; }).join('')+
      '</select></div></div>'+
      '<div class="msg">Customers are connected on the box\u2019s own screen, port by port.</div>':'')+
    '<div class="field"><label>Note</label><input id="x_note" value="'+esc(n.note||'')+'"></div>'+
    '<div class="msg" id="x_msg"></div>';

  var cancel=document.createElement('button');
  cancel.className='btn'; cancel.textContent='Cancel';
  cancel.onclick=function(){ view='node'; render(); };
  var save=document.createElement('button');
  save.className='btn primary'; save.textContent='Save';
  save.onclick=function(){
    var nm=$('x_name').value.trim();
    if (!nm){ $('x_msg').className='msg bad'; $('x_msg').textContent='Name is required.'; return; }
    if (n.type==='FATBOX'){
      var raw=$('x_no').value.replace(/[^0-9]/g,''), v=parseInt(raw,10);
      if (!(v>=1&&v<=999)){ $('x_msg').className='msg bad'; $('x_msg').textContent='Box number must be 1 to 999.'; return; }
      var code=('00'+v).slice(-3);
      if (D.nodes.some(function(x){ return x!==n&&x.type==='FATBOX'&&x.no===code; })){
        $('x_msg').className='msg bad'; $('x_msg').textContent='FAT box '+code+' already exists.'; return;
      }
      var tot=parseInt($('x_ports').value,10);
      var highest=(n.customers||[]).reduce(function(a,c){ return Math.max(a,c.port); },0);
      if (tot<highest){
        $('x_msg').className='msg bad';
        $('x_msg').textContent='Port '+highest+' has a customer on it, so the box cannot shrink to '+tot+'.';
        return;
      }
      n.no=code; n.ports=tot;
    }
    if (n.type==='COUPLER'||n.type==='SPLITTER'){
      var newRatio=$('x_val').value;
      if (newRatio!==n.ratio){ n.ratio=newRatio; n.legs=makeLegs(n.type, newRatio); }
    }
    n.name=nm; n.note=$('x_note').value.trim();
    view='node'; draw(); render();
  };
  f.appendChild(cancel); f.appendChild(save);
}

function delCable(c){
  var kids=nodesOn(c.id).length, users=portsUsing(c.id).length;
  var msg='Delete '+c.id+'?';
  if (kids||users) msg+='\n\n'+kids+' items sit on it and '+users+' ports use its strands. '+
    'They will be detached, not deleted.';
  if (!confirm(msg)) return;
  D.cables=D.cables.filter(function(x){ return x.id!==c.id; });
  D.nodes=D.nodes.filter(function(x){ return x.cable!==c.id; });
  D.splices=D.splices.filter(function(x){ return x.aCable!==c.id&&x.bCable!==c.id; });
  D.ports.forEach(function(p){ if(p.cable===c.id){ p.cable=null; p.strand=null; p.serves=null; } });
  if (sel.cable===c.id) sel.cable=null;
  view='home'; draw(); render();
}


/* ---------- rename, move and delete for the service side ---------- */
function renameThing(rec, label){
  var v=prompt(label+':', rec.name);
  if (v===null) return;
  v=String(v).trim();
  if (!v) return;
  rec.name=v; draw(); render();
}

function delOffice(o){
  var olts=D.olts.filter(function(x){ return x.office===o.id; });
  var ports=D.ports.filter(function(p){
    return olts.some(function(x){ return x.id===p.olt; }); });
  var live=ports.filter(function(p){ return p.cable; });

  var msg='Delete '+o.name+'?';
  if (olts.length) msg+='\n\n'+olts.length+' OLT'+(olts.length===1?'':'s')+' and '+
    ports.length+' port'+(ports.length===1?'':'s')+' go with it.';
  if (live.length) msg+='\n'+live.length+' of those port'+(live.length===1?' is':'s are')+
    ' feeding a cable. The cables stay \u2014 they are still in the ground.';
  if (!confirm(msg)) return;

  D.ports=D.ports.filter(function(p){
    return !olts.some(function(x){ return x.id===p.olt; }); });
  D.olts=D.olts.filter(function(x){ return x.office!==o.id; });
  D.offices=D.offices.filter(function(x){ return x.id!==o.id; });
  if (sel.office===o.id) sel.office=null;
  view='home'; draw(); render();
}

function delOlt(ol){
  var ps=D.ports.filter(function(p){ return p.olt===ol.id; });
  var live=ps.filter(function(p){ return p.cable; });
  var msg='Delete '+ol.name+'?';
  if (ps.length) msg+='\n\n'+ps.length+' port'+(ps.length===1?'':'s')+' go with it.';
  if (live.length) msg+='\nThe cable'+(live.length===1?'':'s')+' they feed will stay.';
  if (!confirm(msg)) return;
  D.ports=D.ports.filter(function(p){ return p.olt!==ol.id; });
  D.olts=D.olts.filter(function(x){ return x.id!==ol.id; });
  if (sel.olt===ol.id){ sel.olt=null; view='office'; }
  draw(); render();
}

function delPort(p){
  var msg='Delete '+p.name+'?';
  if (p.cable) msg+='\n\nIt feeds strand '+p.strand+' of '+p.cable+
    '. The cable stays; that strand simply becomes free.';
  if (!confirm(msg)) return;
  D.ports=D.ports.filter(function(x){ return x.id!==p.id; });
  if (sel.port===p.id){ sel.port=null; view='olt'; }
  draw(); render();
}

  b.innerHTML='<h2 class="title">New office</h2>'+

    '<div class="orsep">OR</div>'+
    '<div class="field"><label>Google Maps link</label>'+

    '<div class="two"><div class="field"><label>Latitude</label>'+
    '<input id="o_lat" inputmode="decimal" placeholder="18.532718" value="'+
      (draft.at?draft.at[1].toFixed(6):'')+'"></div>'+
    '<div class="field"><label>Longitude</label>'+
    '<input id="o_lng" inputmode="decimal" placeholder="73.877749" value="'+

    '<div class="note">'+(draft.at
      ? 'Placed at '+draft.at[1].toFixed(5)+', '+draft.at[0].toFixed(5)+
        ' \u00b7 click the map again to move it'
      : 'Not placed yet. Search, paste a link, type coordinates, or click the map.')+'</div>';

  $('o_name').oninput=function(){ draft.name=this.value; };

  function place(at, note){
    draft.at=at;
    if (note && !draft.name) { draft.name=note; }
    draw(); render();
  }

  /* keep what the user typed when the panel redraws after a lookup */
  if (draft.linkText) $('o_link').value=draft.linkText;

  ['o_lat','o_lng'].forEach(function(id){
    $(id).onchange=function(){
      var la=parseFloat($('o_lat').value), lg=parseFloat($('o_lng').value);
      if (la>=-90&&la<=90&&lg>=-180&&lg<=180) place([lg,la]);
    };
  });

  $('o_link').oninput=function(){ draft.linkText=this.value; };
  $('o_link').onchange=function(){
    var v=this.value.trim(), m=$('o_lmsg');
    draft.linkText=v;
    if (!v){ m.className='msg'; m.textContent=''; return; }
    var at=coordsFromLink(v);
    if (at){
      offMsg={ cls:'good', text:'Found '+at[1].toFixed(6)+', '+at[0].toFixed(6) };
      place(at);
    } else if (isShortLink(v) && resolverUrl()){
      m.className='msg'; m.textContent='Following the link\u2026';
      resolveViaServer(v).then(function(got){
        if (got){
          offMsg={ cls:'good', text:'Found '+got[1].toFixed(6)+', '+got[0].toFixed(6) };
          place(got);
        } else {
          offMsg={ cls:'bad', text:'That link does not carry coordinates. Search above instead.' };
          render();
        }
      });
    } else if (isShortLink(v)){
      m.className='msg bad';
      m.className='msg bad';
      m.innerHTML='Short links need a backend to follow them. ' +
        '<button class="lnkbtn" id="o_setapi">Set it up once</button>';
      var sb=document.getElementById('o_setapi');
      if (sb) sb.onclick=function(){
        if (askResolver()){ $('o_link').dispatchEvent(new Event('change')); }
      };
    } else {
      m.className='msg bad';
      m.textContent='No coordinates in that link. Search above or type them below.';
    }
  };

  var qt=null;
  $('o_q').oninput=function(){
    var q=this.value.trim(), m=$('o_qmsg'), hits=$('o_hits');
    clearTimeout(qt);
    if (q.length<3){ m.textContent=''; hits.innerHTML=''; return; }
    m.className='msg'; m.textContent='Searching\u2026';
    qt=setTimeout(function(){
      fetch('https://photon.komoot.io/api/?limit=5&lat=18.52&lon=73.86&q='+encodeURIComponent(q))
        .then(function(r){ return r.json(); })
        .then(function(js){
          var fs=(js.features||[]);
          m.textContent = fs.length ? '' : 'Nothing found. Try a landmark or paste a link.';
          hits.innerHTML='';
          fs.forEach(function(ft){
            var p=ft.properties||{};
            var label=[p.name,p.street,p.city,p.state].filter(Boolean).join(', ');
            var r=document.createElement('div');
            r.className='row';
            r.innerHTML='<span class="mk-office" style="width:10px;height:10px;flex:0 0 10px;border-width:1px"></span>'+
              '<span class="rowmain"><b>'+esc(p.name||label)+'</b><div class="sub">'+esc(label)+'</div></span>';
            r.onclick=function(){
              place([ft.geometry.coordinates[0], ft.geometry.coordinates[1]], p.name||'');
            };
            hits.appendChild(r);
          });
        })
        .catch(function(){
          m.className='msg bad';
          m.textContent='Search is unavailable. Paste a link or type coordinates.';
        });
    }, 350);
  };

  var cancel=document.createElement('button');
  cancel.className='btn'; cancel.textContent='Cancel';
  cancel.onclick=function(){ draft=null; draw(); render(); };

  var save=document.createElement('button');
  save.className='btn primary'; save.textContent='Save office';
  save.disabled=!draft.at;
  save.onclick=function(){
    var nm=($('o_name').value||'').trim();
    if (!nm){ $('o_msg').className='msg bad'; $('o_msg').textContent='Give the office a name.'; return; }
    var id=nextId('L', D.offices);
    D.offices.push({ id:id, name:nm, at:draft.at });
    draft=null; sel.office=id; view='office'; draw(); render();
  };
  f.appendChild(cancel); f.appendChild(save);
}

    '<div class="cap"><i style="width:'+Math.round(fu/(fp||1)*100)+'%"></i></div>'+
    '<div class="kv" style="margin-top:5px">'+fu+' of '+fp+' FAT ports used \u00b7 '+
    '<span class="free">'+(fp-fu)+' available</span></div>'+
    '<div class="lbl">Cables by use</div>';

  var tb=document.createElement('table'); tb.className='tbl';
  tb.innerHTML='<thead><tr><th>Cable</th><th>Cores</th><th>Free</th><th>Length</th></tr></thead><tbody>'+
    D.cables.map(function(c){
      var free=freeCount(c);
      return '<tr><td>'+esc(c.id)+'</td><td>'+c.cores+'</td>'+
        '<td class="'+(free?'free':'dim')+'">'+free+'</td>'+
        '<td>'+fmtM(pathLen(c.path))+'</td></tr>';
    }).join('')+'</tbody>';
  b.appendChild(tb);

  var unfed=D.nodes.filter(function(n){
    if (n.type==='FATBOX') return !feedOf(n.id);
    return n.legs && !n.inCable && !legFeedOf(n.id);
  });
  if (unfed.length){
    var uw=document.createElement('div');
    uw.className='note warn';
    uw.innerHTML='<b>'+unfed.map(function(n){ return n.name; }).join(', ')+
      '</b> '+(unfed.length===1?'has':'have')+' nothing feeding '+
      (unfed.length===1?'it':'them')+' yet, so no light can reach '+
      (unfed.length===1?'it':'them')+'.';
    b.appendChild(uw);
  }

  var full=fats.filter(function(n){ return n.ports-n.used===0; });
  if (full.length){
    var w=document.createElement('div');
    w.className='note warn';
    w.innerHTML='<b>'+full.map(function(n){return n.name;}).join(', ')+
      '</b> '+(full.length===1?'is':'are')+' full. Any customer near '+
      (full.length===1?'it':'them')+' needs new plant, not just a drop cable.';
    b.appendChild(w);
  }

  var back=document.createElement('button');
  back.className='btn'; back.textContent='\u2190 Back';
  back.onclick=function(){ view='home'; render(); };
  f.appendChild(back);
}

/* =========================================================================

function dashboardView(b,f){
  document.body.classList.add('dash');

  var wrap=document.createElement('div');

  wrap.innerHTML=
    '<div class="dashhead"><h1>Network dashboard</h1>'+
    '<div class="sub">'+D.offices.length+' offices \u00b7 '+fmtM(km)+' of cable</div></div>'+
    '<div class="tiles">'+
      tile(custs.length,'customers')+
      tile(freePorts,'free ports')+
      tile(D.cables.length,'cables')+
      tile(fats.length,'FAT boxes')+
      tile(D.nodes.filter(function(n){return n.type!=='FATBOX';}).length,'joints and devices')+
    '</div>';

  var open=document.createElement('button');
  open.className='btn primary';
  open.style.cssText='margin-bottom:22px;padding:11px 18px';
  open.textContent='View and Create Network Map';
  open.onclick=function(){
    mode='map'; dashSel=null;
    document.body.classList.remove('dash');
    view='home'; tab='network';
    if (map) setTimeout(function(){ map.resize(); fitAll(); }, 30);
    draw(); render();
  };
  wrap.appendChild(open);

  var fl=document.createElement('div');
  fl.className='filters';
  fl.innerHTML=
    sel1('df_office','All offices', D.offices.map(function(o){ return [o.id,o.name]; }), dashF.office)+
    sel1('df_olt','All OLTs', D.olts.map(function(o){
      var of=office(o.office); return [o.id, o.name+(of?' \u00b7 '+of.name:'')]; }), dashF.olt)+
    sel1('df_port','All ports', D.ports.map(function(p){
      var o=olt(p.olt); return [p.id,(o?o.name+' / ':'')+p.name]; }), dashF.port)+
    sel1('df_cable','All fibres', D.cables.map(function(c){ return [c.id,c.id+' \u00b7 '+c.cores+'F']; }), dashF.cable)+
    '<input id="df_q" placeholder="Search a customer" value="'+esc(dashF.q)+'">';
  wrap.appendChild(fl);

  var rows=custs.map(function(x){
    return { fat:x.fat, cust:x.cust, path:traceCustomer(x.fat, x.cust) };
  }).filter(function(x){
    if (dashF.q && x.cust.name.toLowerCase().indexOf(dashF.q.toLowerCase())<0) return false;
    var ids=x.path.map(function(st){ return st.id||''; });
    var titles=x.path.map(function(st){ return st.title; });
    if (dashF.office){
      var of=office(dashF.office);
      if (!of || titles.indexOf(of.name)<0) return false;
    }
    if (dashF.olt){
      var ol=olt(dashF.olt);
      if (!ol || titles.indexOf(ol.name)<0) return false;
    }
    if (dashF.port){
      var p=D.ports.filter(function(y){ return y.id===dashF.port; })[0];
      if (!p) return false;
      var ol2=olt(p.olt);
      if (titles.indexOf(p.name)<0 || (ol2 && titles.indexOf(ol2.name)<0)) return false;
    }
    if (dashF.cable && ids.indexOf(dashF.cable)<0) return false;
    return true;
  });

  var split=document.createElement('div');
  split.className='dashsplit';

  var left=document.createElement('div');
  var lh=document.createElement('div');
  lh.className='lbl'; lh.style.marginTop='0';
  lh.innerHTML='Customers <span class="r">'+rows.length+'</span>';
  left.appendChild(lh);

  var list=document.createElement('div');
  list.className='custlist';
  if (!rows.length){
    list.innerHTML='<div class="ci"><span>'+
      (custs.length?'Nothing matches those filters.':'No customers connected yet.')+'</span></div>';
  }
  rows.forEach(function(x){
    var on = dashSel && dashSel.fatId===x.fat.id && dashSel.port===x.cust.port;
    var ci=document.createElement('div');
    ci.className='ci'+(on?' on':'');
    ci.innerHTML='<b>'+esc(x.cust.name)+'</b><span>'+esc(x.fat.name)+
      ' \u00b7 port '+String(x.cust.port).padStart(2,'0')+'</span>';
    ci.onclick=function(){ dashSel={ fatId:x.fat.id, port:x.cust.port }; render(); };
    list.appendChild(ci);
  });
  left.appendChild(list);
  split.appendChild(left);

  var right=document.createElement('div');
  var rh=document.createElement('div');
  rh.className='lbl'; rh.style.marginTop='0';
  rh.textContent='Connection path';
  right.appendChild(rh);

  var chosen=rows.filter(function(x){
    return dashSel && x.fat.id===dashSel.fatId && x.cust.port===dashSel.port; })[0];

  if (!chosen){
    var e=document.createElement('div');
    e.className='flowempty';
    e.textContent='Pick a customer to see how they are connected.';
    right.appendChild(e);
  } else {
    var flow=document.createElement('div');
    flow.className='flow';
    chosen.path.forEach(function(st,i){
      if (i){
        var ar=document.createElement('div');
        ar.className='farrow'; ar.textContent='\u2192';
        flow.appendChild(ar);
      }
      var d0=document.createElement('div');
      d0.className='fstep'+(i===chosen.path.length-1?' end':'')+
        (st.kind==='GAP'?' gap':'');
      d0.innerHTML='<div class="k">'+esc(stepKind(st.kind))+'</div>'+
        '<b>'+esc(st.title)+'</b>'+(st.meta?'<div class="m">'+esc(st.meta)+'</div>':'');
      flow.appendChild(d0);
    });
    right.appendChild(flow);

    var go=document.createElement('button');
    go.className='btn'; go.style.marginTop='16px';
    go.textContent='Show this on the map';
    go.onclick=function(){
      mode='map'; document.body.classList.remove('dash');
      sel.node=chosen.fat.id; view='node'; tab='network';
      if (map) setTimeout(function(){
        map.resize();
        map.easeTo({ center:chosen.fat.at, zoom:17, duration:600 });
      }, 30);
      draw(); render();
    };
    right.appendChild(go);
  }
  split.appendChild(right);
  wrap.appendChild(split);
  b.appendChild(wrap);

  ['df_office','df_olt','df_port','df_cable'].forEach(function(id){
    var el=document.getElementById(id);
    if (el) el.onchange=function(){
      dashF[id.slice(3)]=this.value; dashSel=null; render();
    };
  });
  var q=document.getElementById('df_q');
  if (q) q.oninput=function(){ dashF.q=this.value; render(); };
}

function tile(n,label){
  return '<div class="tile"><div class="n">'+n+'</div><div class="t">'+label+'</div></div>';
}
function sel1(id, blank, opts, chosen){
  return '<select id="'+id+'"><option value="">'+blank+'</option>'+
    opts.map(function(o){
      return '<option value="'+esc(o[0])+'"'+(o[0]===chosen?' selected':'')+'>'+esc(o[1])+'</option>';
    }).join('')+'</select>';
}
function stepKind(k){
  return { OFFICE:'Office', OLT:'OLT', PORT:'Port', CABLE:'Fibre', LEG:'Output',
           SPLICE:'Joint', JOINT:'Joint', COUPLER:'Coupler', SPLITTER:'Splitter',
           FATBOX:'FAT box', CUSTOMER:'Customer', GAP:'Missing' }[k] || k;
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
var dFilter='CUSTOMER', dQuery='', dPick=null;

var DFILTERS=[
  { k:'CUSTOMER', label:'Customers' },
  { k:'FATBOX',   label:'FAT boxes' },
  { k:'CABLE',    label:'Cables' },
  { k:'OLT',      label:'OLTs' },
  { k:'OFFICE',   label:'Offices' },
  { k:'FREE',     label:'Spare capacity' }
];

var ICON={
  OFFICE:'#1A73E8', OLT:'#1A73E8', PORT:'#1A73E8', CABLE:'#37474F',
  JOINT:'#263238', COUPLER:'#4527A0', SPLITTER:'#00838F',
  FATBOX:'#C2185B', CUSTOMER:'#C2185B'
};
var KIND={
  OFFICE:'Office', OLT:'OLT', PORT:'Port', CABLE:'Cable', JOINT:'Joint',
  COUPLER:'Coupler', SPLITTER:'Splitter', FATBOX:'FAT box', CUSTOMER:'Customer'
};

function dashCounts(){
  var custs=0, ports=0, used=0;
  D.nodes.forEach(function(n){
    if (n.type!=='FATBOX') return;
    ports+=Number(n.ports||0);
    custs+=(n.customers||[]).length;
  });
  used=custs;
  var km=0; D.cables.forEach(function(c){ km+=pathLen(c.path); });
  return { customers:custs, freePorts:Math.max(0,ports-used), cables:D.cables.length, km:km };
}

function renderDash(){
  var c=dashCounts();
  $('dStats').innerHTML=
    '<div><div class="n">'+c.customers+'</div><div class="t">customers connected</div></div>'+
    '<div><div class="n">'+c.freePorts+'</div><div class="t">ports free</div></div>'+
    '<div><div class="n">'+c.cables+'</div><div class="t">cables</div></div>'+
    '<div><div class="n">'+fmtM(c.km)+'</div><div class="t">in the ground</div></div>';

  $('dChips').innerHTML=DFILTERS.map(function(f){
    return '<button class="chip'+(dFilter===f.k?' on':'')+'" data-k="'+f.k+'">'+f.label+'</button>';
  }).join('');
  [].slice.call($('dChips').querySelectorAll('.chip')).forEach(function(b){
    b.onclick=function(){ dFilter=b.dataset.k; dPick=null; renderDash(); };
  });

  var q=dQuery.trim().toLowerCase();
  var items=dashItems(dFilter).filter(function(it){
    return !q || (it.title+' '+it.sub).toLowerCase().indexOf(q)>-1;
  });

  var list=$('dList');
  list.innerHTML='';
  if (!items.length){
    var e=document.createElement('div');
    e.className='dempty';
    e.textContent = D.cables.length ? 'Nothing matches.' : 'Nothing on the network yet.';
    list.appendChild(e);
  }
  items.slice(0,300).forEach(function(it){
    var r=document.createElement('div');
    r.className='ditem'+(dPick && dPick.key===it.key ? ' on' : '');
    r.innerHTML='<span class="fdot" style="background:'+(ICON[it.icon]||'#5F6368')+
      (it.icon==='CUSTOMER'?';border-radius:50%':'')+'"></span>'+
      '<span class="rowmain"><b>'+esc(it.title)+'</b><div class="sub">'+esc(it.sub)+'</div></span>';
    r.onclick=function(){ dPick=it; renderDash(); };
    list.appendChild(r);
  });

  renderDashMain();
}

function dashItems(kind){
  var out=[];
  if (kind==='CUSTOMER'){
    D.nodes.forEach(function(n){
      if (n.type!=='FATBOX') return;
      (n.customers||[]).forEach(function(cu){
        out.push({ key:'cu:'+n.id+':'+cu.port, icon:'CUSTOMER', title:cu.name,
                   sub:n.name+' \u00b7 port '+String(cu.port).padStart(2,'0'),
                   kind:'CUSTOMER', node:n, cust:cu });
      });
    });
  } else if (kind==='FATBOX'){
    D.nodes.filter(function(n){ return n.type==='FATBOX'; }).forEach(function(n){
      var free=n.ports-usedPorts(n);
      out.push({ key:'fb:'+n.id, icon:'FATBOX', title:n.name,
                 sub:free?free+' of '+n.ports+' ports free':'full',
                 kind:'NODE', node:n });
    });
  } else if (kind==='CABLE'){
    D.cables.forEach(function(c){
      var uses=strandUses(c.id);
      out.push({ key:'cb:'+c.id, icon:'CABLE', title:c.id,
                 sub:c.kind+' \u00b7 '+c.cores+'F \u00b7 '+
                     (c.cores-Object.keys(uses).length)+' strands free',
                 kind:'CABLE', cable:c });
    });
  } else if (kind==='OLT'){
    D.olts.forEach(function(o){
      var ps=D.ports.filter(function(p){ return p.olt===o.id; });
      var off=office(o.office);
      out.push({ key:'ol:'+o.id, icon:'OLT', title:o.name,
                 sub:(off?off.name:'')+' \u00b7 '+
                     ps.filter(function(p){return p.cable;}).length+' of '+ps.length+' ports used',
                 kind:'OLT', olt:o });
    });
  } else if (kind==='OFFICE'){
    D.offices.forEach(function(o){
      var olts=D.olts.filter(function(x){ return x.office===o.id; });
      out.push({ key:'of:'+o.id, icon:'OFFICE', title:o.name,
                 sub:olts.length+(olts.length===1?' OLT':' OLTs'),
                 kind:'OFFICE', office:o });
    });
  } else if (kind==='FREE'){
    D.nodes.filter(function(n){ return n.type==='FATBOX' && n.ports-usedPorts(n)>0; })
      .forEach(function(n){
        out.push({ key:'fr:'+n.id, icon:'FATBOX', title:n.name,
                   sub:(n.ports-usedPorts(n))+' ports free',
                   kind:'NODE', node:n });
      });
    D.nodes.forEach(function(n){
      (n.legs||[]).forEach(function(g){
        if (g.to) return;
        out.push({ key:'lg:'+n.id+':'+g.id, icon:n.type, title:n.name+' \u00b7 '+g.label,
                   sub:'spare output \u00b7 \u2212'+g.loss.toFixed(2)+' dB',
                   kind:'NODE', node:n });
      });
    });
  }
  return out;
}

function flowHtml(steps){
  return steps.map(function(st, i){
    var arrow = i ? '<div class="farrow">\u203a</div>' : '';
    var meta=[];
    if (st.sub) meta.push(esc(st.sub));
    if (st.via) meta.push(esc(st.via));
    return arrow+
      '<div class="fstep">'+
        '<div class="fk"><span class="fdot" style="background:'+(ICON[st.icon]||'#5F6368')+
          (st.icon==='CUSTOMER'?';border-radius:50%':'')+'"></span>'+(KIND[st.icon]||'')+'</div>'+
        '<div class="fn">'+esc(st.title)+'</div>'+
        (meta.length?'<div class="fm">'+meta.join('<br>')+'</div>':'')+
      '</div>';
  }).join('');
}

function renderDashMain(){
  var m=$('dMain');
  if (!dPick){
    m.innerHTML='<div class="dhead"><h1>Network at a glance</h1>'+
      '<p>Pick anything on the left to see the full path that feeds it.</p></div>';
    return;
  }

  var steps=[], title=dPick.title, sub='';
  if (dPick.kind==='CUSTOMER'){
    steps=traceTo('CUSTOMER', dPick.node.id, dPick.cust);
    sub='Path from the office to this customer';
  } else if (dPick.kind==='NODE'){
    steps=traceTo('NODE', dPick.node.id);
    sub='Path from the office to this '+typeName(dPick.node.type).toLowerCase();
  } else if (dPick.kind==='CABLE'){
    var c=dPick.cable, uses=strandUses(c.id);
    m.innerHTML='<div class="dhead"><h1>'+esc(c.id)+'</h1><p>'+esc(c.kind)+' \u00b7 '+
      c.cores+' cores \u00b7 '+fmtM(pathLen(c.path))+'</p></div>';
    var tb=document.createElement('table'); tb.className='tbl';
    var rows='';
    for (var i=1;i<=c.cores;i++){
      var stt=strandStatus(uses,i);
      rows+='<tr><td style="width:22px">'+swatch(i)+'</td><td>'+strandLabel(i,c.cores)+
        '</td><td class="'+stt.cls+'">'+esc(stt.text)+'</td></tr>';
    }
    tb.innerHTML='<thead><tr><th></th><th>Strand</th><th>Used by</th></tr></thead><tbody>'+rows+'</tbody>';
    m.appendChild(tb);
    return;
  } else if (dPick.kind==='OLT'){
    var o=dPick.olt, ps=D.ports.filter(function(p){ return p.olt===o.id; });
    m.innerHTML='<div class="dhead"><h1>'+esc(o.name)+'</h1><p>'+
      esc(office(o.office)?office(o.office).name:'')+' \u00b7 '+ps.length+' ports</p></div>';
    ps.forEach(function(p){
      var d0=document.createElement('div');
      d0.className='ditem';
      d0.innerHTML='<span class="fdot" style="background:'+
        (p.cable?strandHex(p.strand):'#DADCE0')+'"></span>'+
        '<span class="rowmain"><b>'+esc(p.name)+'</b><div class="sub">'+
        (p.cable? esc(p.cable)+' \u00b7 strand '+p.strand : 'not connected')+'</div></span>';
      m.appendChild(d0);
    });
    return;
  } else if (dPick.kind==='OFFICE'){
    var of=dPick.office;
    m.innerHTML='<div class="dhead"><h1>'+esc(of.name)+'</h1><p>'+
      D.olts.filter(function(x){ return x.office===of.id; }).length+' OLTs here</p></div>';
    return;
  }

  m.innerHTML='<div class="dhead"><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>'+
    '<div class="flow">'+flowHtml(steps)+'</div>';
}

/* ---------- mode switching ---------- */
function showMap(on){
  document.body.classList.toggle('mapmode', !!on);
  if (on && map) setTimeout(function(){ map.resize(); }, 40);
  if (!on) renderDash();
}
$('goMap').onclick=function(){ showMap(true); };
$('dq').oninput=function(){ dQuery=this.value; renderDash(); };

$('btnDash').onclick=function(){
  mode='dash'; view='home'; dashSel=null;
  draft=null; custDraft=null; legPick=null; pick=null;
  if (popup) popup.remove();
  document.body.classList.add('dash');
  draw(); render();
};

/* ---------- tabs ---------- */
function goTab(which){
  tab=which; view='home';
  draft=null; custDraft=null; legPick=null; pick=null;
  sel={ cable:null, node:null, olt:null, office:null, port:null };
  if (which!=='nearby'){ salesPoint=null; nbMsg=null; }
  if (popup) popup.remove();
  [['network','tabNet'],['cables','tabCab'],['nearby','tabNear']].forEach(function(p){
    $(p[1]).setAttribute('aria-pressed', String(tab===p[0]));
  });
  draw(); render();
}
$('tabNet').onclick =function(){ goTab('network'); };
$('tabCab').onclick =function(){ goTab('cables');  };
$('tabNear').onclick=function(){ goTab('nearby');  };

/* ---------- the legend opens only when asked ---------- */
function setLegend(open){
  $('legend').hidden=!open;
  $('legendBtn').setAttribute('aria-expanded', String(open));
}
setLegend(false);
$('legendBtn').onclick=function(e){
  e.stopPropagation();
  setLegend($('legend').hidden);
};
document.addEventListener('click', function(){ setLegend(false); });
$('legend').onclick=function(e){ e.stopPropagation(); };

})();
</script>
