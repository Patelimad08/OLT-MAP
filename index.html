<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCC Network Planner</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<script>
/* ==================================================================
   CONFIG
   ================================================================== */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyQ-uN2ocf1HxjNryJVtBY2wx5-SL3vbIfeOwHb54Wj4cZZ56Csv374grHRWmTODMRk/exec',
  STYLE: 'https://tiles.openfreemap.org/styles/liberty',
  CENTRE: [73.8567, 18.5204],
  ZOOM: 11,
  SEARCH_NEAR: { lat: 18.5204, lon: 73.8567 }
};
/* ================================================================== */
</script>

<style>
  :root{
    --olt:#1A73E8; --port:#00897B; --fibre:#43A047;
    --coupler:#F57C00; --fatbox:#7B1FA2; --loc:#5F6368;
    --ink:#202124; --grey:#5F6368; --line:#DADCE0;
    --bg:#fff; --hover:#F1F3F4; --soft:#E8F0FE; --red:#D93025; --green:#137333;
    --side:404px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input{ font-family:inherit; }

  #map{ position:fixed; top:0; bottom:0; right:0; left:var(--side); background:#E8EAED; }

  .gate{
    position:fixed; inset:0; z-index:2000; background:#fff;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate.off{ display:none; }
  .gate__card{ width:100%; max-width:340px; text-align:center; }
  .gate__logo{ height:52px; margin-bottom:22px; }
  .gate h1{ font-size:19px; font-weight:600; margin:0 0 6px; }
  .gate p{ font-size:13px; color:var(--grey); margin:0 0 22px; line-height:1.55; }
  .gate input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:9px;
    font-size:15px; outline:none; text-align:center;
  }
  .gate input:focus{ border-color:var(--olt); box-shadow:0 0 0 1px var(--olt); }
  .gate input.bad{ border-color:var(--red); }
  .gate .msg{ font-size:12.5px; margin-top:10px; min-height:18px; }
  .gate .msg.bad{ color:var(--red); }

  .side{
    position:fixed; top:0; bottom:0; left:0; width:var(--side);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    z-index:900; background:var(--bg);
  }
  .brandbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .brandbar img{ height:26px; }
  .brandbar b{ font-size:14px; font-weight:600; }

  .ctx{ padding:10px 16px; background:#FAFBFC; border-bottom:1px solid var(--line); }
  .ctx__row{ display:flex; align-items:center; gap:7px; font-size:12px; margin-bottom:4px; }
  .ctx__row:last-child{ margin-bottom:0; }
  .ctx__k{ color:var(--grey); min-width:62px; }
  .ctx__v{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx__v.none{ color:var(--grey); font-weight:400; font-style:italic; }

  .body{ flex:1; overflow-y:auto; padding:14px 16px 18px; }
  .foot{ padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; }

  .stepbar{
    display:flex; justify-content:space-between; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--olt); font-weight:600; margin-bottom:8px;
  }
  h2.title{ font-size:15px; font-weight:600; margin:0 0 5px; }
  .lead{ font-size:12.5px; color:var(--grey); line-height:1.55; margin:0 0 14px; }
  .sec{
    font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--grey);
    margin:18px 0 8px; font-weight:600; display:flex; justify-content:space-between;
  }

  .btn{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); font-size:13.5px; font-weight:500; cursor:pointer; color:var(--ink);
  }
  .btn:hover:not(:disabled){ background:var(--hover); }
  .btn.primary{ background:var(--olt); border-color:var(--olt); color:#fff; }
  .btn.primary:hover:not(:disabled){ background:#1557B0; }
  .btn.soft{ background:var(--soft); border-color:#BBD5F8; color:#1557B0; }
  .btn.soft:hover:not(:disabled){ background:#D6E4FC; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.wide{ width:100%; flex:none; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px;
    border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer;
  }
  .chip:hover{ background:var(--hover); }
  .chip.on{ border-color:var(--olt); background:var(--soft); color:#1557B0; font-weight:600; }
  .chip.add{ border-style:dashed; color:var(--grey); }
  .chip .x{
    border:0; background:transparent; color:var(--grey); cursor:pointer;
    font-size:14px; line-height:1; padding:0 1px;
  }
  .chip .x:hover{ color:var(--red); }

  .row{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; margin-bottom:7px; cursor:pointer;
  }
  .row:hover{ background:var(--hover); }
  .row.sel{
    border-color:var(--olt); border-width:2px; background:var(--soft);
    box-shadow:0 0 0 1px var(--olt);
  }
  .row.sel .row__main b{ color:#1557B0; font-weight:600; }
  .row .tick{ color:var(--olt); font-size:14px; font-weight:700; display:none; }
  .row.sel .tick{ display:block; }
  .row__main{ flex:1; min-width:0; }
  .row__main b{ display:block; font-size:13.5px; font-weight:500;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row__main span{ display:block; font-size:11.5px; color:var(--grey);
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .del{
    border:0; background:transparent; color:var(--grey); cursor:pointer;
    font-size:17px; line-height:1; padding:2px 5px; border-radius:5px;
  }
  .del:hover{ background:#FCE8E6; color:var(--red); }

  .warn{
    background:#FEF7E0; border:1px solid #F9D77E; border-radius:8px;
    padding:11px 12px; font-size:12px; line-height:1.55; margin-bottom:14px;
  }
  .warn b{ display:block; margin-bottom:3px; }

  /* tree */
  .tree{ font-size:13px; }
  .tnode{ border-radius:7px; }
  .trow{
    display:flex; align-items:center; gap:8px; padding:7px 8px;
    border-radius:7px; cursor:pointer;
  }
  .trow:hover{ background:var(--hover); }
  .trow.on{ background:var(--soft); }
  .tcar{
    width:16px; text-align:center; color:var(--grey); font-size:10px;
    transition:transform .15s; flex:0 0 16px;
  }
  .tcar.open{ transform:rotate(90deg); }
  .tlabel{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tlabel b{ font-weight:500; }
  .tmeta{ font-size:11px; color:var(--grey); white-space:nowrap; }
  .tact{ display:flex; gap:4px; opacity:.55; transition:opacity .12s; }
  .trow:hover .tact, .trow.on .tact{ opacity:1; }
  .tact button{
    border:1px solid var(--line); background:#fff; cursor:pointer;
    width:26px; height:26px; border-radius:6px; font-size:14px; line-height:1;
    color:var(--grey); display:grid; place-items:center;
  }
  .tact button:hover{ border-color:var(--olt); color:var(--olt); background:var(--soft); }
  .tact button.adds{ font-size:16px; color:var(--olt); border-color:#BBD5F8; }
  .tact button.adds:hover{ background:var(--soft); }
  .tact button.rm{ font-size:17px; }
  .tact button.rm:hover{ background:#FCE8E6; color:var(--red); border-color:#F5C2BD; }

  .findbar{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; margin-bottom:14px;
  }
  .findbar:focus-within{ border-color:var(--olt); box-shadow:0 0 0 1px var(--olt); }
  .findbar input{ flex:1; min-width:0; border:0; outline:0; font-size:13.5px; }

  #sync{
    position:fixed; z-index:1050; right:14px; top:14px; display:none;
    background:var(--ink); color:#fff; font-size:11.5px; padding:5px 10px; border-radius:14px;
  }
  .tkids{ margin-left:14px; border-left:1px solid var(--line); padding-left:6px; display:none; }
  .tkids.open{ display:block; }

  .namebox{
    border:1px solid var(--olt); border-radius:9px; padding:12px;
    background:var(--soft); margin-top:10px;
  }
  .namebox .field label{ color:#1557B0; }
  .namebox input{ background:#fff; }

  .empty{
    border:1px dashed var(--line); border-radius:9px; padding:18px 14px;
    text-align:center; font-size:12.5px; color:var(--grey); line-height:1.55;
  }

  .searchbox{
    display:flex; align-items:center; gap:9px; border:1px solid var(--line);
    border-radius:8px; padding:10px 12px;
  }
  .searchbox:focus-within{ border-color:var(--olt); box-shadow:0 0 0 1px var(--olt); }
  .searchbox input{ flex:1; min-width:0; border:0; outline:0; font-size:14px; }
  .spin{ width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--olt);
         border-radius:50%; animation:sp .7s linear infinite; display:none; }
  .spin.on{ display:block; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .hits{ border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; display:none; }
  .hits.on{ display:block; }
  .hit{ padding:10px 12px; border-bottom:1px solid #EEF0F2; cursor:pointer; }
  .hit:last-child{ border-bottom:0; }
  .hit:hover{ background:var(--hover); }
  .hit b{ display:block; font-size:13.5px; font-weight:500; }
  .hit span{ font-size:11.5px; color:var(--grey); }

  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:12.5px; color:var(--ink); font-weight:600; margin-bottom:5px;
  }
  .field label i{ color:var(--red); font-style:normal; }
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; outline:none;
  }
  .field input:focus{ border-color:var(--olt); box-shadow:0 0 0 1px var(--olt); }
  .field input.bad{ border-color:var(--red); }
  .two{ display:flex; gap:10px; } .two .field{ flex:1; }
  .msg{ font-size:12.5px; line-height:1.5; margin-top:10px; }
  .msg.bad{ color:var(--red); } .msg.good{ color:var(--green); }

  .fab{
    position:fixed; z-index:800; left:calc(var(--side) + 16px); bottom:20px;
    display:flex; align-items:center; gap:8px; padding:12px 18px;
    border-radius:26px; border:0; background:var(--olt); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,.28);
  }
  .fab:hover{ background:#1557B0; }
  .fab.off{ display:none; }

  .legend{
    position:fixed; z-index:800; right:12px; bottom:20px;
    background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:9px;
    padding:9px 11px; box-shadow:0 2px 8px rgba(0,0,0,.14);
  }
  .legend h5{
    margin:0 0 6px; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--grey); font-weight:600; display:flex; align-items:center; justify-content:space-between;
  }
  .legendx{
    display:none; border:0; background:transparent; color:var(--grey);
    font-size:18px; line-height:1; cursor:pointer; padding:0 0 0 10px;
  }
  .legendbtn{
    position:fixed; z-index:940; right:12px; top:12px;
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:rgba(255,255,255,.96); color:var(--grey);
    font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .legend div{ display:flex; align-items:center; gap:7px; font-size:11.5px; margin-bottom:4px; }
  .legend div:last-child{ margin-bottom:0; }

  .mk{ cursor:pointer; }
  .mk{ transition:opacity .18s; }
  .mk.dim{ opacity:.16; }
  .mk.dim:hover{ opacity:.7; }
  .mk.lit{ z-index:5; filter:drop-shadow(0 0 5px rgba(0,0,0,.4)); }

  .zoomhint{
    position:fixed; z-index:800; left:calc(var(--side) + 16px); top:12px;
    background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:8px;
    padding:7px 11px; font-size:12px; color:var(--grey);
    box-shadow:0 2px 8px rgba(0,0,0,.12); display:none;
  }
  .zoomhint.on{ display:block; }
  /* One marker per office. Its shape and colour show how far it is set up:
     circle/black = location only, square/grey = OLT added, diamond/blue = port added. */
  .mk-loc{
    width:14px; height:14px; border-radius:50%; background:#202124;
    border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  .mk-olt{
    width:16px; height:16px; border-radius:3px; background:#80868B;
    border:2.5px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.45);
  }
  .mk-port{
    width:15px; height:15px; background:var(--olt); transform:rotate(45deg);
    border:2.5px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.45);
  }
  .mk-fibre{
    width:13px; height:13px; border-radius:50%; background:var(--fibre);
    border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .mk-coupler{
    width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent;
    border-bottom:14px solid var(--coupler); filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
  }
  .mk-fatbox{
    width:15px; height:15px; background:var(--fatbox); border:2px solid #fff;
    clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .mk-drag{
    width:16px; height:16px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.5); cursor:grab;
  }
  .mk-drag:active{ cursor:grabbing; }
  .mk.pulse{ animation:pl 1.5s ease-out infinite; }
  @keyframes pl{ 0%{ box-shadow:0 0 0 0 rgba(26,115,232,.5); } 100%{ box-shadow:0 0 0 15px rgba(26,115,232,0); } }

  .maplibregl-popup-content{
    border-radius:10px; padding:15px 17px;
    max-height:66vh; overflow-y:auto;
  }
  .pop{ min-width:230px; max-width:300px; }
  .pop h4{ margin:0 0 4px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .pop .meta{ font-size:13px; color:var(--ink); line-height:1.75; margin:8px 0 0; }
  .pop .meta b{ color:var(--grey); font-weight:500; }
  .pop hr{ border:0; border-top:1px solid var(--line); margin:10px 0; }
  .pop .lbl{ font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
             color:var(--grey); font-weight:600; margin-bottom:7px; }
  .pop .types{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .pop .t{
    padding:9px 6px; border-radius:7px; border:1.5px solid var(--line); background:#fff;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }

  .draft{
    position:fixed; z-index:950; right:12px; top:12px; width:270px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.22); display:none;
  }
  .draft.on{ display:block; }
  .draft h4{ margin:0 0 4px; font-size:13.5px; font-weight:600; }
  .draft p{ margin:3px 0; font-size:12px; color:var(--grey); }
  .draft p b{ color:var(--ink); }
  .draft .acts{ display:flex; gap:7px; margin-top:12px; }

  .toast{
    position:fixed; z-index:1100; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:80vw;
  }
  .toast.on{ opacity:1; }

  @media (max-width:860px){
    /* One thing on screen at a time. The map is the background; the list,
       details and drafting each take the bottom of the screen in turn. */

    #map{ left:0; right:0; top:0; bottom:0; }

    .side{
      top:auto; bottom:0; left:0; right:0; width:auto;
      height:76vh; border-right:0; border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      box-shadow:0 -4px 22px rgba(0,0,0,.22);
      transform:translateY(calc(100% - 120px));
      transition:transform .26s cubic-bezier(.4,0,.2,1);
      z-index:960;
    }
    body.sheet-up .side{ transform:translateY(0); }

    /* While a popup or a draft is open the list drops fully out of the way. */
    body.overlay .side{ transform:translateY(100%); }

    .grip{
      display:block; padding:10px 0 6px; text-align:center; cursor:grab;
      touch-action:none; flex:0 0 auto;
    }
    .grip i{ display:inline-block; width:44px; height:4px; border-radius:2px; background:#C4C7CA; }
    .grip b{ display:block; font-size:11.5px; color:var(--grey); font-weight:500; margin-top:4px; }

    .brandbar{ padding:2px 16px 8px; }
    .brandbar img{ height:22px; }
    .brandbar b{ font-size:13px; }

    .ctx{ padding:8px 16px; }
    .ctx__row{ font-size:12px; }

    .body{ padding:12px 14px 20px; -webkit-overflow-scrolling:touch; }
    .foot{ padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }

    .btn{ padding:13px 10px; font-size:14px; }

    /* ---- tree: room for names, actions that do not crowd them out ---- */
    .tkids{ margin-left:8px; padding-left:6px; }
    .trow{ padding:11px 4px; gap:6px; flex-wrap:wrap; }
    .tcar{ flex:0 0 20px; font-size:11px; }
    .tlabel{ flex:1 1 auto; min-width:0; font-size:14px; }
    .tmeta{ font-size:11px; flex:0 0 auto; }
    .tact{
      opacity:1; flex:1 0 100%; justify-content:flex-end;
      gap:8px; margin-top:6px; padding-right:2px;
    }
    .tact button{ width:38px; height:34px; font-size:16px; }
    .tact button.rm{ font-size:20px; }

    /* ---- popups become a dismissible bottom sheet ---- */
    .maplibregl-popup{
      position:fixed !important;
      left:0 !important; right:0 !important; bottom:0 !important; top:auto !important;
      transform:none !important; max-width:none !important; width:auto !important;
      z-index:975;
    }
    .maplibregl-popup-tip{ display:none !important; }
    .maplibregl-popup-content{
      /* MapLibre sets max-width inline, so this has to win explicitly. */
      max-width:none !important;
      width:100%;
      max-height:46vh; overflow-y:auto;
      border-radius:16px 16px 0 0;
      padding:16px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 26px rgba(0,0,0,.3);
    }
    .maplibregl-popup-content > .pop{ width:100%; }
    .maplibregl-popup-close-button{
      font-size:30px; width:46px; height:46px; line-height:42px;
      color:var(--grey); top:4px; right:6px;
    }
    .pop{ min-width:0; max-width:none; }
    .pop h4{ font-size:16px; padding-right:40px; }
    .pop .meta{ font-size:13.5px; line-height:1.9; }
    .pop .types{ grid-template-columns:1fr 1fr 1fr; gap:7px; }
    .pop .t{ padding:14px 6px; font-size:13px; }
    .pop .chips{ gap:8px; }
    .chip{ padding:10px 14px; font-size:13.5px; }

    /* ---- drafting panel: compact, above the fold, never hides the pin ---- */
    .draft{
      left:0; right:0; bottom:0; top:auto; width:auto;
      border-radius:16px 16px 0 0;
      padding:14px 16px calc(16px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 26px rgba(0,0,0,.3);
      z-index:985; max-height:42vh; overflow-y:auto;
    }
    .draft h4{ font-size:14px; }
    .draft p{ font-size:12.5px; margin:2px 0; }
    .draft .acts{ margin-top:12px; }
    .draft .acts .btn{ padding:14px; font-size:15px; }

    /* ---- one floating button, and it hides whenever anything is open ---- */
    .fab{
      left:auto; right:12px; top:auto;
      bottom:calc(124px + 12px);
      padding:13px 18px; font-size:14px; z-index:950;
      transition:opacity .18s;
    }
    body.sheet-up .fab, body.overlay .fab{ opacity:0; pointer-events:none; }

    /* ---- legend collapses to an icon ---- */
    .legendbtn{ display:block; }
    body.sheet-up .legendbtn, body.overlay .legendbtn{ opacity:0; pointer-events:none; }
    .legend{
      right:12px; top:56px; bottom:auto; z-index:945;
      padding:10px 12px; font-size:12.5px;
      display:none !important;
    }
    .legend.show{ display:block !important; }
    .legend h5{ font-size:11px; }
    .legendx{ display:block; }
    .legend div{ font-size:12.5px; margin-bottom:6px; }

    .scrim{ padding:0; align-items:flex-end; z-index:1000; }
    .modal{
      max-width:none; border-radius:16px 16px 0 0; max-height:92vh;
      padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    }

    .namebox{ padding:14px; }
    .field input, .searchbox input, .findbar input{ font-size:16px; }
    .field label{ font-size:13px; }

    #sync{ top:auto; bottom:calc(124px + 64px); right:12px; }
    .toast{ bottom:calc(124px + 16px); }
  }

  @media (min-width:861px){
    .grip{ display:none; }
  }
</style>
</head>

<body>

<div class="gate" id="gate">
  <div class="gate__card">
    <img class="gate__logo" id="gateLogo" alt="SCC">
    <h1>Network Planner</h1>
    <div style="font-size:11px;color:#5F6368;margin-top:-2px">Build v15</div>
    <p>Enter the edit key to continue.</p>
    <input id="gateKey" type="password" placeholder="Edit key" autocomplete="current-password">
    <div class="msg" id="gateMsg"></div>
    <button class="btn primary wide" id="gateGo" style="margin-top:14px">Continue</button>
  </div>
</div>

<div id="map"></div>

<aside class="side">
  <div class="grip" id="grip"><i></i><b id="gripText">Pull up for the list</b></div>
  <div class="brandbar">
    <img id="brandLogo" alt="SCC">
    <b>Network Planner</b>
    <span style="margin-left:auto;font-size:10.5px;color:#5F6368">v15</span>
  </div>
  <div class="ctx" id="ctx"></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</aside>

<button class="fab off" id="fab">+ &nbsp;Add Location</button>

<div class="zoomhint" id="zoomhint">Zoom in to see OLTs, ports and runs</div>

<button class="legendbtn" id="legendBtn" title="Legend" style="display:none">?</button>

<div class="legend" id="legend" style="display:none">
  <h5>Legend <button class="legendx" id="legendX">&times;</button></h5>
  <div><span class="mk-loc" style="width:11px;height:11px"></span> Office only</div>
  <div><span class="mk-olt" style="width:11px;height:11px;border-width:2px"></span> OLT added</div>
  <div><span class="mk-port" style="width:11px;height:11px;border-width:2px"></span> Port added</div>
  <div><span class="mk-fibre" style="width:10px;height:10px"></span> Fibre</div>
  <div><span class="mk-coupler" style="border-left-width:6px;border-right-width:6px;border-bottom-width:11px"></span> Coupler</div>
  <div><span class="mk-fatbox" style="width:11px;height:11px"></span> FAT box</div>
</div>

<div class="draft" id="draft"></div>
<div id="sync">Saving…</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
(function(){
  'use strict';

  var LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALAAAABABAMAAABIC+B0AAAAHlBMVEX///+NLSYcFBNlLihmaGiZmZrOzs49QUEAAAAAAABVtKXnAAAACHRSTlMA/////////9XKVDIAAAP4SURBVHja7Vi7btRAFD2e3TU0bLwJCPGI1puGIgiQaHkEJDoQK6SUoBVCdPwQBUpBhwSLEKIAAX9AAhQIoo0NQtCwcRxEkJ3YFH7MXPveVRq6TLNrn5kzd2bOPTNjYK/872LRR3tQr3JfhCYhhNg+5zF9jwAArdkaoFYz5N6QQZqE1+/UeTeyn1nLqSJh3uPTDoOYxFdXxuM68cGsdWdUxdQBALCPM8gMoPTjnRWGFsoCgPPWqIakLgBc5ZDIJLZft9nljQA0faZP1wHQZKNxTeJti1u5LK4LbJ+OhLgO0CifLqUB17p3+BNa+MEgnReQkDdGxC3f45U+BK6xAYcAbopIScxXySote9Kqep6UdSWx54mp2bJYJAZaPqQuC2Lb53mVBey0pVXdSVgkMoiTRDCTCOjzg3GAvsMiLnTm3Xo3nSgkXj0uDwHf2gEC5cLjBV5M32VhinFqyNhPbk72cQnREc/M5H/Wa2qzzubB08itEZAj8e8a8v+NfhGWg+iPAyBaolVa/fzPoysvBeTJpZcCMWfjJ3P/vrFcvGp8oVVkRM9xMlOVQ/C+nzEH68SAjRJ0RtqAeeKUmfDex+zXN6VHytupAjn6uTZgefrX2gsAYFN9mltZT0JAt6ZqyXbANDGNjswWteZdR4ykvUCah9VlKLsMlyRi3r/87wASh+x+op0JEbORJzsABqZPUtiREE0Y86E4fSDwyK5slD4kxFi8LrfZwhtDe5tba+7JoiinwHXZhG8ZMkZ1hQJJLoDepT/u3+L2glZgT22BdTdAFUhjLEccn57mQm5qtSm7gtmTRKET5NlsebSb0pnb1mJNI1HG8STi+NtFem4tDkg6oz0h8WoeQlM6flW64ZpR8fa7QFj6xAlkUbCJ8Xx3Sz+Y4BQ8ccyKtVYCUYflVCzSd7/Wjca6+aDSvkxJ9IcC8S8alTU2BlSauRfM6c1uZ9Uck4EkzVWD2C9DnAMSc/AWekUvqXHTSDfNOSJIaERsV29IvB+O6CXDsNpR9cqSL14qndvqSWHeHyZbs6JbTPUUdkbo0AVwfWIoihh2TVFDdKWTJpbFk2ZBPBDH1ZBG4gBwXAkpiAMpB9JjklEvCfmm3zYAHPkpEPdOLGNl/1/GxccAPuxjEOuNEbEvzcTmEtBQ0lFSqUkWoYiMaenOA4i7rqCpSERyYknGanMIAG4oyfhtOOH7hxJlrKbmAQAP65t7/iZhkMggFmTcbWaeFS2E0tJ/3XAlGUMJMla9zeJk+mBtmrZ3C7FunwkpovRm0gQCNWdghdGF58pDerPrdeg3l8KZH1+mCIJTxmTTm1h+abDIpWKx9NWM51Ed2T5UQYC7e9/y9got/wDJ8jVoLrOBegAAAABJRU5ErkJggg==';

  var map, ready = false, editKey = '';
  var data = { locations:[], olts:[], ports:[], objects:[] };
  var sel = { loc:null, olt:null, port:null };
  var screen = 'home';
  var markers = [], popup = null, draft = null, dragMarker = null, idx = null;
  var chainOk = true, selObj = null;
  var focus = null;   // { kind:'site'|'object', id } — dims everything else
  var building = false;   // true while a popup is being constructed

  var TYPES = {
    FIBRE:   { label:'Fibre',   color:'#43A047', cls:'mk-fibre'   },
    COUPLER: { label:'Coupler', color:'#F57C00', cls:'mk-coupler' },
    FATBOX:  { label:'FAT box', color:'#7B1FA2', cls:'mk-fatbox'  }
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var tt;
  function toast(m){
    var t = $('toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  }

  /* ---------------- geometry ---------------- */

  function offset(lat, lng, metres, bearingDeg){
    var b = bearingDeg * Math.PI/180;
    return [ lng + (metres * Math.sin(b)) / (111320 * Math.cos(lat*Math.PI/180)),
             lat + (metres * Math.cos(b)) / 110574 ];
  }
  /* The office, every OLT inside it and every port on those OLTs are physically
     the same spot. Only objects sit elsewhere, at the end of real cable. */
  function sitePos(loc){ return [parseFloat(loc.lng), parseFloat(loc.lat)]; }
  function metres(a1,a2,b1,b2){
    var R=6371000, dLat=(b1-a1)*Math.PI/180, dLon=(b2-a2)*Math.PI/180;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(a1*Math.PI/180)*Math.cos(b1*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }
  function fmtM(d){ return d < 1000 ? Math.round(d)+' m' : (d/1000).toFixed(2)+' km'; }

  /* ---------------- selectors ---------------- */

  function oltsOf(loc){ return data.olts.filter(function(o){ return o.locationId === loc.id; }); }
  function portsOf(olt){ return data.ports.filter(function(p){ return p.oltId === olt.id; }); }
  function objsOf(port){ return data.objects.filter(function(o){ return o.portId === port.id; }); }

  /**
   * Positions for the whole tree, so anything can be drawn without needing
   * to be the current selection.
   */
  function buildIndex(){
    var ix = { olt:{}, port:{}, ownerOfPort:{}, ownerOfOlt:{} };

    data.locations.forEach(function(loc){
      var at = sitePos(loc);
      oltsOf(loc).forEach(function(o){
        ix.olt[o.id] = at;
        ix.ownerOfOlt[o.id] = loc;
        portsOf(o).forEach(function(p){
          ix.port[p.id] = at;
          ix.ownerOfPort[p.id] = { loc:loc, olt:o };
        });
      });
    });
    return ix;
  }

  function currentPortPos(){ return sel.loc ? sitePos(sel.loc) : null; }
  function endOf(id){
    var o = data.objects.filter(function(x){ return x.id === id; })[0];
    return o ? [parseFloat(o.lng), parseFloat(o.lat)] : null;
  }

  /* ---------------- place names ---------------- */

  var placeCache = {};

  /**
   * Nearest named place to a point, from OpenStreetMap. Not stored — looked up
   * when needed and remembered for the session, so no schema change is required.
   */
  function placeName(lat, lng, cb){
    var k = lat.toFixed(5) + ',' + lng.toFixed(5);
    if (placeCache[k] !== undefined){ cb(placeCache[k]); return; }

    fetch('https://photon.komoot.io/reverse?limit=1&lang=en&lat=' + lat + '&lon=' + lng)
      .then(function(r){ return r.json(); })
      .then(function(res){
        var f = (res.features || [])[0];
        var p = f ? (f.properties || {}) : {};
        var name = p.name || p.street || p.district || p.city || '';
        placeCache[k] = name;
        cb(name);
      })
      .catch(function(){ placeCache[k] = ''; cb(''); });
  }

  /* ---------------- backend ---------------- */

  function configured(){ return CONFIG.API_URL && CONFIG.API_URL.indexOf('PASTE_') !== 0; }

  function load(){
    if (!configured()) return Promise.resolve();
    return fetch(CONFIG.API_URL + '?action=data&cb=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) throw new Error(res.error);
        data.locations = res.locations || [];
        data.olts = res.olts || [];
        data.ports = res.ports || [];
        data.objects = res.objects || [];

        // If the backend still has the old objects sheet, chaining silently breaks.
        chainOk = !data.objects.length || ('parentId' in data.objects[0]);
        reselect(); render(); drawMap();
      });
  }

  function reselect(){
    if (sel.loc) sel.loc = data.locations.filter(function(l){ return l.id === sel.loc.id; })[0] || null;
    if (!sel.loc){ sel.olt = null; sel.port = null; return; }

    var olts = oltsOf(sel.loc);
    if (sel.olt) sel.olt = olts.filter(function(o){ return o.id === sel.olt.id; })[0] || null;
    if (!sel.olt) sel.olt = olts[0] || null;
    if (!sel.olt){ sel.port = null; return; }

    var ports = portsOf(sel.olt);
    if (sel.port) sel.port = ports.filter(function(p){ return p.id === sel.port.id; })[0] || null;
    if (!sel.port) sel.port = ports[0] || null;
  }

  var pending = 0;

  function busy(n){
    pending += n;
    var el = $('sync');
    if (el) el.style.display = pending > 0 ? '' : 'none';
  }

  function newId(prefix){
    return prefix + '-' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
  }

  /** Fires the save without blocking the interface. Reloads only if it fails. */
  function save(action, payload, undo){
    busy(1);
    post(action, payload)
      .then(function(){ busy(-1); })
      .catch(function(e){
        busy(-1);
        toast('Not saved: ' + e.message);
        if (undo) undo();
        load().catch(function(){});
      });
  }

  /** Removes a record and everything hanging off it, in memory. */
  function dropLocal(tab, id){
    if (tab === 'locations'){
      data.olts.filter(function(o){ return o.locationId === id; })
              .forEach(function(o){ dropLocal('olts', o.id); });
      data.locations = data.locations.filter(function(x){ return x.id !== id; });
    } else if (tab === 'olts'){
      data.ports.filter(function(p){ return p.oltId === id; })
               .forEach(function(p){ dropLocal('ports', p.id); });
      data.olts = data.olts.filter(function(x){ return x.id !== id; });
    } else if (tab === 'ports'){
      data.objects.filter(function(o){ return o.portId === id; })
                 .forEach(function(o){ dropLocal('objects', o.id); });
      data.ports = data.ports.filter(function(x){ return x.id !== id; });
    } else if (tab === 'objects'){
      data.objects.filter(function(o){ return o.parentId === id; })
                 .forEach(function(o){ dropLocal('objects', o.id); });
      data.objects = data.objects.filter(function(x){ return x.id !== id; });
    }
  }

  function removeNow(tab, id, label){
    dropLocal(tab, id);
    reselect(); render(); drawMap();
    save('remove', { tab:tab, id:id });
    if (label) toast(label + ' deleted');
  }

  function post(action, payload){
    if (!configured()) return Promise.reject(new Error('Backend URL not set'));
    return fetch(CONFIG.API_URL, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action:action, key:editKey }, payload))
    })
    .then(function(r){ return r.json(); })
    .then(function(res){ if (!res.ok) throw new Error(res.error || 'Save failed'); return res; });
  }

  /* ---------------- map ---------------- */

  function initMap(){
    map = new maplibregl.Map({
      container:'map', style:CONFIG.STYLE, center:CONFIG.CENTRE, zoom:CONFIG.ZOOM,
      maxZoom:21, dragRotate:false, attributionControl:{ compact:true }
    });
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-right');
    map.addControl(new maplibregl.ScaleControl({ unit:'metric' }), 'bottom-left');

    map.on('click', function(e){
      // A click on bare map, not a marker, drops the focus.
      if (e.originalEvent && e.originalEvent.target &&
          e.originalEvent.target.closest &&
          e.originalEvent.target.closest('.mk')) return;
      if (focus && !popup && !draft){ focus = null; drawMap(); }
    });

    map.on('load', function(){
      ready = true;
      map.addSource('runs', { type:'geojson', data:fc([]) });
      map.addLayer({ id:'run-lines', type:'line', source:'runs',
        layout:{ 'line-cap':'round', 'line-join':'round' },
        paint:{ 'line-color':['get','color'],
                'line-width':['coalesce',['get','w'],3.2],
                'line-opacity':['coalesce',['get','o'],1] } });

      map.addSource('spurs', { type:'geojson', data:fc([]) });
      map.addLayer({ id:'spur-lines', type:'line', source:'spurs',
        paint:{ 'line-color':'#9AA0A6', 'line-width':1.4, 'line-dasharray':[2,2],
                'line-opacity':['coalesce',['get','o'],0.6] } });

      map.addSource('drafting', { type:'geojson', data:fc([]) });
      map.addLayer({ id:'draft-line', type:'line', source:'drafting',
        paint:{ 'line-color':['get','color'], 'line-width':3, 'line-dasharray':[2,1.5] } });

      drawMap();

      var wasTree = map.getZoom() >= 14.5;
      map.on('zoomend', function(){
        var isTree = map.getZoom() >= 14.5;
        if (isTree !== wasTree){ wasTree = isTree; drawMap(); }
      });
    });
  }

  function fc(f){ return { type:'FeatureCollection', features:f }; }
  function clearMarkers(){ markers.forEach(function(m){ m.remove(); }); markers = []; }

  function addMarker(lngLat, cls, title, onClick, pulse){
    var el = document.createElement('div');
    el.className = 'mk ' + cls + (pulse ? ' pulse' : '');
    if (title) el.title = title;
    var m = new maplibregl.Marker({ element:el }).setLngLat(lngLat).addTo(map);
    if (onClick) el.addEventListener('click', function(e){ e.stopPropagation(); onClick(); });
    markers.push(m);
    return m;
  }

  function drawMap(){
    if (!ready) return;
    if (!idx) idx = buildIndex();
    clearMarkers();
    if (popup && !building){ popup.remove(); popup = null; }

    idx = buildIndex();
    var runs = [];
    var lit = !!focus;   // is anything focused right now

    data.locations.forEach(function(loc){
      var at = sitePos(loc);
      var locSel = sel.loc && sel.loc.id === loc.id;

      var olts = oltsOf(loc);
      var anyPort = olts.some(function(o){ return portsOf(o).length > 0; });

      var cls = olts.length === 0 ? 'mk-loc' : (anyPort ? 'mk-port' : 'mk-olt');
      var stage = olts.length === 0 ? 'office only'
                : (anyPort ? olts.length + ' OLT, ports added' : olts.length + ' OLT, no ports');

      // When something is focused, everything except it fades back.
      var siteFocused = lit && focus.kind === 'site' && focus.id === loc.id;
      var siteDim = lit ? !siteFocused : !locSel;

      addMarker(at, cls + (siteDim ? ' dim' : '') + (siteFocused ? ' lit' : ''),
                loc.name + ' \u2014 ' + stage,
                function(){ siteClick(loc, at); },
                siteFocused || (!lit && locSel));

      olts.forEach(function(o){
        portsOf(o).forEach(function(p){
          var live = locSel && sel.olt && sel.olt.id === o.id &&
                     sel.port && sel.port.id === p.id;

          objsOf(p).forEach(function(ob){
            var from = ob.parentId ? endOf(ob.parentId) : at;
            var to = [parseFloat(ob.lng), parseFloat(ob.lat)];
            if (!from || isNaN(to[0]) || isNaN(to[1])) return;

            var t = TYPES[ob.type] || TYPES.FIBRE;

            // A run belongs to the focused marker if it starts there.
            var fromFocus = lit && (
              (focus.kind === 'object' && ob.parentId === focus.id) ||
              (focus.kind === 'site'   && !ob.parentId && idx.ownerOfPort[ob.portId] &&
               idx.ownerOfPort[ob.portId].loc.id === focus.id)
            );

            var op, w;
            if (lit){ op = fromFocus ? 1 : 0.12; w = fromFocus ? 4.2 : 1.6; }
            else     { op = live ? 1 : 0.28;     w = live ? 3.4 : 2; }

            runs.push({ type:'Feature', properties:{ color:t.color, o:op, w:w },
                        geometry:{ type:'LineString', coordinates:[from, to] } });

            // Only the focused object itself lights up — never the far ends
            // of the runs leaving it.
            var objFocused = lit && focus.kind === 'object' && focus.id === ob.id;
            var objDim = lit ? !objFocused : !live;

            addMarker(to, t.cls + (objDim ? ' dim' : '') + (objFocused ? ' lit' : ''),
                      t.label, function(){ objectPopup(ob, to); }, objFocused);
          });
        });
      });
    });

    map.getSource('runs').setData(fc(runs));
    map.getSource('spurs').setData(fc([]));

    var showLegend = data.locations.length > 0;
    $('legend').style.display = showLegend ? '' : 'none';
    $('legendBtn').style.display = showLegend ? '' : 'none';
    $('zoomhint') && $('zoomhint').classList.remove('on');
  }

  /** Clicking the office marker: open it, or offer to draw if we are on the map step. */
  function siteClick(loc, at){
    if (screen === 'map'){
      if (sel.loc && sel.loc.id === loc.id && sel.port) sitePopup(loc, at, 'add');
      return;
    }
    if (!sel.loc || sel.loc.id !== loc.id){
      sel.loc = loc; reselect();
    }
    render(); drawMap();
    sitePopup(loc, at, 'view');
  }

  /* ---------------- popups ---------------- */

  function popAt(lngLat, node){
    if (popup) popup.remove();
    toMap();
    overlay(true);
    popup = new maplibregl.Popup({ offset:16, closeButton:true, maxWidth:'300px' })
      .setLngLat(lngLat).setDOMContent(node).addTo(map);

    popup.on('close', function(){
      if (!draft) overlay(false);
      if (focus && !draft){ focus = null; drawMap(); }
    });

    // On a phone the popup owns the lower half, so bring the marker into
    // the strip that is still visible above it.
    if (isMobile()) setTimeout(function(){
      var pt = map.project(lngLat);
      var h = map.getContainer().clientHeight;
      var want = h * 0.30;
      if (Math.abs(pt.y - want) > 40) map.panBy([0, pt.y - want], { duration:300 });
    }, 60);

    // MapLibre does not pan for you, so a tall popup near an edge gets clipped.
    if (isMobile()) return;

    requestAnimationFrame(function(){
      var el = popup.getElement();
      if (!el) return;
      var r = el.getBoundingClientRect();
      var m = map.getContainer().getBoundingClientRect();
      var pad = 14, dx = 0, dy = 0;

      if (r.top    < m.top    + pad) dy = r.top    - (m.top + pad);
      if (r.bottom > m.bottom - pad) dy = r.bottom - (m.bottom - pad);
      if (r.left   < m.left   + pad) dx = r.left   - (m.left + pad);
      if (r.right  > m.right  - pad) dx = r.right  - (m.right - pad);

      if (dx || dy) map.panBy([dx, dy], { duration:260 });
    });
  }

  /**
   * The office point holds the location, its OLTs and their ports.
   *   mode 'view' — inspect and switch between OLTs and ports
   *   mode 'add'  — details only, plus the three object types
   */
  function sitePopup(loc, at, mode){
    focus = { kind:'site', id:loc.id };
    building = true; drawMap(); building = false;
    var olts = oltsOf(loc);
    var box = document.createElement('div');
    box.className = 'pop';

    var head =
      '<h4><span class="mk-port" style="width:10px;height:10px;border-width:2px"></span>' +
      esc(loc.name) + '</h4>' +
      '<div class="meta">' +
        (loc.address ? '<b>Address:</b> ' + esc(loc.address) + '<br>' : '') +
        '<b>OLTs here:</b> ' + olts.length + '<br>' +
        '<b>Latitude:</b> ' + parseFloat(loc.lat).toFixed(6) + '<br>' +
        '<b>Longitude:</b> ' + parseFloat(loc.lng).toFixed(6) +
      '</div>';

    if (mode === 'add'){
      box.innerHTML = head +
        '<div class="meta" style="margin-top:6px"><b>Drawing from:</b> ' +
        esc(sel.olt ? sel.olt.name : '') + ' · ' + esc(sel.port ? sel.port.name : '') + '</div>' +
        '<hr><div class="lbl">Add object from this port</div><div class="types"></div>';

      typeButtons(box.querySelector('.types'), function(t){
        choosePlacement(t, at, '', at);
      });
      popAt(at, box);
      return;
    }

    // view mode
    box.innerHTML = head +
      '<hr><div class="lbl">OLT</div><div class="chips olts"></div>' +
      '<hr><div class="lbl">Port</div><div class="chips ports"></div>';

    var oWrap = box.querySelector('.olts');
    olts.forEach(function(o){
      var c = document.createElement('button');
      c.className = 'chip' + (sel.olt && sel.olt.id === o.id ? ' on' : '');
      c.textContent = o.name + ' (' + portsOf(o).length + ')';
      c.onclick = function(){
        sel.loc = loc; sel.olt = o; sel.port = portsOf(o)[0] || null;
        render(); drawMap(); sitePopup(loc, at, 'view');
      };
      oWrap.appendChild(c);
    });
    if (!olts.length) oWrap.innerHTML = '<span class="tmeta">No OLTs yet</span>';

    var pWrap = box.querySelector('.ports');
    if (sel.olt && sel.loc && sel.loc.id === loc.id){
      portsOf(sel.olt).forEach(function(p){
        var c = document.createElement('button');
        c.className = 'chip' + (sel.port && sel.port.id === p.id ? ' on' : '');
        c.textContent = p.name + ' (' + objsOf(p).length + ')';
        c.onclick = function(){ sel.port = p; render(); drawMap(); sitePopup(loc, at, 'view'); };
        pWrap.appendChild(c);
      });
    }
    if (!pWrap.children.length) pWrap.innerHTML = '<span class="tmeta">No ports yet</span>';

    popAt(at, box);
  }

  /** Point the whole app at one object: its location, OLT, port and the object step. */
  function focusObject(ob){
    var own = idx.ownerOfPort[ob.portId];
    if (own){ sel.loc = own.loc; sel.olt = own.olt; }
    sel.port = data.ports.filter(function(p){ return p.id === ob.portId; })[0] || sel.port;
    selObj = ob.id;
    revealInTree(ob);
    screen = 'map';
    render(); drawMap();
  }

  function revealInTree(ob){
    selObj = ob.id;
    var own = idx.ownerOfPort[ob.portId];
    if (own){
      expanded['L' + own.loc.id] = true;
      expanded['O' + own.olt.id] = true;
    }
    expanded['P' + ob.portId] = true;

    // open every ancestor so the highlighted row is actually on screen
    var guard = 0, cur = ob;
    while (cur && cur.parentId && guard++ < 50){
      expanded['B' + cur.parentId] = true;
      cur = data.objects.filter(function(x){ return x.id === cur.parentId; })[0];
    }
  }

  function objectPopup(ob, at){
    focus = { kind:'object', id:ob.id };
    building = true; drawMap(); building = false;
    var t = TYPES[ob.type] || TYPES.FIBRE;
    var own = idx.ownerOfPort[ob.portId] || { loc:sel.loc, olt:sel.olt };
    var port = data.ports.filter(function(p){ return p.id === ob.portId; })[0];

    // Work on whatever was clicked, even if it belongs to another port.
    if (port && (!sel.port || sel.port.id !== port.id)){
      sel.loc = own.loc; sel.olt = own.olt; sel.port = port;
      render(); drawMap();
    }

    var from = ob.parentId ? endOf(ob.parentId) : (own.loc ? sitePos(own.loc) : null);
    revealInTree(ob);
    render();
    var d = from ? metres(from[1], from[0], parseFloat(ob.lat), parseFloat(ob.lng)) : null;
    var parent = ob.parentId
      ? (data.objects.filter(function(x){ return x.id === ob.parentId; })[0] || null) : null;

    var box = document.createElement('div');
    box.className = 'pop';
    box.innerHTML =
      '<h4><span class="' + t.cls + '" style="width:10px;height:10px"></span>' + t.label + '</h4>' +
      '<div class="meta">' +
        '<b>Location:</b> ' + esc(own.loc ? own.loc.name : '') + '<br>' +
        '<b>OLT:</b> ' + esc(own.olt ? own.olt.name : '') + '<br>' +
        '<b>Port:</b> ' + esc(port ? port.name : '') + '<br>' +
        '<b>Runs from:</b> ' + (parent ? esc((TYPES[parent.type]||{}).label || parent.type) : esc(port ? port.name : '')) + '<br>' +
        (d !== null ? '<b>Length:</b> ' + fmtM(d) + '<br>' : '') +
        '<b>Latitude:</b> ' + parseFloat(ob.lat).toFixed(6) + '<br>' +
        '<b>Longitude:</b> ' + parseFloat(ob.lng).toFixed(6) + '<br>' +
        '<b>End location:</b> <span class="endname">looking up…</span>' +
      '</div>' +
      '<hr><div class="lbl">Continue the run from here</div><div class="types"></div>' +
      '<hr><div style="display:flex;gap:7px">' +
        '<button class="btn" id="obMove">Move this point</button>' +
        '<button class="btn" id="obDel" style="color:#D93025">Delete</button>' +
      '</div>';

    typeButtons(box.querySelector('.types'), function(type){
      focusObject(ob);
      choosePlacement(type, at, ob.id, at);
    });

    box.querySelector('#obMove').onclick = function(){
      focusObject(ob);
      relocate(ob);
    };

    box.querySelector('#obDel').onclick = function(){
      if (!confirm('Delete this ' + t.label + ' and anything chained after it?')) return;
      if (popup) popup.remove();
      removeNow('objects', ob.id, t.label);
    };
    var en = box.querySelector('.endname');
    placeName(parseFloat(ob.lat), parseFloat(ob.lng), function(n){
      if (en) en.textContent = n || '—';
    });

    popAt(at, box);
  }

  function typeButtons(wrap, onPick){
    Object.keys(TYPES).forEach(function(k){
      var b = document.createElement('button');
      b.className = 't';
      b.textContent = TYPES[k].label;
      b.style.borderColor = TYPES[k].color;
      b.style.color = TYPES[k].color;
      b.onmouseenter = function(){ b.style.background = TYPES[k].color; b.style.color = '#fff'; };
      b.onmouseleave = function(){ b.style.background = '#fff'; b.style.color = TYPES[k].color; };
      b.onclick = function(){ onPick(k); };
      wrap.appendChild(b);
    });
  }

  /** Type picker anchored on an existing object, for continuing its run. */
  function continueFrom(ob, at){
    if (popup) popup.remove();
    var t = TYPES[ob.type] || TYPES.FIBRE;

    var box = document.createElement('div');
    box.className = 'pop';
    box.innerHTML =
      '<h4><span class="' + t.cls + '" style="width:10px;height:10px"></span>' +
      'Continue from ' + t.label + '</h4>' +
      '<div class="meta"><b>Port:</b> ' + esc(sel.port ? sel.port.name : '') + '</div>' +
      '<hr><div class="lbl">What comes next?</div><div class="types"></div>';

    typeButtons(box.querySelector('.types'), function(type){
      choosePlacement(type, at, ob.id, at);
    });
    popAt(at, box);
  }

  /** Move an existing end point. Anything chained after it follows along. */
  function relocate(ob){
    var t = TYPES[ob.type] || TYPES.FIBRE;
    var own = idx.ownerOfPort[ob.portId] || {};
    var from = ob.parentId ? endOf(ob.parentId) : (own.loc ? sitePos(own.loc) : null);
    var cur = [parseFloat(ob.lng), parseFloat(ob.lat)];
    if (!from) return;

    var kids = data.objects.filter(function(x){ return x.parentId === ob.id; }).length;

    if (popup) popup.remove();
    var box = document.createElement('div');
    box.className = 'pop';
    box.innerHTML =
      '<h4><span class="' + t.cls + '" style="width:10px;height:10px"></span>Move ' + t.label + '</h4>' +
      '<div class="meta">' +
        '<b>Current:</b> ' + cur[1].toFixed(6) + ', ' + cur[0].toFixed(6) +
        (kids ? '<br><b>Chained after it:</b> ' + kids + ' — these move too' : '') +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:11px">' +
        '<button class="btn primary" id="mDrag">Drag on map</button>' +
        '<button class="btn soft" id="mType">Enter manually</button>' +
      '</div>' +
      '<div id="mForm" style="display:none;margin-top:12px">' +
        '<div class="field"><label>Latitude <i>*</i></label>' +
        '<input id="mLat" value="' + cur[1].toFixed(6) + '" inputmode="decimal"></div>' +
        '<div class="field"><label>Longitude <i>*</i></label>' +
        '<input id="mLng" value="' + cur[0].toFixed(6) + '" inputmode="decimal"></div>' +
        '<div class="msg" id="mMsg"></div>' +
        '<button class="btn primary" style="width:100%" id="mGo">Move here</button>' +
      '</div>';

    popAt(cur, box);

    box.querySelector('#mDrag').onclick = function(){
      if (popup) popup.remove();
      startDraft(ob.type, from, ob.parentId || '', cur, ob.id);
    };
    box.querySelector('#mType').onclick = function(){
      box.querySelector('#mForm').style.display = 'block';
      box.querySelector('#mLat').focus();
    };
    box.querySelector('#mGo').onclick = function(){
      var la = box.querySelector('#mLat'), ln = box.querySelector('#mLng');
      var msg = box.querySelector('#mMsg');
      la.classList.remove('bad'); ln.classList.remove('bad');
      msg.className = 'msg'; msg.textContent = '';

      var lat = parseFloat(la.value.trim()), lng = parseFloat(ln.value.trim());
      if (isNaN(lat) || lat < -90 || lat > 90){
        la.classList.add('bad'); msg.className='msg bad';
        msg.textContent='Latitude must be between -90 and 90.'; return;
      }
      if (isNaN(lng) || lng < -180 || lng > 180){
        ln.classList.add('bad'); msg.className='msg bad';
        msg.textContent='Longitude must be between -180 and 180.'; return;
      }
      if (popup) popup.remove();
      startDraft(ob.type, from, ob.parentId || '', [lng, lat], ob.id);
      map.easeTo({ center:[lng, lat], zoom:Math.max(map.getZoom(), 17), duration:500 });
    };
  }

  /* ---------------- placing an object ---------------- */

  /** After a type is chosen: drag it on the map, or type the coordinates. */
  function choosePlacement(type, fromLngLat, parentId, at){
    if (popup) popup.remove();

    var box = document.createElement('div');
    box.className = 'pop';
    box.innerHTML =
      '<h4><span class="' + TYPES[type].cls + '" style="width:10px;height:10px"></span>' +
      TYPES[type].label + '</h4>' +
      '<div class="meta">How do you want to place the end point?</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px">' +
        '<button class="btn primary" id="pDrag">Drag on map</button>' +
        '<button class="btn soft" id="pType">Enter manually</button>' +
      '</div>' +
      '<div id="pForm" style="display:none;margin-top:12px">' +
        '<div class="field"><label>Latitude <i>*</i></label>' +
        '<input id="pLat" placeholder="18.508567" inputmode="decimal"></div>' +
        '<div class="field"><label>Longitude <i>*</i></label>' +
        '<input id="pLng" placeholder="73.865275" inputmode="decimal"></div>' +
        '<div class="msg" id="pMsg"></div>' +
        '<button class="btn primary" style="width:100%" id="pGo">Place here</button>' +
      '</div>';

    popAt(at, box);

    box.querySelector('#pDrag').onclick = function(){
      if (popup) popup.remove();
      startDraft(type, fromLngLat, parentId);
    };

    box.querySelector('#pType').onclick = function(){
      box.querySelector('#pForm').style.display = 'block';
      box.querySelector('#pDrag').classList.remove('primary');
      box.querySelector('#pType').classList.add('primary');
      box.querySelector('#pType').classList.remove('soft');
      box.querySelector('#pLat').focus();
    };

    box.querySelector('#pGo').onclick = function(){
      var la = box.querySelector('#pLat'), ln = box.querySelector('#pLng');
      var msg = box.querySelector('#pMsg');
      la.classList.remove('bad'); ln.classList.remove('bad');
      msg.className = 'msg'; msg.textContent = '';

      var lat = parseFloat(la.value.trim()), lng = parseFloat(ln.value.trim());

      if (isNaN(lat) || lat < -90 || lat > 90){
        la.classList.add('bad'); la.focus();
        msg.className = 'msg bad'; msg.textContent = 'Latitude must be a number between -90 and 90.';
        return;
      }
      if (isNaN(lng) || lng < -180 || lng > 180){
        ln.classList.add('bad'); ln.focus();
        msg.className = 'msg bad'; msg.textContent = 'Longitude must be a number between -180 and 180.';
        return;
      }

      if (popup) popup.remove();
      startDraft(type, fromLngLat, parentId, [lng, lat]);
      map.easeTo({ center:[lng, lat], zoom:Math.max(map.getZoom(), 17), duration:600 });
    };
  }

  /* ---------------- drawing ---------------- */

  function startDraft(type, fromLngLat, parentId, toLngLat, moveId){
    clearDraft();
    draft = { type:type, from:fromLngLat,
              to: toLngLat || offset(fromLngLat[1], fromLngLat[0], 60, 45),
              parentId: parentId || '', moveId: moveId || '' };

    var el = document.createElement('div');
    el.className = 'mk-drag';
    el.style.background = TYPES[type].color;

    dragMarker = new maplibregl.Marker({ element:el, draggable:true })
      .setLngLat(draft.to).addTo(map);
    dragMarker.on('drag', function(){
      var p = dragMarker.getLngLat(); draft.to = [p.lng, p.lat]; paintDraft(); draftPanel();
    });
    dragMarker.on('dragend', function(){ paintDraft(); draftPanel(); liftPin(); });

    if (!toLngLat && map.getZoom() < 16){
      map.easeTo({ center:fromLngLat, zoom:17, duration:500 });
    }
    paintDraft(); draftPanel();
    toast(toLngLat ? 'Placed — drag the handle to adjust, then Confirm'
                   : 'Drag the handle to place the ' + TYPES[type].label);
  }

  /** Nudge the view so the drag handle sits in the visible strip above the panel. */
  function liftPin(){
    if (!draft || !isMobile()) return;
    var pt = map.project(draft.to);
    var h = map.getContainer().clientHeight;
    var lowest = h * 0.42;              // panel covers roughly the lower half
    if (pt.y > lowest) map.panBy([0, pt.y - lowest + 20], { duration:280 });
  }

  function paintDraft(){
    if (!ready) return;
    map.getSource('drafting').setData(draft ? fc([{
      type:'Feature', properties:{ color:TYPES[draft.type].color },
      geometry:{ type:'LineString', coordinates:[draft.from, draft.to] }
    }]) : fc([]));
  }

  function draftPanel(){
    var p = $('draft');
    if (!draft){ p.classList.remove('on'); return; }

    var d = metres(draft.from[1], draft.from[0], draft.to[1], draft.to[0]);
    var parent = draft.parentId
      ? (data.objects.filter(function(x){ return x.id === draft.parentId; })[0] || null) : null;

    p.classList.add('on');
    var moving = !!draft.moveId;
    var chained = moving
      ? data.objects.filter(function(x){ return x.parentId === draft.moveId; }).length : 0;

    var brief = isMobile();

    p.innerHTML =
      '<h4 style="color:' + TYPES[draft.type].color + '">' +
        (moving ? 'Moving ' : 'Placing ') + TYPES[draft.type].label + '</h4>' +
      '<p>' + esc(sel.olt.name) + ' · ' + esc(sel.port.name) +
        ' &middot; from <b>' +
        (parent ? esc((TYPES[parent.type]||{}).label) : esc(sel.port.name)) + '</b></p>' +
      (brief ? '' : '<p>Location: <b>' + esc(sel.loc.name) + '</b></p>') +
      '<p>Length: <b>' + fmtM(d) + '</b>' +
        (brief ? ' &middot; ' + draft.to[1].toFixed(5) + ', ' + draft.to[0].toFixed(5) : '') + '</p>' +
      (brief ? '' :
        '<p>Latitude: <b>' + draft.to[1].toFixed(6) + '</b></p>' +
        '<p>Longitude: <b>' + draft.to[0].toFixed(6) + '</b></p>') +
      '<p>End location: <b class="endname">looking up…</b></p>' +
      (chained ? '<p style="color:#B06000">' + chained +
                 ' object' + (chained===1?'':'s') + ' chained after this will follow.</p>' : '') +
      '<div class="acts"><button class="btn" id="dx">Cancel</button>' +
      '<button class="btn primary" id="dok">' + (moving ? 'Confirm move' : 'Confirm') + '</button></div>';

    var en = p.querySelector('.endname');
    if (en) placeName(draft.to[1], draft.to[0], function(n){
      if (draft && p.querySelector('.endname')) p.querySelector('.endname').textContent = n || '—';
    });

    $('dx').onclick = clearDraft;
    $('dok').onclick = function(){
      if (draft.moveId){
        var id = draft.moveId, lat = draft.to[1], lng = draft.to[0];
        var row = data.objects.filter(function(x){ return x.id === id; })[0];
        if (!row){ clearDraft(); return; }

        var ask = 'Move this ' + TYPES[draft.type].label + ' to ' +
                  lat.toFixed(6) + ', ' + lng.toFixed(6) + '?' +
                  (chained ? '\n\n' + chained + ' chained object' + (chained===1?'':'s') +
                             ' will move with it.' : '');
        if (!confirm(ask)) return;

        var old = { lat: row.lat, lng: row.lng };
        row.lat = String(lat); row.lng = String(lng);
        clearDraft(); overlay(false); render(); drawMap();

        save('move', { id:id, lat:lat, lng:lng }, function(){
          row.lat = old.lat; row.lng = old.lng;
        });
        toast('Moved');
        return;
      }

      var rec = {
        id: newId('obj'), portId: sel.port.id, parentId: draft.parentId,
        type: draft.type, label: TYPES[draft.type].label,
        lat: String(draft.to[1]), lng: String(draft.to[0]),
        fromLat: String(draft.from[1]), fromLng: String(draft.from[0]), created:''
      };
      data.objects.push(rec);
      clearDraft(); render(); drawMap();
      save('addObject', { row:rec }, function(){
        data.objects = data.objects.filter(function(x){ return x.id !== rec.id; });
      });
    };
  }

  function clearDraft(){
    draft = null;
    focus = null;
    if (dragMarker){ dragMarker.remove(); dragMarker = null; }
    $('draft').classList.remove('on');
    overlay(false);
    paintDraft();
  }

  /* ---------------- screens ---------------- */

  function ctx(){
    var c = $('ctx');
    if (screen === 'search' || screen === 'manual'){
      c.innerHTML = '<div class="ctx__row"><span class="ctx__k">Step</span>' +
                    '<span class="ctx__v">Adding a new office location</span></div>';
      return;
    }
    c.innerHTML =
      '<div class="ctx__row"><span class="ctx__k">Location</span><span class="ctx__v' +
        (sel.loc?'':' none') + '">' + (sel.loc ? esc(sel.loc.name) : 'none selected') + '</span></div>' +
      '<div class="ctx__row"><span class="ctx__k">OLT</span><span class="ctx__v' +
        (sel.olt?'':' none') + '">' + (sel.olt ? esc(sel.olt.name) : 'none selected') + '</span></div>' +
      '<div class="ctx__row"><span class="ctx__k">Port</span><span class="ctx__v' +
        (sel.port?'':' none') + '">' + (sel.port ? esc(sel.port.name) : 'none selected') + '</span></div>';
  }

  function render(){
    ctx();
    var b = $('body'), f = $('foot');
    b.innerHTML = ''; f.innerHTML = '';
    $('fab').classList.toggle('off', screen !== 'home');

    if (!configured()){
      b.innerHTML = '<p class="lead">Backend not connected. Paste the planner web app URL into ' +
                    '<b>API_URL</b> at the top of this file.</p>';
      return;
    }
    if (screen === 'home')   return homeScreen(b);
    if (screen === 'search') return searchScreen(b, f);
    if (screen === 'manual') return manualScreen(b, f);
    if (screen === 'olt')    return oltScreen(b, f);
    if (screen === 'port')   return portScreen(b, f);
    if (screen === 'map')    return mapScreen(b, f);
  }

  var expanded = {};   // which tree nodes are open

  var findQ = '';

  function homeScreen(b){
    b.innerHTML =
      '<div class="findbar">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="#5F6368"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>' +
        '<input id="find" placeholder="Search a saved location" value="' + esc(findQ) + '">' +
      '</div>' +
      '<h2 class="title">Network map</h2>' +
      '<p class="lead">Use the arrow to expand a site. Tap a name to show it on the map. ' +
      'Pencil opens it for editing, \u00d7 deletes it.</p>';

    if (!chainOk){
      var w = document.createElement('div');
      w.className = 'warn';
      w.innerHTML = '<b>Backend is out of date</b>Objects are saving without their parent link, ' +
        'so chained runs all appear to start at the port. Delete the <b>objects</b> tab in the ' +
        'Sheet, paste the latest Code.gs, then redeploy as a <b>New version</b>.';
      b.appendChild(w);
    }

    if (!data.locations.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = 'Nothing added yet.<br>Use <b>Add Location</b> to start.';
      b.appendChild(e);
      return;
    }

    var q = findQ.trim().toLowerCase();
    var list = q
      ? data.locations.filter(function(l){
          return (l.name + ' ' + l.address).toLowerCase().indexOf(q) > -1;
        })
      : data.locations;

    if (!list.length && findQ.trim()){
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'No location matches that search.';
      b.appendChild(none);
    }

    var host = document.createElement('div');
    host.id = 'treehost';
    if (list.length){
      var tree = document.createElement('div');
      tree.className = 'tree';
      list.forEach(function(loc){ tree.appendChild(locNode(loc)); });
      host.appendChild(tree);
    }
    b.appendChild(host);

    var f = $('find');
    if (f){
      // Rebuild only the tree. Re-rendering the panel would destroy the input
      // mid-keystroke and dismiss the mobile keyboard.
      f.oninput = function(){
        findQ = f.value;
        var q2 = findQ.trim().toLowerCase();
        var host = $('treehost');
        if (!host) return;

        var hits = q2
          ? data.locations.filter(function(l){
              return (l.name + ' ' + (l.address||'')).toLowerCase().indexOf(q2) > -1;
            })
          : data.locations;

        host.innerHTML = '';
        if (!hits.length){
          var none = document.createElement('div');
          none.className = 'empty';
          none.textContent = 'No location matches “' + findQ.trim() + '”.';
          host.appendChild(none);
          return;
        }
        var t2 = document.createElement('div');
        t2.className = 'tree';
        hits.forEach(function(loc){ t2.appendChild(locNode(loc)); });
        host.appendChild(t2);
      };
    }
  }

  /** Pencil = open this level for editing, × = delete it. */
  function actions(onEdit, onDelete, editTitle){
    return '<span class="tact">' +
      (onEdit ? '<button class="ed" title="' + editTitle + '">\u270E</button>' : '') +
      (onDelete ? '<button class="rm" title="Delete">\u00d7</button>' : '') +
      '</span>';
  }

  function wireActions(wrap, onEdit, onDelete){
    var ed = wrap._row.querySelector('.ed');
    var rm = wrap._row.querySelector('.rm');
    if (ed) ed.onclick = function(e){ e.stopPropagation(); onEdit(); };
    if (rm) rm.onclick = function(e){ e.stopPropagation(); onDelete(); };
  }

  function node(cls, iconHtml, label, meta, onClick, hasKids, actionsHtml){
    var wrap = document.createElement('div');
    wrap.className = 'tnode';

    var row = document.createElement('div');
    row.className = 'trow' + (cls || '');
    row.innerHTML =
      '<span class="tcar">' + (hasKids ? '\u25B6' : '') + '</span>' +
      (iconHtml || '') +
      '<span class="tlabel">' + label + '</span>' +
      '<span class="tmeta">' + (meta || '') + '</span>' +
      (actionsHtml || '');

    var car = row.querySelector('.tcar');

      car.style.cursor = 'pointer';

        e.stopPropagation();                 // never also select

        var isOpen = kids.classList.toggle('open');
        car.classList.toggle('open', isOpen);
      };
    }
    row.onclick = function(){ if (onClick) onClick(); };

    wrap.appendChild(row);
    wrap.appendChild(kids);
    wrap._row = row; wrap._kids = kids;
    return wrap;
  }

  function objNode(ob, fromXY, fromName){
    var t = TYPES[ob.type] || TYPES.FIBRE;
    var isSel = selObj === ob.id;
    var to = [parseFloat(ob.lng), parseFloat(ob.lat)];
    var d = fromXY ? metres(fromXY[1], fromXY[0], to[1], to[0]) : null;
    var kids = data.objects.filter(function(x){ return x.parentId === ob.id; });

    var w = node(isSel ? ' on' : '',
      '<span class="' + t.cls + '" style="width:10px;height:10px;flex:0 0 10px"></span>',
      (isSel ? '<b>' + t.label + '</b>' : t.label),
      (d !== null ? fmtM(d) : '') +
        (kids.length ? ' · ' + kids.length + ' onward' : ''),
      function(){
        toMap();
        map.easeTo({ center:to, zoom:Math.max(map.getZoom(), 18), duration:500 });
        map.once('moveend', function(){ objectPopup(ob, to); });
      },
      kids.length > 0,
      '<span class="tact">' +
        '<button class="adds" title="Add an object continuing from here">+</button>' +
        '<button class="ed" title="Move this end point">\u270E</button>' +
        '<button class="rm" title="Delete">\u00d7</button>' +
      '</span>');

    var addBtn = w._row.querySelector('.adds');
    if (addBtn) addBtn.onclick = function(e){
      e.stopPropagation();
      focusObject(ob);
      map.easeTo({ center:to, zoom:Math.max(map.getZoom(), 17), duration:450 });
      map.once('moveend', function(){ continueFrom(ob, to); });
    };

    var edBtn = w._row.querySelector('.ed');
    if (edBtn) edBtn.onclick = function(e){
      e.stopPropagation();
      focusObject(ob);
      map.easeTo({ center:to, zoom:Math.max(map.getZoom(), 17), duration:400 });
      map.once('moveend', function(){ relocate(ob); });
    };

    var rmBtn = w._row.querySelector('.rm');
    if (rmBtn) rmBtn.onclick = function(e){
      e.stopPropagation();
      if (!confirm('Delete this ' + t.label + ' and anything chained after it?')) return;
      removeNow('objects', ob.id, t.label);
    };

    setOpen(w, 'B'+ob.id, !!expanded['B'+ob.id]);
    kids.forEach(function(k){ w._kids.appendChild(objNode(k, to, t.label)); });
    return w;
  }

  /**
   * Inline "name it" form. Names are chosen, never counted, so deleting
   * OLT 1 can never leave two things called OLT 2.
   */
  function namePrompt(container, label, siblings, onSave){
    var existing = siblings.map(function(x){ return String(x.name).trim().toLowerCase(); });

    // suggest the lowest number not already taken
    var n = 1;
    while (existing.indexOf((label + ' ' + n).toLowerCase()) > -1) n++;

    var box = document.createElement('div');
    box.className = 'namebox';
    box.innerHTML =
      '<div class="field" style="margin-bottom:8px"><label>' + label + ' name <i>*</i></label>' +
      '<input id="nmVal" value="' + esc(label + ' ' + n) + '" autocomplete="off"></div>' +
      '<div class="msg" id="nmMsg"></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn" id="nmX">Cancel</button>' +
        '<button class="btn primary" id="nmOk">Add ' + label + '</button>' +
      '</div>';
    container.appendChild(box);

    var input = box.querySelector('#nmVal');
    input.focus(); input.select();

    function fail(m){
      input.classList.add('bad'); input.focus();
      var msg = box.querySelector('#nmMsg');
      msg.className = 'msg bad'; msg.textContent = m;
    }

    function commit(){
      var v = input.value.trim();
      input.classList.remove('bad');
      box.querySelector('#nmMsg').textContent = '';

      if (!v) return fail('Give it a name.');
      if (existing.indexOf(v.toLowerCase()) > -1) return fail('This name already exists.');
      onSave(v);
    }

    box.querySelector('#nmOk').onclick = commit;
    box.querySelector('#nmX').onclick = function(){ render(); };
    input.onkeydown = function(e){
      input.classList.remove('bad');
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') render();
    };
  }

  function doSearch(q){
    if (q.length < 3){ $('hits').classList.remove('on'); return; }
    lastQ = q;
    if ($('spin')) $('spin').classList.add('on');

    var near = CONFIG.SEARCH_NEAR;

    function show(feats){
      if (q !== lastQ) return;
      if ($('spin')) $('spin').classList.remove('on');
      var box = $('hits');
      if (!box) return;
      box.classList.add('on');

      if (!feats.length){
        box.innerHTML = '<div class="hit"><b>No match found</b><span>Try fewer words, or use ' +
                        '<b>Add Location Manually</b> with the Google link.</span></div>';
        return;
      }

      box.innerHTML = feats.map(function(f, i){
        return '<div class="hit" data-i="' + i + '"><b>' + esc(f.name) + '</b>' +
               '<span>' + esc(f.sub) + '</span></div>';
      }).join('');

      Array.prototype.forEach.call(box.querySelectorAll('.hit'), function(el){
        el.onclick = function(){
          var f = feats[+el.dataset.i];
          if (!f) return;
          saveLocation({ name:f.name, address:f.sub, link:'', lat:f.lat, lng:f.lng },
                       function(m){ toast(m); });
        };
      });
    }

    function fail(){
      if (q !== lastQ) return;
      if ($('spin')) $('spin').classList.remove('on');
      var box = $('hits');
      if (!box) return;
      box.classList.add('on');
      box.innerHTML = '<div class="hit"><b>Search is unavailable right now</b>' +
        '<span>Use <b>Add Location Manually</b> and paste the Google link — that always works.</span></div>';
    }

    // Photon first; Nominatim as a fallback if it is unreachable or rate limited.
    fetch('https://photon.komoot.io/api/?limit=8&lang=en&q=' + encodeURIComponent(q) +
          '&lat=' + near.lat + '&lon=' + near.lon)
      .then(function(r){
        if (!r.ok) throw new Error('photon ' + r.status);
        return r.json();
      })
      .then(function(res){
        var feats = (res.features || []).filter(function(f){ return f.geometry; })
          .map(function(f){
            var p = f.properties || {};
            return {
              name: p.name || p.street || 'Unnamed',
              sub: [p.street, p.district, p.city, p.state].filter(Boolean).join(', '),
              lat: f.geometry.coordinates[1],
              lng: f.geometry.coordinates[0]
            };
          });
        if (!feats.length) throw new Error('empty');
        show(feats);
      })
      .catch(function(){
        fetch('https://nominatim.openstreetmap.org/search?format=json&limit=8&q=' +
              encodeURIComponent(q))
          .then(function(r){
            if (!r.ok) throw new Error('nominatim ' + r.status);
            return r.json();
          })
          .then(function(rows){
            show((rows || []).map(function(r){
              var parts = String(r.display_name || '').split(',');
              return {
                name: (parts.shift() || 'Unnamed').trim(),
                sub: parts.slice(0, 3).join(',').trim(),
                lat: parseFloat(r.lat),
                lng: parseFloat(r.lon)
              };
            }));
          })
          .catch(fail);
      });
  }

      if (!l.value.trim()){
        l.classList.add('bad'); l.focus();
        m.className='msg bad'; m.textContent='Google link is required.'; return;
      }

      save.disabled = true; save.textContent = 'Saving…';
      m.textContent = 'Reading the link…';

      saveLocation({
        name: a.value.trim(), address: a.value.trim(), link: l.value.trim(),
        lat: $('f_lat').value.trim(), lng: $('f_lng').value.trim()
      }, function(err){
        save.disabled = false; save.textContent = 'Save location';
        m.className = 'msg bad'; m.textContent = err;
      });
    };

    f.appendChild(back); f.appendChild(save);
  }

  function saveLocation(row, onErr){
    // Coordinates may need the backend to read the Google link, so this one waits.
    post('addLocation', { row: Object.assign({ id:newId('loc') }, row) })
      .then(function(res){
        data.locations.push(res.row);
        openLocation(res.row);
        toast('Location added — now add an OLT');
      })
      .catch(function(e){ onErr(e.message); });
  }

  /* ---------------- unlock ---------------- */

  function unlock(){
    var k = $('gateKey').value.trim();
    var msg = $('gateMsg'), btn = $('gateGo');

    if (!k){
      $('gateKey').classList.add('bad');
      msg.className = 'msg bad'; msg.textContent = 'Enter the key to continue.';
      return;
    }
    if (!configured()){
      msg.className = 'msg bad'; msg.textContent = 'Backend URL is not set in this file.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Checking…';
    msg.className = 'msg'; msg.textContent = '';
    editKey = k;

    // The backend checks the key before it looks at the table name, so an
    // "Unknown table" reply proves the key was accepted. Nothing is changed.
    post('remove', { tab:'__keycheck__', id:'0' })
      .then(pass)
      .catch(function(e){
        if (String(e.message).indexOf('Unknown table') > -1) return pass();
        btn.disabled = false; btn.textContent = 'Continue';
        $('gateKey').classList.add('bad');
        msg.className = 'msg bad';
        msg.textContent = String(e.message).indexOf('Wrong') > -1
          ? 'That key is not right.' : e.message;
      });
  }

  function pass(){
    try{ sessionStorage.setItem('np_key', editKey); }catch(e){}
    $('gate').classList.add('off');
    render();
    load().then(fitAll).catch(function(e){ toast('Cannot load: ' + e.message); });
  }

  /* ---------------- mobile sheet ---------------- */

  function isMobile(){ return window.matchMedia('(max-width:860px)').matches; }

  /** True whenever a popup or the drafting panel is showing. */
  function overlay(on){
    document.body.classList.toggle('overlay', !!on);
    if (on) document.body.classList.remove('sheet-up');
  }

  function sheet(up){
    document.body.classList.toggle('sheet-up', !!up);
    document.body.classList.remove('sheet-hidden');
    var t = $('gripText');
    if (t) t.textContent = up ? 'Pull down for the map' : 'Pull up for the list';
    if (map) setTimeout(function(){ map.resize(); }, 280);
  }

  function initSheet(){
    var g = $('grip');
    if (!g) return;

    g.onclick = function(){ sheet(!document.body.classList.contains('sheet-up')); };

    var y0 = null, up0 = false;
    g.addEventListener('touchstart', function(e){
      y0 = e.touches[0].clientY;
      up0 = document.body.classList.contains('sheet-up');
    }, { passive:true });

    g.addEventListener('touchend', function(e){
      if (y0 === null) return;
      var dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dy) > 28) sheet(dy < 0);   // swipe up opens, down closes
      y0 = null;
    });
  }

  /** On a phone, drop the sheet so the map is visible for map-driven steps. */
  function toMap(){ if (isMobile()) sheet(false); }

  /* ---------------- start ---------------- */

  $('gateLogo').src = LOGO;
  $('brandLogo').src = LOGO;

  initMap();
  initSheet();
  render();

  $('gateGo').onclick = unlock;
  $('gateKey').addEventListener('keydown', function(e){
    $('gateKey').classList.remove('bad');
    if (e.key === 'Enter') unlock();
  });
  $('gateKey').focus();

  $('fab').onclick = function(){ clearDraft(); screen = 'search'; render(); };

  $('legendBtn').onclick = function(){ $('legend').classList.toggle('show'); };
  $('legendX').onclick = function(){ $('legend').classList.remove('show'); };

  window.addEventListener('resize', function(){ if (map) map.resize(); });

})();
</script>
</body>
</html>
