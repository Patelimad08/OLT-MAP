<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCC Network Map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --nav:236px;
    --side:430px;
    --line:#DADCE0;
    --line2:#EDEFF1;
    --grey:#5F6368;
    --blue:#1A73E8;
    --ink:#202124;
    --ok:#1E7A46;
    --bad:#C5221F;

    --cable:#37474F;
    --joint:#263238;
    --coupler:#4527A0;
    --splitter:#00838F;
    --fatbox:#C2185B;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); overflow:hidden; }

  #map{ position:fixed; top:0; right:0; bottom:0; left:calc(var(--nav) + var(--side)); }

  /* ---- nav rail ---- */
  .nav{
    position:fixed; top:0; left:0; bottom:0; width:var(--nav); z-index:20;
    background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:10px 10px 12px;
  }
  .navtop{ display:flex; align-items:center; gap:9px; padding:6px 4px 14px; }
  .navburger{
    appearance:none; background:none; border:0; cursor:pointer;
    font-size:16px; color:var(--grey); padding:2px 4px; border-radius:6px;
  }
  .navburger:hover{ background:#F1F3F4; color:var(--ink); }
  .navbrand{ font:700 14px system-ui; letter-spacing:-.01em; white-space:nowrap; }

  .navitem{
    display:flex; align-items:center; gap:11px; width:100%;
    appearance:none; background:none; border:0; cursor:pointer; text-align:left;
    padding:10px 10px; border-radius:9px; margin-bottom:3px; color:var(--ink);
  }
  .navitem:hover{ background:#F1F3F4; }
  .navitem.on{ background:#E8F0FE; }
  .navitem.on .nl b{ color:var(--blue); }
  .navitem .ni{ flex:0 0 22px; text-align:center; font-size:15px; color:var(--grey); }
  .navitem.on .ni{ color:var(--blue); }
  .navitem .nl{ min-width:0; }
  .navitem .nl b{ display:block; font-size:13px; font-weight:650; line-height:1.3; }
  .navitem .nl i{ display:block; font-style:normal; font-size:11px; color:var(--grey); }
  .navfoot{ margin-top:auto; }

  /* The menu is either full width, a narrow rail, or gone. Nothing in it may
     spill outside its own width, which is what made the labels bleed onto
     the panel and the map. */
  .nav{ overflow:hidden; white-space:nowrap; }

  body.navmini{ --nav:64px; }
  body.navmini .navitem{ padding:11px 0; text-align:center; }
  body.navmini .navitem .nl{ display:none; }
  body.navmini .navitem .ni{ margin:0 auto; }
  body.navmini .navbrand{ display:none; }
  body.navmini .navtop{ justify-content:center; padding:6px 0 14px; }

  /* on the map the menu is out of the way entirely */
  body.mapmode{ --nav:0px; }
  body.mapmode .nav{ display:none; }
  body.mapmode.navopen{ --nav:236px; }
  body.mapmode.navopen .nav{ display:flex; }

  .fabmenu{
    display:none; position:fixed; left:14px; bottom:16px; z-index:35;
    width:42px; height:42px; border-radius:50%; cursor:pointer;
    background:#fff; border:1px solid var(--line); color:var(--ink);
    font-size:16px; box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  body.mapmode .fabmenu{ display:block; }
  body.mapmode.navopen .fabmenu{ left:250px; }

  /* the left panel folds to a thin edge */
  body.sidehide{ --side:0px; }
  body.sidehide .side{ display:none; }
  .panelgrip{
    display:none; position:fixed; z-index:16; top:50%; transform:translateY(-50%);
    left:calc(var(--nav) + var(--side)); width:20px; height:52px;
    border:1px solid var(--line); border-left:0; border-radius:0 8px 8px 0;
    background:#fff; color:var(--grey); cursor:pointer; font-size:13px; padding:0;
    box-shadow:2px 0 8px rgba(0,0,0,.1);
  }
  body.mapmode .panelgrip{ display:block; }
  body.navmini .navbrand, body.navmini .navitem .nl{ display:none; }
  body.navmini .navitem{ justify-content:center; padding:11px 0; }

  /* ---------- dashboard ---------- */
  .dash{
    position:fixed; top:0; right:0; bottom:0; left:var(--nav); z-index:15;
    background:#FAFBFC; display:flex; flex-direction:column;
  }
  .dashscroll{ flex:1; overflow:auto; padding:22px 26px 44px; }

  .dstat{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
    gap:9px; margin-bottom:16px;
  }
  .dstat .card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 12px;
  }
  .dstat .card .t{
    font:700 9.5px system-ui; letter-spacing:.09em; text-transform:uppercase;
    color:var(--grey); margin-bottom:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .dstat .card .n{ font-size:19px; font-weight:700; letter-spacing:-.02em; line-height:1.2; }
  .dstat .card .x{ font-size:10.5px; color:var(--grey); margin-top:1px; }

  .dpanel{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .dfilter{
    display:flex; gap:9px; align-items:center; flex-wrap:wrap;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .dfilter select, .dfilter input{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font:13px system-ui; background:#fff; min-width:150px;
  }
  .dfilter .lnk{
    appearance:none; background:none; border:0; cursor:pointer;
    font:600 12.5px system-ui; color:var(--blue);
  }
  .dfilter .btn.sm{ margin-left:auto; }

  table.dtable{ width:100%; border-collapse:collapse; font-size:13px; }
  table.dtable th{
    text-align:left; font:700 10.5px system-ui; letter-spacing:.09em;
    text-transform:uppercase; color:var(--grey);
    padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.dtable td{ padding:11px 14px; border-bottom:1px solid var(--line2); }
  table.dtable tr:last-child td{ border-bottom:0; }
  table.dtable tr.clickable{ cursor:pointer; }
  table.dtable tr.clickable:hover td{ background:#F8F9FA; }
  .pill{
    display:inline-block; padding:2px 9px; border-radius:12px;
    font:600 11.5px ui-monospace,Menlo,monospace; background:#F1F3F4;
  }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; }
  .dot.ok{ background:#1E7A46; } .dot.warn{ background:#F9A825; }
  .dfoot{
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-top:1px solid var(--line); font-size:12px; color:var(--grey);
  }
  .dfoot .btn{ padding:6px 11px; font-size:12.5px; }
  .dfoot .gap{ flex:1; }

  /* ---- the customer path ---- */
  .pathwrap{ display:grid; grid-template-columns:1fr 290px; gap:18px; margin-top:20px; align-items:start; }
  .pathmain{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .pathmain h2{ font-size:19px; letter-spacing:-.015em; margin:10px 0 3px; }
  .pathmain .psub{ color:var(--grey); font-size:13px; margin:0 0 18px; }
  .pathmain .back{
    appearance:none; background:none; border:0; cursor:pointer; padding:0;
    font:600 12.5px system-ui; color:var(--blue);
  }
  .pathside{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .pathside .ph{
    display:flex; align-items:center; font:700 11px system-ui; letter-spacing:.09em;
    text-transform:uppercase; color:var(--grey); margin-bottom:14px;
  }
  .pathside .ph .lnk{
    margin-left:auto; appearance:none; background:none; border:0; cursor:pointer;
    font-size:17px; color:var(--grey); line-height:1;
  }
  .pkv{ margin-bottom:12px; }
  .pkv .k{ font-size:11px; color:var(--grey); margin-bottom:2px; }
  .pkv .v{ font-size:13.5px; font-weight:600; letter-spacing:-.01em; }

  @media (max-width:1000px){ .pathwrap{ grid-template-columns:1fr; } }

  .flow{ display:flex; flex-wrap:wrap; align-items:stretch; gap:0; }
  .fstep{
    position:relative; border:1px solid var(--line); border-radius:12px; background:#fff;
    padding:18px 14px 13px; min-width:126px; max-width:172px; margin-top:11px;
  }
  .fnum{
    position:absolute; top:-11px; left:14px; width:22px; height:22px; border-radius:50%;
    color:#fff; font:700 11.5px system-ui; display:flex; align-items:center;
    justify-content:center;
  }
  .fk{
    font:700 9.5px system-ui; letter-spacing:.11em; text-transform:uppercase;
    color:var(--grey); margin-bottom:4px;
  }
  .fn{ font-size:13.5px; font-weight:700; letter-spacing:-.01em; }
  .fm{ font-size:11.5px; color:var(--grey); margin-top:5px; line-height:1.5; }
  .farrow{
    display:flex; align-items:center; color:#BDC1C6; font-size:16px; padding:11px 6px 0;
  }
  body.mapmode .dash{ display:none; }
  body.dash .dash{ display:flex !important; }
  body:not(.mapmode) .side,
  body:not(.mapmode) #map,
  body:not(.mapmode) .banner,
  body:not(.mapmode) .legend,
  body:not(.mapmode) .legendbtn,
  body:not(.mapmode) .hintbar{ display:none !important; }

  .dashbar{
    display:flex; align-items:center; gap:10px;
    padding:13px 20px; background:#fff; border-bottom:1px solid var(--line);
  }
  .dashbar b{ font-size:16px; letter-spacing:-.01em; }
  .dashbar .dgap{ flex:1; }

  .dashwrap{ flex:1; display:flex; min-height:0; }
  .dashside{
    width:330px; flex:0 0 330px; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .dmain{ flex:1; overflow:auto; padding:24px 26px; min-width:0; }

  .dstat{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:12px;
    background:transparent;
    border-bottom:0;
    margin-bottom:22px;
  }
  .dstat .card{
    position:relative;
    min-width:0;
    min-height:92px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFF 100%);
    padding:15px 16px 14px;
    border:1px solid #C9DDF8;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(26,115,232,.08);
    overflow:hidden;
  }
  .dstat .card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:var(--blue);
  }
  .dstat .card .t{
    font:700 10px system-ui;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#5F6368;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dstat .card .n{
    font-size:30px;
    font-weight:750;
    line-height:1;
    letter-spacing:-.035em;
    color:#1769D1;
    margin-top:12px;
  }
  .dstat .card .x{ display:none; }
  @media (max-width:1100px){
    .dstat{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  }
  @media (max-width:650px){
    .dstat{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }

  .dfilter{ padding:12px 14px; border-bottom:1px solid var(--line); }
  .dfilter input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; font:14px system-ui;
  }
  .dfilter input:focus{ outline:2px solid #A8C7FA; border-color:var(--blue); }
  .dchips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }

  .dlist{ flex:1; overflow:auto; padding:8px 10px 20px; }
  .ditem{
    display:flex; align-items:center; gap:9px; padding:9px 10px;
    border-radius:8px; cursor:pointer; margin-bottom:2px;
  }
  .ditem:hover{ background:#F1F3F4; }
  .ditem.on{ background:#E8F0FE; }
  .ditem b{ font-size:13px; }
  .ditem .sub{ font-size:11.5px; color:var(--grey); }
  .dempty{ padding:20px 12px; color:var(--grey); font-size:13px; }

  /* the trace */
  .dhead h1{ font-size:24px; letter-spacing:-.02em; margin:0 0 4px; }
  .dhead p{ color:var(--grey); margin:0 0 22px; font-size:13.5px; }

  .flow{ display:flex; align-items:stretch; flex-wrap:wrap; gap:0; }
  .fstep{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; min-width:132px; max-width:200px;
  }
  .fstep .fk{
    font:700 9.5px system-ui; letter-spacing:.1em; text-transform:uppercase;
    color:var(--grey); margin-bottom:3px;
  }
  .fstep .fn{ font-size:14px; font-weight:700; letter-spacing:-.01em; }
  .fstep .fm{ font-size:11.5px; color:var(--grey); margin-top:4px; line-height:1.45; }
  .farrow{
    align-self:center; padding:0 9px; color:var(--line);
    font-size:17px; line-height:1;
  }
  .fdot{ width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:-1px; }

  @media (max-width:900px){
    .dashwrap{ flex-direction:column; }
    .dashside{ width:100%; flex:0 0 auto; max-height:44%; border-right:0; border-bottom:1px solid var(--line); }
    .flow{ flex-direction:column; }
    .farrow{ align-self:flex-start; padding:5px 0 5px 20px; transform:rotate(90deg); }
  }
  .side{
    position:fixed; top:0; left:var(--nav); bottom:0; width:var(--side); background:#fff;
    border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:10;
  }
  .brandbar{ display:flex; align-items:center; gap:9px; padding:12px 15px; border-bottom:1px solid var(--line); }
  .logo{ font:800 15px/1 system-ui; color:#C62828; font-style:italic; letter-spacing:-.04em; }
  .brandbar b{ font-size:15px; letter-spacing:-.01em; }
  .ver{ margin-left:auto; font-size:10.5px; color:var(--grey); }
  .brandbar .lnk{
    margin-left:auto; appearance:none; background:none; border:0; cursor:pointer;
    font:600 12.5px system-ui; color:var(--blue);
  }
  .brandbar .lnk:hover{ text-decoration:underline; }
  body.dash .brandbar .lnk{ visibility:hidden; }

  .tabs{ display:flex; border-bottom:1px solid var(--line); background:#fff; }
  .tabs button{
    flex:1; appearance:none; background:#fff; border:0; border-bottom:2px solid transparent;
    cursor:pointer; padding:11px 6px 9px; font:600 13px system-ui; color:var(--grey);
  }
  .tabs button:hover{ color:var(--ink); }
  .tabs button[aria-pressed="true"]{ color:var(--blue); border-bottom-color:var(--blue); }

  .ctx{ padding:9px 15px; background:#F8F9FA; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ctx__row{ display:flex; gap:10px; padding:1px 0; }
  .ctx__k{ color:var(--grey); width:88px; flex:0 0 88px; }
  .ctx__v{ font-weight:600; }
  .ctx__v.none{ font-weight:400; font-style:italic; color:var(--grey); }

  .body{ flex:1; overflow:auto; padding:15px; }
  .foot{ padding:11px 15px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .foot .btn{ flex:1; }

  h2.title{ font-size:17px; margin:0 0 3px; letter-spacing:-.01em; }
  .lead{ color:var(--grey); font-size:12.5px; margin:0 0 13px; }
  .lbl{ font:700 10.5px/1 system-ui; letter-spacing:.09em; text-transform:uppercase;
        color:var(--grey); margin:17px 0 8px; display:flex; align-items:center; gap:8px; }
  .lbl .r{ margin-left:auto; font-weight:600; letter-spacing:0; text-transform:none; font-size:11px; }

  .btn{ appearance:none; cursor:pointer; background:#fff; color:var(--ink);
        border:1px solid var(--line); border-radius:7px; padding:9px 12px; font:600 13px system-ui; }
  .btn:hover{ background:#F1F3F4; }
  .btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.soft{ background:#E8F0FE; border-color:#D2E3FC; color:#1967D2; }
  .btn.danger{ color:var(--bad); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.sm{ padding:5px 9px; font-size:12px; border-radius:6px; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ appearance:none; cursor:pointer; background:#fff; border:1px solid var(--line);
         border-radius:16px; padding:6px 11px; font:600 12px system-ui; color:var(--ink); }
  .chip.on{ border-color:var(--blue); color:var(--blue); background:#E8F0FE; }
  .chip:disabled{ opacity:.35; cursor:not-allowed; }

  .layers{ display:flex; margin-bottom:12px; }
  .layers button{ flex:1; appearance:none; cursor:pointer; background:#fff; border:1px solid var(--line);
                  border-right:0; padding:7px 5px; font:600 11.5px system-ui; color:var(--grey); }
  .layers button:first-child{ border-radius:7px 0 0 7px; }
  .layers button:last-child{ border-right:1px solid var(--line); border-radius:0 7px 7px 0; }
  .layers button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .row{ display:flex; align-items:center; gap:9px; padding:9px 10px; border:1px solid var(--line);
        border-radius:8px; margin-bottom:6px; background:#fff; cursor:pointer; }
  .row:hover{ border-color:var(--blue); }
  .row.on{ border-color:var(--blue); background:#F5F9FF; }
  .row.big{ padding:14px 13px; }
  .row.big b{ font-size:14px; }
  .row.big .meta{ font-size:17px; color:var(--line); }
  .row b{ font-size:13px; }
  .row .sub{ font-size:11.5px; color:var(--grey); }
  .row .meta{ margin-left:auto; font-size:11.5px; color:var(--grey); white-space:nowrap; }
  .rowmain{ min-width:0; flex:1; }
  .rowbtns{ display:flex; gap:4px; margin-left:auto; }
  .ic{ appearance:none; background:#fff; border:1px solid var(--line); border-radius:6px;
       width:26px; height:26px; cursor:pointer; font-size:12px; color:var(--grey); padding:0; }
  .ic:hover{ border-color:var(--blue); color:var(--blue); }
  .ic.del:hover{ border-color:var(--bad); color:var(--bad); }

  .field{ margin-bottom:11px; }
  .field label{ display:block; font-size:12px; color:var(--grey); margin-bottom:4px; font-weight:600; }
  .field label i{ color:var(--bad); font-style:normal; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:9px 10px;
    font:14px system-ui; color:var(--ink); background:#fff;
  }
  .field input:focus, .field select:focus{ outline:2px solid #A8C7FA; outline-offset:-1px; border-color:var(--blue); }
  .field input.bad{ border-color:var(--bad); }
  .two{ display:flex; gap:9px; }
  .two .field{ flex:1; }
  .msg{ font-size:12px; margin:-5px 0 10px; min-height:16px; color:var(--grey); }
  .msg.bad{ color:var(--bad); }
  .msg.good{ color:var(--ok); }

  .swatch{ width:11px; height:11px; border-radius:50%; flex:0 0 11px; border:1px solid rgba(0,0,0,.25); display:inline-block; vertical-align:middle; }
  .cabledash{ width:15px; height:0; border-top:3px solid var(--cable); flex:0 0 15px; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.tbl th{ text-align:left; font:700 10px system-ui; letter-spacing:.08em; text-transform:uppercase;
                color:var(--grey); border-bottom:1px solid var(--line); padding:6px 4px; }
  table.tbl td{ border-bottom:1px solid var(--line2); padding:6px 4px; }
  .free{ color:var(--ok); font-weight:600; }
  .dim{ color:var(--grey); }

  .note{ font-size:12px; color:var(--grey); background:#F8F9FA; border-left:2px solid var(--blue);
         padding:9px 11px; border-radius:0 6px 6px 0; margin-top:13px; }
  .note.warn{ border-left-color:#F9A825; background:#FEF7E0; color:#7A5B00; }

  .kv{ font-size:12.5px; margin-bottom:3px; }
  .kv b{ color:var(--grey); font-weight:600; }

  .stat{ display:flex; gap:9px; margin-bottom:9px; }
  .stat .box{ flex:1; border:1px solid var(--line); border-radius:9px; padding:10px 11px; }
  .stat .n{ font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .stat .t{ font-size:11px; color:var(--grey); }
  .cap{ height:7px; background:#EDEFF1; border-radius:7px; overflow:hidden; margin-top:5px; }
  .cap i{ display:block; height:100%; background:var(--blue); }

  /* strand picker for splices */
  .sgrid{ display:flex; gap:10px; }
  .scol{ flex:1; min-width:0; }
  .scol h5{ margin:0 0 7px; font:700 10.5px system-ui; letter-spacing:.08em;
            text-transform:uppercase; color:var(--grey); }
  .slist{ max-height:230px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:5px; }
  .sbtn{ display:flex; align-items:center; gap:6px; width:100%; appearance:none; background:#fff;
         border:1px solid transparent; border-radius:6px; padding:5px 7px; cursor:pointer;
         font:600 12px system-ui; color:var(--ink); text-align:left; margin-bottom:2px; }
  .sbtn:hover{ background:#F1F3F4; }
  .sbtn.on{ border-color:var(--blue); background:#E8F0FE; }
  .sbtn:disabled{ opacity:.35; cursor:not-allowed; }

   BACKEND — paste your Apps Script web app URL and edit key here.
   Leave API blank and the map still works, saving only in this browser.
   ========================================================================= */
var API = '';                          // e.g. https://script.google.com/macros/s/AKfy.../exec
var KEY = 'CHANGE-ME-BEFORE-DEPLOY';   // must match EDIT_KEY in Code.gs

/* Short goo.gl links can only be followed by a server. Point this at ANY
   deployed Apps Script with a resolve action — your existing V27 URL works,
   since it only reads the link and never touches that sheet. Blank = use API. */
var RESOLVE_API = '';

var CFG_KEY='scc_network_cfg_v1';
try{
  var savedCfg=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');
  if (savedCfg.api!==undefined) API=savedCfg.api;
  if (savedCfg.key) KEY=savedCfg.key;
  if (savedCfg.resolve!==undefined) RESOLVE_API=savedCfg.resolve;
}catch(e){}

var booted=false;      // true once the saved network has been loaded
var STORE_KEY='scc_network_map_v2';
var dirty=false, syncTimer=null, syncing=false, lastError='';
function online(){ return !!API; }

function markSaved(msg){
  var el=document.getElementById('saveState');
  if (!el) return;
  el.textContent=msg||'Saved in this browser';
  el.className='';
}
function markDirty(){
  dirty=true;
  var el=document.getElementById('saveState');
  if (el){ el.textContent='Saving\u2026'; el.className='dirty'; }
}

function persist(){
  /* Never write before the saved copy has been read, or the seed would
     overwrite the operator's real network. */
  if (!booted) return;
  /* the browser copy is written immediately, so a refresh never loses work */
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(D)); }catch(e){}

  if (!online()){ markSaved('Saved in this browser'); return; }

  markDirty();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushToServer, 900);   // one write per pause, not per click
}

function pushToServer(){
  if (!online() || syncing) { if (syncing) syncTimer=setTimeout(pushToServer,700); return; }
  syncing=true;
  var el=document.getElementById('saveState');
  if (el){ el.textContent='Saving to the sheet\u2026'; el.className='dirty'; }

  fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },  // avoids a CORS preflight
    body: JSON.stringify({ action:'saveAll', key:KEY, data:D })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    syncing=false;
    if (!res.ok) throw new Error(res.error||'The sheet refused the write.');
    dirty=false; lastError='';
    markSaved('Saved to the sheet');
  })
  .catch(function(err){
    syncing=false;
    lastError=String(err.message||err);
    var e2=document.getElementById('saveState');
    if (e2){
      e2.className='dirty';
      e2.textContent='Not saved to the sheet \u2014 ' + lastError;
      e2.title=lastError;
    }
  });
}

function pullFromServer(){
  if (!online()) return Promise.resolve(false);
  var el=document.getElementById('saveState');
  if (el){ el.textContent='Loading from the sheet\u2026'; el.className='dirty'; }

  return fetch(API + '?cb=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.ok) throw new Error((res && res.error) || 'No data came back.');
      D = fromServer(res);
      normalizePortFibreLinks();
      markSaved('Loaded from the sheet');
      return true;
    })
    .catch(function(err){
      lastError=String(err.message||err);
      var e2=document.getElementById('saveState');
      if (e2){ e2.className='dirty'; e2.textContent='Sheet unreachable \u2014 working offline'; }
      return false;
    });
}

/* Turn the sheet's flat rows back into the shape the map works with. */
function fromServer(res){
  var N={ offices:[], olts:[], ports:[], cables:[], nodes:[], splices:[] };

  (res.locations||[]).forEach(function(r){
    N.offices.push({ id:r.id, name:r.name, address:r.address, link:r.link,
                     at:[Number(r.lng), Number(r.lat)], created:r.created });
  });
  (res.olts||[]).forEach(function(r){
    N.olts.push({ id:r.id, office:r.locationId, name:r.name, created:r.created });
  });
  (res.ports||[]).forEach(function(r){
    N.ports.push({ id:r.id, olt:r.oltId, name:r.name,
                   cable:r.cableId||null, strand:null,
                   serves:null, created:r.created });
  });
  (res.cables||[]).forEach(function(r){
    N.cables.push({ id:r.id, cores:Number(r.cores), kind:r.kind, note:r.note,
                    path:(r.path||[]).map(function(p){ return [Number(p[0]),Number(p[1])]; }),
                    created:r.created });
  });
  (res.objects||[]).forEach(function(r){
    var n={ id:r.id, type:r.type, name:r.name, cable:r.cableId||null,
            at:[Number(r.lng), Number(r.lat)], note:r.note, created:r.created,
            inCable:r.inCable||null, inStrand:r.inStrand?Number(r.inStrand):null };
    if (r.ratio) n.ratio=r.ratio;
    if (r.type==='COUPLER'||r.type==='SPLITTER'){
      n.legs=(r.legs||[]).map(function(g){
        var to=null;
        if (g.toKind==='CABLE') to={ kind:'CABLE', cable:g.toCable, strand:Number(g.toStrand) };
        else if (g.toKind) to={ kind:g.toKind, node:g.toNode };
        return { id:g.legId, label:g.label, loss:Number(g.loss), to:to };
      });
      if (!n.legs.length) n.legs=makeLegs(n.type, n.ratio);
    }
    if (r.type==='FATBOX'){
      n.no=r.fatNo; n.ports=Number(r.fatPorts||8);
      n.customers=(r.customers||[]).map(function(c){
        return { port:Number(c.port), name:c.name,
                 at:(c.lat!==''&&c.lng!=='')?[Number(c.lng),Number(c.lat)]:null };
      });
    }
    N.nodes.push(n);
  });
  (res.splices||[]).forEach(function(r){
    N.splices.push({ id:r.id, joint:r.jointId,
                     aCable:r.aCable, aStrand:Number(r.aStrand),
                     bCable:r.bCable, bStrand:Number(r.bStrand), created:r.created });
  });
  return N;
}

/* Resolve a Google link through the backend, which can follow short links. */
function resolverUrl(){
  try{ return localStorage.getItem('scc_resolver') || RESOLVE_API || API || ''; }
  catch(e){ return RESOLVE_API || API || ''; }
}
function setResolver(url){
  try{ localStorage.setItem('scc_resolver', url||''); }catch(e){}
}
function askResolver(){
  var cur=resolverUrl();
  var v=prompt(
    'Paste your Apps Script web app URL (the one ending in /exec).\n\n' +
    'Your existing V27 URL works — it only reads the link, it never touches that sheet.\n' +
    'This makes short Google Maps links resolve to exact coordinates.',
    cur);
  if (v===null) return false;
  setResolver(String(v).trim());
  return true;
}

function resolveViaServer(url){
  if (!resolverUrl()) return Promise.resolve(null);
  return fetch(resolverUrl() + '?action=resolve&link=' + encodeURIComponent(url) + '&cb=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){ return res.ok ? [Number(res.lng), Number(res.lat)] : null; })
    .catch(function(){ return null; });
}
function normalizePortFibreLinks(){
  /* A port-to-fibre link is only the relationship between the port and the
     cable. It never reserves a particular strand. Clear legacy strand values
     so existing browser/sheet data follows the new rule immediately. */
  (D.ports||[]).forEach(function(p){ p.strand=null; });
}

function restore(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    var o=JSON.parse(raw);
    if (!o || !o.cables) return false;
    D=o;
    ['cables','nodes','splices','offices','olts','ports'].forEach(function(k){
      if (!D[k]) D[k]=[];
    });
    normalizePortFibreLinks();
    return true;
  }catch(e){ return false; }
}

/* ---- Excel: one sheet per table, flat so a human can read it ---- */
function toWorkbook(){
  var wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.offices.map(function(o){
      return { id:o.id, name:o.name, lat:o.at[1], lng:o.at[0] };
    })), 'offices');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.olts.map(function(o){ return { id:o.id, office_id:o.office, name:o.name }; })), 'olts');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.ports.map(function(p){
      return { id:p.id, olt_id:p.olt, name:p.name,
               cable_id:p.cable||'', strand:p.strand||'', serves:p.serves||'' };
    })), 'ports');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.cables.map(function(c){
      return { id:c.id, cores:c.cores, kind:c.kind, note:c.note||'',
               length_m:Math.round(pathLen(c.path)), points:c.path.length };
    })), 'cables');

  var pts=[];
  D.cables.forEach(function(c){
    c.path.forEach(function(p,i){
      pts.push({ cable_id:c.id, seq:i+1, lat:p[1], lng:p[0] });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pts), 'cable_points');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.nodes.map(function(n){
      return { id:n.id, type:n.type, name:n.name, on_cable:n.cable||'',
               lat:n.at[1], lng:n.at[0], ratio:n.ratio||'',
               fat_no:n.no||'', fat_ports:n.ports||'',
               fed_by_cable:n.inCable||'', fed_by_strand:n.inStrand||'', note:n.note||'' };
    })), 'objects');

  var legs=[];
  D.nodes.forEach(function(n){
    (n.legs||[]).forEach(function(g){
      legs.push({ node_id:n.id, node_name:n.name, leg:g.label,
                  loss_db:g.loss,
                  goes_to: g.to ? (g.to.kind==='CABLE'
                    ? g.to.cable+' strand '+g.to.strand : g.to.node) : '',
                  to_type: g.to ? g.to.kind : '' });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(legs), 'object_outputs');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    D.splices.map(function(x){
      return { id:x.id, joint:x.joint, cable_a:x.aCable, strand_a:x.aStrand,
               cable_b:x.bCable, strand_b:x.bStrand };
    })), 'splices');

  var cust=[];
  D.nodes.forEach(function(n){
    if (n.type!=='FATBOX') return;
    (n.customers||[]).forEach(function(c){
      cust.push({ fat_box:n.name, fat_no:n.no||'', port:c.port, customer:c.name,
                  lat:c.at?c.at[1]:'', lng:c.at?c.at[0]:'',
                  drop_m:c.at?Math.round(metres(n.at,c.at)):'' });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cust), 'customers');

  return wb;
}

function saveExcel(){
  try{
    var d=new Date();
    var stamp=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    XLSX.writeFile(toWorkbook(), 'scc-network-map-'+stamp+'.xlsx');
    markSaved('Downloaded');
    setTimeout(markSaved, 2500);
  }catch(e){ alert('Could not build the file: '+e.message); }
}

function rows(wb, name){
  var sh=wb.Sheets[name];
  return sh ? XLSX.utils.sheet_to_json(sh, { defval:'' }) : [];
}

function loadExcel(file){
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      var N={ offices:[], olts:[], ports:[], cables:[], nodes:[], splices:[] };

      rows(wb,'offices').forEach(function(r){
        N.offices.push({ id:String(r.id), name:String(r.name),
                         at:[Number(r.lng), Number(r.lat)] });
      });
      rows(wb,'olts').forEach(function(r){
        N.olts.push({ id:String(r.id), office:String(r.office_id), name:String(r.name) });
      });
      rows(wb,'ports').forEach(function(r){
        N.ports.push({ id:String(r.id), olt:String(r.olt_id), name:String(r.name),
                       cable:r.cable_id?String(r.cable_id):null,
                       strand:null,
                       serves:r.serves?String(r.serves):null });
      });

      var byCable={};
      rows(wb,'cable_points').forEach(function(r){
        (byCable[String(r.cable_id)] = byCable[String(r.cable_id)] || [])
          .push({ seq:Number(r.seq), at:[Number(r.lng), Number(r.lat)] });
      });
      rows(wb,'cables').forEach(function(r){
        var pl=(byCable[String(r.id)]||[]).sort(function(a,b){ return a.seq-b.seq; })
                 .map(function(x){ return x.at; });
        if (pl.length<2) return;
        N.cables.push({ id:String(r.id), cores:Number(r.cores), kind:String(r.kind),
                        note:String(r.note||''), path:pl });
      });

      rows(wb,'objects').forEach(function(r){
        var n={ id:String(r.id), type:String(r.type), name:String(r.name),
                cable:r.on_cable?String(r.on_cable):null,
                at:[Number(r.lng), Number(r.lat)], note:String(r.note||''),
                inCable:r.fed_by_cable?String(r.fed_by_cable):null,
                inStrand:r.fed_by_strand?Number(r.fed_by_strand):null };
        if (r.ratio) n.ratio=String(r.ratio);
        if (n.type==='COUPLER'||n.type==='SPLITTER') n.legs=makeLegs(n.type, n.ratio);
        if (n.type==='FATBOX'){
          n.no=String(r.fat_no||''); n.ports=Number(r.fat_ports||8); n.customers=[];
        }
        N.nodes.push(n);
      });

      /* reconnect the outputs once every object exists */
      rows(wb,'object_outputs').forEach(function(r){
        var n=N.nodes.filter(function(x){ return x.id===String(r.node_id); })[0];
        if (!n || !n.legs || !r.goes_to) return;
        var g=n.legs.filter(function(x){ return x.label===String(r.leg); })[0];
        if (!g) return;
        if (String(r.to_type)==='CABLE'){
          var m=String(r.goes_to).match(/^(.+) strand (\d+)$/);
          if (m) g.to={ kind:'CABLE', cable:m[1], strand:Number(m[2]) };
        } else if (r.to_type){
          g.to={ kind:String(r.to_type), node:String(r.goes_to) };
        }
      });

      rows(wb,'splices').forEach(function(r){
        N.splices.push({ id:String(r.id), joint:String(r.joint),
                         aCable:String(r.cable_a), aStrand:Number(r.strand_a),
                         bCable:String(r.cable_b), bStrand:Number(r.strand_b) });
      });

      rows(wb,'customers').forEach(function(r){
        var fb=N.nodes.filter(function(x){
          return x.type==='FATBOX' && x.name===String(r.fat_box); })[0];
        if (!fb) return;
        fb.customers.push({ port:Number(r.port), name:String(r.customer),
                            at:(r.lat!==''&&r.lng!=='')?[Number(r.lng),Number(r.lat)]:null });
      });

      D=N;
      normalizePortFibreLinks();
      sel={ cable:null, node:null, olt:null, office:null, port:null };
      view='home'; draft=null; custDraft=null; legPick=null; pick=null;
      persist(); draw(); render(); fitAll();
      markSaved('Loaded from Excel');
      setTimeout(markSaved, 2500);
    }catch(err){
      alert('That file could not be read.\n\n'+err.message+
            '\n\nUse a file this app produced with Save to Excel.');
    }
  };
  fr.readAsArrayBuffer(file);
}

function fitAll(){
  var pts=[];
  D.cables.forEach(function(c){ c.path.forEach(function(p){ pts.push(p); }); });
  D.nodes.forEach(function(n){ pts.push(n.at); });
  D.offices.forEach(function(o){ pts.push(o.at); });
  if (!pts.length || !ready) return;
  var bb=new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(function(p){ bb.extend(p); });
  map.fitBounds(bb, { padding:80, duration:600, maxZoom:17 });
}

/* Pull lat/lng straight out of a Google Maps URL. Short goo.gl links cannot be
   followed from a browser, so those are reported rather than guessed at. */
function coordsFromLink(url){
  if (!url) return null;

  function ok(la, lg){
    la=parseFloat(la); lg=parseFloat(lg);
    return (la>=-90 && la<=90 && lg>=-180 && lg<=180) ? [lg, la] : null;
  }

  /* A Google Maps URL can carry SEVERAL places — every one you looked at on
     the way is left in the data blob. The place the link is actually FOR is
     the last !3d..!4d pair, so read them all and take the final one. The @
     numbers are only where the map was scrolled to, so they come after. */
  var pairs=[], re=/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g, m;
  while ((m=re.exec(url)) !== null) pairs.push([m[1], m[2]]);
  if (pairs.length){
    var last=pairs[pairs.length-1];
    var hit=ok(last[0], last[1]);
    if (hit) return hit;
  }

  var pats=[
    /[?&]ll=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i,
    /[?&]sll=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i,
    /[?&]viewpoint=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i,
    /[?&](?:q|query|daddr|destination|center)=(-?\d+\.\d+)%2C(-?\d+\.\d+)/i,
    /[?&](?:q|query|daddr|destination|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i,
    /^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/,
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,          /* map centre — a rough fallback */
    /[@\/](-?\d+\.\d+),(-?\d+\.\d+),\d/
  ];
  for (var i=0;i<pats.length;i++){
    var mm=url.match(pats[i]);
    if (mm){
      var hit2=ok(mm[1], mm[2]);
      if (hit2) return hit2;
    }
  }
  return null;
}
function isShortLink(url){ return /goo\.gl|maps\.app|g\.co/.test(url||''); }

/* =========================================================================
   TRACE — follow the light backwards from any point to the OLT that feeds it.
   Returns steps in order from office to the thing asked about.
   ========================================================================= */
function traceTo(startKind, startId, extra){
  var steps=[], guard=0;

  function push(s){ steps.unshift(s); }

  /* what puts light onto this strand */
  function sourceOfStrand(cid, strand){
    var p=D.ports.filter(function(x){ return x.cable===cid && x.strand!=null && Number(x.strand)===Number(strand); })[0];
    if (p) return { kind:'PORT', port:p };
    var anchors=D.ports.filter(function(x){ return x.cable===cid && x.strand==null; });
    if (anchors.length===1) return { kind:'PORT_ANCHOR', port:anchors[0] };
    var found=null;
    D.nodes.forEach(function(n){
      (n.legs||[]).forEach(function(g){
        if (g.to && g.to.kind==='CABLE' && g.to.cable===cid && Number(g.to.strand)===Number(strand)){
          found={ kind:'LEG', node:n, leg:g };
        }
      });
    });
    if (found) return found;
    var sp=D.splices.filter(function(x){
      return (x.aCable===cid && Number(x.aStrand)===Number(strand)) ||
             (x.bCable===cid && Number(x.bStrand)===Number(strand)); })[0];
    if (sp){
      var other = (sp.aCable===cid && Number(sp.aStrand)===Number(strand))
        ? { cable:sp.bCable, strand:Number(sp.bStrand) }
        : { cable:sp.aCable, strand:Number(sp.aStrand) };
      return { kind:'SPLICE', splice:sp, other:other };
    }
    return null;
  }

  /* climb from a device or FAT box up to whatever feeds it */
  function fromNode(n){
    if (guard++ > 40) return;
    if (n.type==='FATBOX'){
      push({ icon:n.type, title:n.name, sub:'FAT box '+(n.no||''), id:n.id });
    } else {
      push({ icon:n.type, title:n.name, sub:typeName(n.type)+' '+(n.ratio||''), id:n.id });
    }
    var up=legFeedOf(n.id);
    if (up){
      /* record which output of the upstream device carries this */
      steps[0].via = up.leg.label + ' \u00b7 \u2212' + up.leg.loss.toFixed(2) + ' dB';
      fromNode(up.node);
      return;
    }
    if (n.inCable) fromStrand(n.inCable, n.inStrand);
  }

  function fromStrand(cid, strand){
    if (guard++ > 40) return;
    var c=cable(cid);
    push({ icon:'CABLE', title:cid, id:cid,
           sub:'strand '+(c?strandLabel(strand,c.cores):strand) });
    var src=sourceOfStrand(cid, strand);
    if (!src) return;

    if (src.kind==='PORT' || src.kind==='PORT_ANCHOR'){
      var o=olt(src.port.olt), off=o?office(o.office):null;
      push({ icon:'PORT', title:src.port.name, sub:src.kind==='PORT_ANCHOR' ? 'Port-to-fibre connection' : 'OLT port', id:src.port.id });
      if (o)   push({ icon:'OLT', title:o.name, sub:'OLT', id:o.id });
      if (off) push({ icon:'OFFICE', title:off.name, sub:'Office', id:off.id });
      return;
    }
    if (src.kind==='LEG'){
      fromNode(src.node);
      return;
    }
    if (src.kind==='SPLICE'){
      push({ icon:'JOINT', title:src.splice.joint, sub:'spliced', id:src.splice.joint });
      fromStrand(src.other.cable, src.other.strand);
      return;
    }
  }

  if (startKind==='CUSTOMER'){
    var fb=node(startId);
    var cu=extra;
    fromNode(fb);
    steps.push({ icon:'CUSTOMER', title:cu.name,
                 sub:'port '+String(cu.port).padStart(2,'0'), id:'cust' });
  } else if (startKind==='NODE'){
    fromNode(node(startId));
  } else if (startKind==='STRAND'){
    fromStrand(startId, extra);
  }
  return steps;
}

/* ---------- lookups ---------- */
function markerClass(t){
  return t==='JOINT' ? 'mk-joint'
       : t==='COUPLER' ? 'mk-coupler'
       : t==='SPLITTER' ? 'mk-splitter' : 'mk-fatbox';
}
function typeName(t){
  return t==='JOINT' ? 'Joint enclosure'
       : t==='COUPLER' ? 'Coupler'
       : t==='SPLITTER' ? 'Splitter' : 'FAT box';
}
function cable(id){ return D.cables.filter(function(c){ return c.id===id; })[0] || null; }
function node(id){ return D.nodes.filter(function(n){ return n.id===id; })[0] || null; }
function olt(id){ return D.olts.filter(function(o){ return o.id===id; })[0] || null; }
function office(id){ return D.offices.filter(function(o){ return o.id===id; })[0] || null; }
function nodesOn(cid){ return D.nodes.filter(function(n){ return n.cable===cid; }); }

/* Everything attached to a cable: joints cut into it, plus anything wired to
   one of its strands, plus anything fed by those. */
function servedBy(cid){
  var out=nodesOn(cid).slice();
  var seen={}; out.forEach(function(n){ seen[n.id]=1; });

  D.nodes.forEach(function(n){
    if (seen[n.id]) return;
    if (n.inCable===cid){ out.push(n); seen[n.id]=1; }
  });
  /* one more hop: a FAT box hanging off a device that is wired to this cable */
  D.nodes.forEach(function(n){
    if (seen[n.id]) return;
    var up=legFeedOf(n.id);
    if (up && seen[up.node.id]){ out.push(n); seen[n.id]=1; }
  });
  return out;
}
function splicesAt(jid){ return D.splices.filter(function(s){ return s.joint===jid; }); }
function portsUsing(cid){ return D.ports.filter(function(p){ return p.cable===cid; }); }

/* A strand is one physical optical path. In this application a strand has
   ONE connection assignment only. Once it is connected to an OLT port, joint
   splice, device input/output, FAT box, or another fibre, it is occupied and
   cannot be selected again for a different connection. */
function strandUses(cid){
  var c=cable(cid);
  var out = {};
  /* role: SOURCE puts light onto the strand, SINK takes it off.
     EITHER is a splice, which can act as either end. */
  function add(strand, who, at, role, id){
    if (!strand) return;
    var along = (at && c) ? snapToPath(at, c.path).along : 0;
    (out[strand] = out[strand] || []).push({ who:who, along:along, role:role, id:id||'' });
  }

  portsUsing(cid).forEach(function(p){
    var o=olt(p.olt), off=o?office(o.office):null;
    add(p.strand, (o?o.name:'OLT')+' / '+p.name, off?off.at:null, 'SOURCE', p.id);
  });
  D.splices.forEach(function(s){
    var j=node(s.joint);
    if (s.aCable===cid) add(s.aStrand, 'spliced at '+s.joint, j?j.at:null, 'EITHER', s.id);
    if (s.bCable===cid) add(s.bStrand, 'spliced at '+s.joint, j?j.at:null, 'EITHER', s.id);
  });
  D.nodes.forEach(function(n){
    if (n.inCable===cid) add(n.inStrand, 'feeds '+n.name, n.at, 'SINK', n.id);
    if (!n.legs) return;
    n.legs.forEach(function(g){
      if (g.to && g.to.kind==='CABLE' && g.to.cable===cid){
        add(g.to.strand, n.name+' \u00b7 '+g.label, n.at, 'SOURCE', n.id);
      }
    });
  });

  /* order each strand's attachments along the cable, so they read start to end */
  Object.keys(out).forEach(function(k){
    out[k].sort(function(a,b){ return a.along-b.along; });
  });
  return out;
}

function strandEndsUsed(uses, n){ return (uses[n]||[]).length; }

/* One strand, one connection. This is intentionally stricter than the
   original two-end model: any existing attachment makes the strand occupied.
   The UI may explicitly allow the current attachment when editing/changing it. */
function attachCheck(uses, n, along, role){
  var a=uses[n]||[];
  if (!a.length) return { ok:true };
  return { ok:false, why:'already connected: '+a.map(function(x){ return x.who; }).join(' \u2192 ') };
}

/* kept for callers that only want a yes or no */
function canAttachAt(uses, n, along, role){
  return attachCheck(uses, n, along, role||'SINK').ok;
}

/* What to show next to a strand: the chain of what it runs between. */
function strandStatus(uses, n){
  var a=uses[n]||[];
  if (!a.length) return { text:'Free', cls:'free' };
  if (a.length===1) return { text:a[0].who, cls:'dim' };
  return { text:a.map(function(x){ return x.who; }).join(' \u2192 '), cls:'dim' };
}

/* The same chain, with how far along the cable each point sits. */
function strandChain(uses, n){
  return (uses[n]||[]).map(function(x){
    return x.who+' ('+fmtM(x.along)+')';
  }).join(' \u2192 ');
}

/* kept for the places that only need a yes/no */
function strandUsers(cid){
  var uses=strandUses(cid), out={};
  Object.keys(uses).forEach(function(k){
    if (uses[k].length>=2) out[k]=strandStatus(uses,k).text;
  });
  return out;
}

/* How many ports of a FAT box are taken. Derived, never typed. */
function usedPorts(n){ return (n.customers||[]).length; }
function customerOn(n, port){
  var list=n.customers||[];
  for (var i=0;i<list.length;i++) if (list[i].port===port) return list[i];
  return null;
}
function firstFreePort(n){
  for (var p=1;p<=n.ports;p++) if (!customerOn(n,p)) return p;
  return null;
}

/* What feeds a FAT box, if anything. */
function feedOf(fatId){
  for (var i=0;i<D.nodes.length;i++){
    var n=D.nodes[i];
    if (!n.legs) continue;
    for (var j=0;j<n.legs.length;j++){
      var g=n.legs[j];
      if (g.to && g.to.kind==='FATBOX' && g.to.node===fatId) return { node:n, leg:g };
    }
  }
  var f=node(fatId);
  if (f && f.inCable) return { direct:true, node:f, leg:null };
  return null;
}
function freeCount(c){
  var u=strandUses(c.id), n=0;
  for (var i=1;i<=c.cores;i++) if (!(u[i]||[]).length) n++;
  return n;
}

/* =========================================================================
   TRACE — walk backwards from a customer to the OLT port that serves them.
   Each step carries a short label and one line of detail, nothing more.
   ========================================================================= */
function traceCustomer(fat, cust){
  /* View Path only: reconstruct the customer's complete upstream route.
     Port-to-fibre is an anchor and does not consume a strand. Explicit
     strand relationships (splice/device connections) are followed from the
     customer side back toward the serving OLT port. A serving port is chosen
     by its customer/FAT mapping, so multiple ports on the same cable do not
     make the path ambiguous. */
  var back=[], seen={}, guard=0;

  function add(key, step){
    if (seen[key]) return false;
    seen[key]=1;
    back.push(step);
    return true;
  }

  function servingPortForCable(cid, fatId){
    var ps=portsUsing(cid);
    var serving=ps.filter(function(p){ return p.serves && p.serves===fatId; });
    if (serving.length) return serving[0];
    return null;
  }

  function anyPortForCable(cid){
    var ps=portsUsing(cid);
    return ps.length===1 ? ps[0] : null;
  }

  function sourceForStrand(cid, strand, fatId, exceptSpliceId){
    /* First resolve the serving OLT port. Port-to-fibre is an anchor only;
       it deliberately has no strand assignment. */
    var serving=servingPortForCable(cid, fatId);
    if (serving) return {kind:'PORT_ANCHOR',port:serving};

    /* Then follow an explicit device output feeding this exact strand. */
    for (var i=0;i<D.nodes.length;i++){
      var n=D.nodes[i];
      if (!n.legs) continue;
      for (var j=0;j<n.legs.length;j++){
        var g=n.legs[j];
        if (g.to && g.to.kind==='CABLE' && g.to.cable===cid &&
            Number(g.to.strand)===Number(strand)){
          return {kind:'LEG',node:n,leg:g};
        }
      }
    }

    /* Finally cross an explicit splice into the upstream cable. */
    for (var k=0;k<D.splices.length;k++){
      var sp=D.splices[k];
      if (sp.id===exceptSpliceId) continue;
      if (sp.aCable===cid && Number(sp.aStrand)===Number(strand)){
        return {kind:'SPLICE',splice:sp,
          other:{cable:sp.bCable,strand:Number(sp.bStrand)}};
      }
      if (sp.bCable===cid && Number(sp.bStrand)===Number(strand)){
        return {kind:'SPLICE',splice:sp,
          other:{cable:sp.aCable,strand:Number(sp.aStrand)}};
      }
    }

    var p=anyPortForCable(cid);
    if (p) return {kind:'PORT_ANCHOR',port:p};
    return null;
  }

  function walkNode(n){
    if (!n || guard++>100) return;
    var nodeKey='NODE:'+n.id;
    if (!add(nodeKey,{icon:n.type,title:n.name,
      sub:n.type==='FATBOX' ? 'FAT box '+(n.no||'') :
        typeName(n.type)+' '+(n.ratio||''),id:n.id})) return;

    /* Device output feeding this node. */
    var up=legFeedOf(n.id);
    if (up){
      walkNode(up.node);
      return;
    }

    /* Explicit fibre input to this node. */
    if (n.inCable){
      walkStrand(n.inCable,
        n.inStrand!=null ? Number(n.inStrand) : null,
        fat.id);
    }
  }

  function walkStrand(cid,strand,fatId,exceptSpliceId){
    if (!cid || guard++>100) return;
    var c=cable(cid);
    var label=strand!=null
      ? 'strand '+(c?strandLabel(strand,c.cores):strand)
      : 'port-to-fibre connection';
    if (!add('CABLE:'+cid+':'+(strand==null?'anchor':strand),
        {icon:'CABLE',title:cid,sub:label,id:cid+':'+(strand==null?'anchor':strand)})) return;

    var src;
    if (strand==null){
      src={kind:'PORT_ANCHOR',port:servingPortForCable(cid,fatId)||anyPortForCable(cid)};
    } else {
      src=sourceForStrand(cid,strand,fatId,exceptSpliceId);
    }
    if (!src || !src.port && src.kind==='PORT_ANCHOR') return;

    if (src.kind==='PORT_ANCHOR'){
      var o=olt(src.port.olt), off=o?office(o.office):null;
      add('PORT:'+src.port.id,{icon:'PORT',title:src.port.name,
        sub:'Port-to-fibre connection',id:src.port.id});
      if (o) add('OLT:'+o.id,{icon:'OLT',title:o.name,sub:'OLT',id:o.id});
      if (off) add('OFFICE:'+off.id,{icon:'OFFICE',title:off.name,sub:'Office',id:off.id});
      return;
    }

    if (src.kind==='LEG'){
      walkNode(src.node);
      return;
    }

    if (src.kind==='SPLICE'){
      add('SPLICE:'+src.splice.id,{icon:'JOINT',title:src.splice.joint,
        sub:'spliced to '+src.other.cable+' · strand '+src.other.strand,
        id:src.splice.joint+':'+src.splice.id});
      walkStrand(src.other.cable,src.other.strand,fatId,src.splice.id);
    }
  }

  walkNode(fat);

  /* Customer is intentionally the final step. */
  var customerStep={icon:'CUSTOMER',title:cust.name,
    sub:'port '+String(cust.port).padStart(2,'0'),id:'cust:'+fat.id+':'+cust.port};
  var network=back.slice().reverse();
  network.push(customerStep);
  return network;
}

/* What puts light onto this strand, other than the thing asking. */
function upstreamOf(cableId, strand, exceptNodeId){
  var p=D.ports.filter(function(x){
    return x.cable===cableId && x.strand!=null && Number(x.strand)===Number(strand); })[0];
  if (p) return { port:p };
  var anchors=D.ports.filter(function(x){ return x.cable===cableId && x.strand==null; });
  if (anchors.length===1) return { port:anchors[0], anchorOnly:true };

  for (var i=0;i<D.nodes.length;i++){
    var n=D.nodes[i];
    if (n.id===exceptNodeId || !n.legs) continue;
    for (var j=0;j<n.legs.length;j++){
      var g=n.legs[j];
      if (g.to && g.to.kind==='CABLE' && g.to.cable===cableId &&
          Number(g.to.strand)===Number(strand)) return { node:n };
    }
  }
  for (var k=0;k<D.splices.length;k++){
    var sp=D.splices[k];
    if (sp.aCable===cableId && Number(sp.aStrand)===Number(strand))
      return { splice:sp, other:{ cable:sp.bCable, strand:sp.bStrand } };
    if (sp.bCable===cableId && Number(sp.bStrand)===Number(strand))
      return { splice:sp, other:{ cable:sp.aCable, strand:sp.aStrand } };
  }
  return null;
}

/* Every customer on the map, with the box they hang off. */
function allCustomers(){
  var out=[];
  D.nodes.forEach(function(n){
    if (n.type!=='FATBOX') return;
    (n.customers||[]).forEach(function(c){ out.push({ fat:n, cust:c }); });
  });
  return out;
}

/* ---------- geometry ---------- */
function metres(a,b){
  var R=6371000,t1=a[1]*Math.PI/180,t2=b[1]*Math.PI/180;
  var dt=(b[1]-a[1])*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180;
  var x=Math.sin(dt/2)*Math.sin(dt/2)+Math.cos(t1)*Math.cos(t2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmtM(m){ return m>=1000 ? (m/1000).toFixed(2)+' km' : Math.round(m)+' m'; }
function pathLen(p){ var t=0; for(var i=1;i<p.length;i++) t+=metres(p[i-1],p[i]); return t; }

/* nearest point on a polyline — so plant snaps onto its cable */
function snapToPath(pt, path){
  var best=null, bd=Infinity, bAlong=0, run=0;
  for (var i=1;i<path.length;i++){
    var a=path[i-1], b=path[i];
    var dx=b[0]-a[0], dy=b[1]-a[1];
    var len2=dx*dx+dy*dy;
    var t = len2 ? ((pt[0]-a[0])*dx + (pt[1]-a[1])*dy)/len2 : 0;
    t = Math.max(0, Math.min(1, t));
    var q=[a[0]+t*dx, a[1]+t*dy];
    var d=metres(pt,q);
    if (d<bd){ bd=d; best=q; bAlong=run+metres(a,q); }
    run+=metres(a,b);
  }
  return { at:best, dist:bd, along:bAlong };
}

function nextId(prefix, list){
  var n=1;
  while (list.some(function(x){ return x.id === prefix+'-'+String(n).padStart(3,'0'); })) n++;
  return prefix+'-'+String(n).padStart(3,'0');
}

/* ============================================================
   MAP
   ============================================================ */
map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[73.8781,18.5305], zoom:14.3
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');

map.on('load', function(){
  map.addSource('cables',{ type:'geojson', data:{type:'FeatureCollection',features:[]} });
  map.addLayer({ id:'cables-line', type:'line', source:'cables',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','color'],'line-width':['get','w'],'line-opacity':['get','o']} });

  /* A cable on the map is clickable, so nothing is findable only through the list. */
  map.on('click','cables-line', function(e){
    if (draft || custDraft || role==='sales') return;
    var id=e.features && e.features[0] && e.features[0].properties.id;
    if (!id) return;
    e.originalEvent.stopPropagation();
    sel.cable=id; view='cable'; draw(); render();
  });
  map.on('mouseenter','cables-line', function(){ map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','cables-line', function(){ map.getCanvas().style.cursor=''; });

  map.addSource('svc',{ type:'geojson', data:{type:'FeatureCollection',features:[]} });
  map.addLayer({ id:'svc-line', type:'line', source:'svc',
    paint:{'line-color':['get','color'],'line-width':3,'line-opacity':['get','o'],
           'line-dasharray':[1.5,1.6]} });

  map.addSource('links',{ type:'geojson', data:{type:'FeatureCollection',features:[]} });
  map.addLayer({ id:'links-line', type:'line', source:'links',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','color'],'line-width':['get','w'],
           'line-opacity':['get','o'],'line-dasharray':[2,1.3]} });

  map.addSource('draft',{ type:'geojson', data:{type:'FeatureCollection',features:[]} });
  map.addLayer({ id:'draft-line', type:'line', source:'draft',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#1A73E8','line-width':4,'line-dasharray':[2,1.4]} });

  ready=true;
  if (online()){
    pullFromServer().then(function(got){
      if (!got) restore();
      finishBoot();
    });
  } else {
    restore();
    finishBoot();
  }
});

/* One place where the app becomes live, so every screen is built from the
   same data. Called once, whichever way the load went. */
function finishBoot(){
  if (booted) return;
  booted=true;
  draw();
  showPage(mode==='map' ? 'map' : 'dash');
  fitAll();
}

/* If the map tiles never arrive, still show the network rather than nothing. */
setTimeout(function(){
  if (!booted){ restore(); booted=true; showPage('dash'); }
}, 6000);

map.on('click', function(e){
  var pt=[e.lngLat.lng, e.lngLat.lat];

  if (tab==='nearby' && view==='home'){
    salesPoint=pt;
    nbMsg={ cls:'good', text:'Point set at '+pt[1].toFixed(6)+', '+pt[0].toFixed(6) };
    draw(); render(); return;
  }

  if (custDraft){ custDraft.at=pt; draw(); render(); return; }
  if (!draft) return;

  if (draft.kind==='office'){
    draft.at=pt; draw(); render();
  } else if (draft.kind==='route'){
    draft.path.push(pt); draw(); render();
  } else if (draft.kind==='node'){
    if (draft.type!=='JOINT'){
      /* Only a joint is spliced into the cable itself. A coupler, splitter or
         FAT box sits on a pole or a wall and is wired back to a strand. */
      draft.at=pt; draft.off=null;
    } else {
      var c=cable(draft.cable);
      var sn=snapToPath(pt, c.path);
      draft.at=sn.at; draft.off=sn.dist;
    }
    draw(); render();
  }
});

function clearMarkers(){ markers.forEach(function(m){ m.remove(); }); markers=[]; }
function mk(at, cls, title, onClick){
  var el=document.createElement('div');
  el.className='mk '+cls;
  if (title) el.title=title;
  if (onClick) el.onclick=function(ev){ ev.stopPropagation(); onClick(); };
  markers.push(new maplibregl.Marker({element:el}).setLngLat(at).addTo(map));
  return el;
}
function popAt(at, html){
  if (popup) popup.remove();
  popup=new maplibregl.Popup({closeButton:true, maxWidth:'290px'})
    .setLngLat(at).setHTML(html).addTo(map);
}

function draw(){
  persist();
  if (!ready) return;
  clearMarkers();
  var phys = (layer!=='service'), serv = (layer!=='physical');
  if (role==='sales'){ phys=true; serv=false; }

  /* cables */
  map.getSource('cables').setData({ type:'FeatureCollection', features:
    D.cables.map(function(c){
      var lit = !sel.cable || sel.cable===c.id;
      return { type:'Feature',
        properties:{ id:c.id,
                     color: sel.cable===c.id ? '#1A73E8' : '#37474F',
                     w: 2+Math.min(6, c.cores/6),
                     o: phys ? (lit?.95:.15) : 0 },
        geometry:{ type:'LineString', coordinates:c.path } };
    })
  });

  /* service overlay */
  var sf=[];
  if (serv){
    D.ports.forEach(function(p){
      if (!p.serves) return;
      var o=olt(p.olt); if(!o) return;
      var off=office(o.office), tgt=node(p.serves);
      if (!off||!tgt) return;
      var lit = !sel.olt || sel.olt===p.olt;
      sf.push({ type:'Feature',
        properties:{ color:strandHex(p.strand), o: lit?.9:.1 },
        geometry:{ type:'LineString', coordinates:[off.at, tgt.at] } });
    });
  }
  map.getSource('svc').setData({ type:'FeatureCollection', features:sf });

  /* --- connections: device to what it feeds, cable to FAT, FAT to customer --- */
  var links=[];
  if (phys){
    function line(a,bp,colour,width){
      links.push({ type:'Feature', properties:{ color:colour, w:width, o:.9 },
                   geometry:{ type:'LineString', coordinates:[a,bp] } });
    }
    var DEVC={ COUPLER:'#4527A0', SPLITTER:'#00838F', JOINT:'#263238', FATBOX:'#C2185B' };

    D.nodes.forEach(function(n){
      // what a device output feeds
      if (n.legs){
        n.legs.forEach(function(g){
          if (!g.to) return;
          if (g.to.kind==='FATBOX' || g.to.kind==='DEVICE'){
            var t=node(g.to.node);
            if (t) line(n.at, t.at, DEVC[n.type], 2.5);
          }
        });
      }
      // a FAT box or device fed straight off a strand: draw from the cable to it
      if (n.inCable){
        var c0=cable(n.inCable);
        if (c0){
          var sp=snapToPath(n.at, c0.path);
          line(sp.at, n.at, strandHex(n.inStrand)==='#FFFFFF' ? '#9AA0A6' : strandHex(n.inStrand), 2);
        }
      }
      // drop cables out to each customer
      if (n.type==='FATBOX'){
        (n.customers||[]).forEach(function(cu){
          if (cu.at) line(n.at, cu.at, DEVC.FATBOX, 1.6);
        });
      }
    });
  }
  map.getSource('links').setData({ type:'FeatureCollection', features:links });

  /* draft route */
  map.getSource('draft').setData({ type:'FeatureCollection', features:
    (draft && draft.kind==='route' && draft.path.length>1)
      ? [{ type:'Feature', properties:{}, geometry:{type:'LineString',coordinates:draft.path} }]
      : []
  });

  /* plant */
  if (phys){
    D.nodes.forEach(function(n){
      var fade = sel.cable && sel.cable!==n.cable;
      mk(n.at, markerClass(n.type)+(fade?' fade':''), n.name, function(){ nodePopup(n); });
    });
  }
  if (serv){
    D.offices.forEach(function(o){ mk(o.at,'mk-office',o.name,function(){ officePopup(o); }); });
  }

  /* customers, at the far end of their drop cable */
  if (phys){
    D.nodes.forEach(function(n){
      if (n.type!=='FATBOX') return;
      (n.customers||[]).forEach(function(cu){
        if (!cu.at) return;
        mk(cu.at, 'mk-cust', cu.name, function(){
          popAt(cu.at, '<h4>'+esc(cu.name)+'</h4>'+
            '<div class="kv"><b>Connected to:</b> '+esc(n.name)+'</div>'+
            '<div class="kv"><b>Port:</b> '+String(cu.port).padStart(2,'0')+'</div>'+
            '<div class="kv"><b>Drop length:</b> '+fmtM(metres(n.at, cu.at))+'</div>');
        });
      });
    });
  }

  /* a customer being placed right now */
  if (custDraft && custDraft.at) mk(custDraft.at, 'mk-cust', 'new customer');

  /* draft markers */
  if (draft && draft.kind==='route'){
    draft.path.forEach(function(p){ mk(p,'mk-vtx',''); });
  }
  if (draft && draft.kind==='office' && draft.at) mk(draft.at,'mk-office','new office');
  if (draft && draft.kind==='node' && draft.at){
    mk(draft.at, markerClass(draft.type), 'new');
  }
  if (salesPoint) mk(salesPoint,'mk-here','');

  legend();
}

/* ---------- popups ---------- */
function feedLine(n){
  var up=legFeedOf(n.id);
  if (up) return up.node.name+' \u00b7 '+up.leg.label;
  if (n.inCable){
    var c=cable(n.inCable);
    return n.inCable+' \u00b7 strand '+strandLabel(n.inStrand, c?c.cores:12);
  }
  return null;
}

/* ---------- marker popups: one fact per line, in the agreed order ---------- */
function prow(k, v){
  return '<div class="prow"><span>'+esc(k)+'</span>'+esc(v==null||v===''?'\u2014':String(v))+'</div>';
}
function idPart(x){ return (x && x.id && x.id!==x.name) ? ' \u00b7 '+x.id : ''; }

function inputLine(n){
  var up=legFeedOf(n.id);
  if (up) return up.node.name+idPart(up.node)+' \u00b7 '+up.leg.label;
  if (n.inCable){
    var c=cable(n.inCable);
    return n.inCable+(c?' \u00b7 '+c.cores+'F':'')+
           (n.inStrand ? ' \u00b7 strand '+strandLabel(n.inStrand, c?c.cores:12) : '');
  }
  return null;
}

function legLine(g){
  if (!g || !g.to) return 'not connected';
  if (g.to.kind==='CABLE'){
    var c=cable(g.to.cable);
    return g.to.cable+' \u00b7 strand '+strandLabel(g.to.strand, c?c.cores:12);
  }
  var t=node(g.to.node);
  return t ? t.name+idPart(t) : 'missing';
}

function onCableLine(n){
  var c = n.cable ? cable(n.cable) : (n.inCable ? cable(n.inCable) : null);
  var cur=n, guard=0, seen={};
  while (!c && cur && guard++ < 20 && !seen[cur.id]){
    seen[cur.id]=1;
    var up=legFeedOf(cur.id);
    if (!up) break;
    cur=up.node;
    c = cur.cable ? cable(cur.cable) : (cur.inCable ? cable(cur.inCable) : null);
  }
  return c ? c.id+' \u00b7 '+c.cores+'F' : null;
}

function nodePopup(n){
  var h='<h4>'+esc(n.name)+'</h4>';

  if (n.type==='COUPLER'){
    var sp=couplerSpec(n.ratio);
    var legT=(n.legs||[]).filter(function(g){ return g.id==='tap'; })[0];
    var legP=(n.legs||[]).filter(function(g){ return g.id==='pass'; })[0];
    h+='<div class="ptype">Coupler</div>'+
       prow('Type', 'Coupler ('+n.ratio+')')+
       prow('Coupler ID', n.id)+
       prow('On cable', onCableLine(n))+
       prow('Ratio', n.ratio)+
       prow('Input', inputLine(n))+
       prow('Output '+sp.tap+'%', legLine(legT))+
       prow('Output '+sp.pass+'%', legLine(legP));

  } else if (n.type==='SPLITTER'){
    var conn=(n.legs||[]).filter(function(g){ return g.to; }).length;
    h+='<div class="ptype">Splitter</div>'+
       prow('Type', 'Splitter ('+n.ratio+')')+
       prow('Splitter ID', n.id)+
       prow('On cable', onCableLine(n))+
       prow('Ratio', n.ratio)+
       prow('Input', inputLine(n))+
       prow('Output', conn+' of '+(n.legs||[]).length+' connected');

  } else if (n.type==='FATBOX'){
    var used=usedPorts(n);
    h+='<div class="ptype">FAT box</div>'+
       prow('Type', 'FAT Box')+
       prow('FAT Box ID', n.id)+
       prow('FAT Box number', n.no)+
       prow('On cable', onCableLine(n))+
       prow('Input', inputLine(n))+
       prow('Output free', (n.ports-used)+' of '+n.ports)+
       prow('Output occupied', used);

  } else if (n.type==='JOINT'){
    var sps=splicesAt(n.id);
    var joined=[];
    sps.forEach(function(x){
      var ca=cable(x.aCable), cb=cable(x.bCable);
      joined.push(x.aCable+' \u2013 '+strandLabel(x.aStrand, ca?ca.cores:12));
      joined.push(x.bCable+' \u2013 '+strandLabel(x.bStrand, cb?cb.cores:12));
    });
    h+='<div class="ptype">Joint enclosure</div>'+
       prow('Type', 'Joint Enclosure (JE)')+
       prow('Splices', sps.length)+
       prow('On cable', onCableLine(n))+
       prow('Input', inputLine(n))+
       prow('Spliced', joined.length ? joined.join(', ') : 'nothing spliced yet');
  }

  popAt(n.at, h+'<button class="btn sm" id="popOpen" style="width:100%;margin-top:9px">Open</button>');

  var host=document.getElementById('__pop') || document;
  var b=host.querySelector('#popOpen');
  if (b) b.onclick=function(){ if(popup)popup.remove(); sel.node=n.id; view='node'; draw(); render(); };
}

function officePopup(o){
  var olts=D.olts.filter(function(x){ return x.office===o.id; });
  var ports=D.ports.filter(function(p){
    return olts.some(function(x){ return x.id===p.olt; }); });
  var cables={};
  ports.forEach(function(p){ if (p.cable) cables[p.cable]=1; });

  /* which OLT the chips are showing, remembered between clicks */
  if (!popOlt || !olts.some(function(x){ return x.id===popOlt; })){
    popOlt = olts.length ? olts[0].id : null;
  }
  var shown=D.ports.filter(function(p){ return p.olt===popOlt; });

  var h='<h4>'+esc(o.name)+'</h4>'+
    '<div class="ptype">Office</div>'+
    prow('OLTs', olts.length)+
    prow('Ports', ports.length)+
    prow('Fibres', Object.keys(cables).length);

  if (olts.length){
    h+='<div class="psec">OLT</div><div class="pchips">'+
      olts.map(function(ol){
        var n=D.ports.filter(function(p){ return p.olt===ol.id; }).length;
        return '<button class="pchip'+(ol.id===popOlt?' on':'')+'" data-olt="'+esc(ol.id)+'">'+
               esc(ol.name)+' ('+n+')</button>';
      }).join('')+'</div>';

    h+='<div class="psec">Port</div><div class="pchips">'+
      (shown.length
        ? shown.map(function(p){
            return '<button class="pchip'+(p.cable?' lit':'')+'" data-port="'+esc(p.id)+'">'+
                   esc(p.name)+(p.cable?' \u00b7 '+esc(p.cable):'')+'</button>';
          }).join('')
        : '<span class="pnone">No ports yet</span>')+'</div>';
  }

  popAt(o.at, h);

  var host=document.getElementById('__pop') || document;
  [].slice.call(host.querySelectorAll('.pchip[data-olt]')).forEach(function(btn){
    btn.onclick=function(){ popOlt=btn.getAttribute('data-olt'); officePopup(o); };
  });
  [].slice.call(host.querySelectorAll('.pchip[data-port]')).forEach(function(btn){
    btn.onclick=function(){
      var pid=btn.getAttribute('data-port');
      var p=D.ports.filter(function(x){ return x.id===pid; })[0];
      if (!p) return;
      if (popup) popup.remove();
      sel.office=o.id; sel.olt=p.olt; sel.port=p.id;
      view='port'; draw(); render();
    };
  });
}

/* Work out the office / OLT / port a cable hangs off, so every page below it
   can show the same chain the operator followed to get there. */
function chainOfCable(cid){
  var p=D.ports.filter(function(x){ return x.cable===cid; })[0];
  if (!p) return {};
  var ol=olt(p.olt), of=ol?office(ol.office):null;
  return { office:of?of.name:'', olt:ol?ol.name:'', port:p.name };
}

function ctx(){
  var c=$('ctx');
  var tb=document.querySelector('.tabs');
  if (tb) tb.style.display = (mode==='dash') ? 'none' : '';

  var rows=[];
  function row(k,v){ if (v) rows.push([k,v]); }

  /* the chain we are working inside, if any */
  var ch={};
  if (sel.office){ var o0=office(sel.office); if (o0) ch.office=o0.name; }
  if (sel.olt){
    var ol0=olt(sel.olt);
    if (ol0){ ch.olt=ol0.name; var of0=office(ol0.office); if (of0) ch.office=of0.name; }
  }
  if (sel.port){
    var p0=D.ports.filter(function(x){ return x.id===sel.port; })[0];
    if (p0){
      ch.port=p0.name;
      var ol1=olt(p0.olt);
      if (ol1){ ch.olt=ol1.name; var of1=office(ol1.office); if (of1) ch.office=of1.name; }
    }
  }

  var theCable = sel.cable ? cable(sel.cable)
               : (sel.node && node(sel.node) && node(sel.node).cable) ? cable(node(sel.node).cable)
               : (sel.node && node(sel.node) && node(sel.node).inCable) ? cable(node(sel.node).inCable)
               : (draft && draft.kind==='node' && draft.cable) ? cable(draft.cable)
               : null;
  if (theCable){
    var cc=chainOfCable(theCable.id);
    if (cc.office && !ch.office) ch.office=cc.office;
    if (cc.olt && !ch.olt) ch.olt=cc.olt;
    if (cc.port && !ch.port) ch.port=cc.port;
  }

  var cableLine = theCable
    ? theCable.id+' \u00b7 '+theCable.cores+' core \u00b7 '+fmtM(pathLen(theCable.path))
    : '';

  /* ---- what the operator is actually doing ---- */
  if (draft && draft.kind==='office'){
    row('Details','Add office address');
  }
  else if (draft && draft.kind==='route'){
    row('Office name', ch.office); row('OLT details', ch.olt); row('Port details', ch.port);
    row('Details','Draw the cable');
  }
  else if (draft && draft.kind==='node'){
    row('Office name', ch.office); row('OLT details', ch.olt); row('Port details', ch.port);
    row('Details', cableLine || ('Place the '+typeName(draft.type).toLowerCase()));
  }
  else if (custDraft){
    var fb0=node(custDraft.node);
    row('FAT box', fb0?fb0.name:''); row('Details','Connect a customer to port '+custDraft.port);
  }
  else if (view==='office'){
    row('Office name', ch.office); row('Details','Add OLT(s)');
  }
  else if (view==='olt'){
    row('Office name', ch.office); row('OLT details', ch.olt); row('Details','Add port(s)');
  }
  else if (view==='port'){
    row('Office name', ch.office); row('OLT details', ch.olt); row('Port details', ch.port);
    row('Details', cableLine || 'Draw the cable');
  }
  else if (view==='cable' || view==='editCable'){
    row('Office name', ch.office); row('OLT details', ch.olt); row('Port details', ch.port);
    row('Details', cableLine);
  }
  else if (view==='node' || view==='editNode' || view==='splice' ||
           view==='pickstrand' || view==='pickleg'){
    var nd=node(sel.node);
    row('Office name', ch.office); row('OLT details', ch.olt); row('Port details', ch.port);
    row('Details', (nd ? typeName(nd.type)+' '+nd.name : '') + (cableLine ? ' \u00b7 '+cableLine : ''));
  }
  else if (view==='summary'){ row('Details','Network summary'); }
  else if (view==='settings'){ row('Details', API ? 'Connected to a sheet' : 'Working offline'); }
  else if (tab==='cables'){
    row('See all', 'Fibre cables and their details');
    row('Details', D.cables.length+' on the map');
  }
  else if (tab==='nearby'){
    row('See all', 'Objects near a point');
    row('Details', salesPoint ? salesPoint[1].toFixed(5)+', '+salesPoint[0].toFixed(5) : 'No point set');
  }
  else {
    row('See all', 'Offices and their details');
    row('Details', D.offices.length+' on the map');
  }

  c.innerHTML=rows.map(function(r){
    return '<div class="ctx__row"><span class="ctx__k">'+esc(r[0])+'</span>'+
           '<span class="ctx__v">'+esc(r[1])+'</span></div>';
  }).join('');
}

}

function routeDraft(b,f){

    ? D.ports.filter(function(x){ return x.id===draft.fromPort; })[0] : null;
